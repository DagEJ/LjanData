<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europa i krig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d11; --panel:#0e161c; --panel2:#131e26; --panel3:#182630; --line:#1f2e38; --line2:#2b3f4b;
  --text:#d9e2e6; --dim:#7f939d; --faint:#4f6370; --accent:#e0a63a; --accent2:#f4c873; --red:#e2574c; --red2:#ff8a7f; --green:#5cbf7a; --blue:#58a9dc; --pp:#b58cff;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --ui:'Rajdhani',system-ui,sans-serif; --head:'Oswald','Rajdhani',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:var(--ui);font-weight:600;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:6px 10px;cursor:pointer;letter-spacing:.03em;transition:border-color .15s,background .15s,color .15s}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent2)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:linear-gradient(#e8b04a,#cf922b);color:#1a1205;border-color:#e8b04a}
button.primary:hover:not(:disabled){background:linear-gradient(#f4c873,#e0a63a);color:#1a1205}
button.danger{background:linear-gradient(#c8473d,#a3352d);border-color:#d85a50;color:#fff}
button.danger:hover:not(:disabled){background:linear-gradient(#e2574c,#bf3f35);color:#fff;border-color:#ff8a7f}
button.on{border-color:var(--accent);color:var(--accent2);background:#2a2214}
.mono{font-family:var(--mono)}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* toppfelt */
#top{display:flex;align-items:center;gap:10px;padding:7px 14px;background:linear-gradient(#111b22,#0b1217);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:58px;position:relative;z-index:5;box-shadow:0 4px 18px #0007}
.brand{font-family:var(--head);font-weight:600;font-size:21px;letter-spacing:.16em;color:var(--accent2);white-space:nowrap;line-height:1}
.brand small{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.32em;color:var(--dim);font-weight:700;margin-top:3px}
.res{display:flex;align-items:center;gap:7px;padding:4px 9px 4px 7px;background:#0f191f;border:1px solid var(--line);border-radius:6px;min-width:104px}
.res svg{flex:none;opacity:.9}
.res .v{display:flex;flex-direction:column;line-height:1.05}
.res label{font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;font-weight:700}
.res b{font-family:var(--mono);font-size:16px;font-weight:600;color:#fff}
.res i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--green)}
.res.pp b{color:#e2d2ff}.res.pp i{color:var(--pp)}
.nation{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:500;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #0009;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px #ffffff22}
.spacer{flex:1}
.ctrl{display:flex;gap:4px}
.menu{position:relative}
#menu{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:6px;min-width:170px;box-shadow:0 10px 30px #000a;z-index:30}
#menu button{text-align:left}
.goal{min-width:120px}
.goalbar{height:6px;background:#1d2a33;border-radius:3px;overflow:hidden;margin-top:5px;width:110px}
.goalbar div{height:100%;background:linear-gradient(90deg,#cf922b,#f4c873)}
.clock{font-family:var(--mono);font-size:13px;color:#fff;line-height:1.15}
.clock span{display:block;font-size:10.5px;color:var(--dim)}
/* hoveddel */
#main{position:relative;display:grid;grid-template-columns:1fr 360px;min-height:0}
#mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:#071219}
#mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#000a 100%)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.drag{cursor:grabbing}
svg#map.target{cursor:crosshair}
.region{stroke:#00000055;stroke-width:.5;transition:fill .8s}
.region:hover{filter:brightness(1.22) saturate(1.1)}
.cborder{fill:none;stroke:#040709;stroke-width:1.6;pointer-events:none;stroke-linejoin:round}
.cborder.pb{stroke:#ffd27a;stroke-width:2.4}
.cborder.wb{stroke:#ff5a4c;stroke-width:2;stroke-dasharray:6 3}
.clabel{font-family:var(--head);font-weight:500;fill:#fff;opacity:.28;text-anchor:middle;letter-spacing:.25em;pointer-events:none;text-transform:uppercase}
.city circle.dot,.city path.dot{stroke:#05090c;stroke-width:1.3}
.city .war{fill:none;stroke:var(--red);stroke-width:1.8;stroke-dasharray:3 2}
.city text{font-family:var(--ui);font-weight:700;fill:#fff;paint-order:stroke;stroke:#05090cdd;stroke-width:3.2px;pointer-events:none}
.city .troops{font-family:var(--mono);font-weight:600;fill:var(--accent2)}
.city .ring{fill:none;stroke:#fff;stroke-width:1.8}
.city .prog{fill:none;stroke:var(--green);stroke-width:2.2;stroke-linecap:round}
.city .upg{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round}
.city{cursor:pointer}
.hidden{display:none!important}
#spr-tank-m .trk line{animation:trk .35s linear infinite}
@keyframes trk{to{stroke-dashoffset:-2.3}}
.sw1{animation:walk .5s ease-in-out infinite alternate}.sw2{animation:walk .5s ease-in-out infinite alternate-reverse}
@keyframes walk{from{transform:translateX(-.5px)}to{transform:translateX(.6px)}}
svg.paused .sw1,svg.paused .sw2{animation-play-state:paused}
.badge text{font-family:var(--mono);font-weight:600;fill:#fff;font-size:8.5px}
.peak-l{fill:#ffffff;opacity:.16}.peak-d{fill:#000;opacity:.32}
.tok text{font-family:var(--mono);font-weight:600;fill:#fff;paint-order:stroke;stroke:#05090c;stroke-width:3px}
/* sidepanel */
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;box-shadow:-6px 0 20px #0006;z-index:3}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#0b1217}
.tabs button{flex:auto;border:0;border-radius:0;background:transparent;padding:11px 5px;color:var(--dim);border-bottom:2px solid transparent;font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.chip.just{color:#ffc58a;border-color:#7a4d1c;background:#2a1a0b}
.chip.ready{color:#ffd27a;border-color:#8a6a1c;background:#2c220b}
.chip.ally{color:#a9d4ff;border-color:#2d5a86;background:#0d1d2e}
.dbtns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dbtns button{font-size:11.5px;padding:4px 7px}
.bld{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.bld .nm{font-weight:700}.bld .meta{font-size:11.5px;color:var(--dim);line-height:1.35}
.bld button{font-size:12px;padding:4px 8px}
.pips{display:inline-flex;gap:2px;margin-left:6px;vertical-align:1px}.pips i{width:9px;height:5px;border-radius:1px;background:#22313b}.pips i.f{background:var(--accent)}
.tech{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tech .nm{font-weight:700}.tech .meta{font-size:12px;color:var(--dim)}
.tech button{font-size:12px;padding:5px 8px;white-space:nowrap}
.occ{background:#24170b;border:1px solid #7a4d1c;color:#ffcf9a;border-radius:5px;padding:7px 9px;font-size:12.5px;margin-top:10px;line-height:1.4}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line2);border-radius:6px;margin-top:6px;background:var(--panel2)}
.opt b{font-size:15px}.opt .meta{font-size:12px;color:var(--dim)}
.tabs button.on{color:var(--accent2);border-bottom-color:var(--accent);background:transparent}
.tabs button .dotn{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:1px}
#panel{overflow:auto;padding:14px;flex:1}
#panel::-webkit-scrollbar{width:8px}#panel::-webkit-scrollbar-thumb{background:#22323d;border-radius:4px}
h2{margin:0 0 3px;font-family:var(--head);font-weight:500;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
h3{margin:18px 0 8px;font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.phead{margin:-14px -14px 4px;padding:14px 14px 12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 32%,transparent),transparent 70%);border-bottom:1px solid var(--line);position:relative}
.phead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 9px}
.kv label{display:block;font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-weight:700}
.kv b{font-family:var(--mono);font-size:15px}
.unit{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.unit .ico{width:34px;height:28px;border-radius:4px;background:#1a2833;display:grid;place-items:center;border:1px solid var(--line2)}
.unit .nm{font-weight:700}
.unit .meta{font-size:11px;color:var(--dim);font-family:var(--mono)}
.unit .cnt{font-family:var(--mono);font-size:17px;color:#fff;margin-right:6px;min-width:22px;text-align:right}
.unit .btns{display:flex;gap:4px;align-items:center}
.unit button{padding:4px 7px;font-size:12px}
.lvl{display:flex;gap:3px;margin-top:5px}
.lvl span{width:22px;height:6px;border-radius:2px;background:#22313b}
.lvl span.f{background:var(--accent)}
.note{font-size:13px;color:var(--dim);line-height:1.45}
.big{width:100%;padding:10px;font-size:15px;margin-top:8px}
.q{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.q .pb{height:5px;background:#1d2a33;border-radius:3px;overflow:hidden;margin-top:3px}
.q .pb div{height:100%;background:var(--green)}
.q.wait{opacity:.55}.q.wait .pb div{background:#3a4a55}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:10px;border:1px solid}
.chip.peace{color:#9fd8b0;border-color:#2f5a3e;background:#10231a}
.chip.prep{color:#ffc58a;border-color:#7a4d1c;background:#2a1a0b}
.chip.war{color:#ffb0a8;border-color:#7a2a24;background:#2a0e0c}
.chip.truce{color:#a9c4d6;border-color:#2e4a5d;background:#0f1d27}
.drow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.drow .dn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.drow .ds{font-size:12px;color:var(--dim);margin-top:3px;font-family:var(--mono)}
.drow button{font-size:12px;padding:5px 8px}
.ppbar{height:8px;background:#1d1830;border-radius:4px;overflow:hidden;margin:6px 0 2px;position:relative}
.ppbar div{height:100%;background:linear-gradient(90deg,#7d5bd6,#b58cff)}
.ppbar span{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff9}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:9.5px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
tr.click{cursor:pointer}
tr.click:hover td{background:#16232c}
/* logg, tips, toast */
#log{position:absolute;left:12px;bottom:12px;width:360px;max-height:180px;overflow:auto;background:#0b1318d9;backdrop-filter:blur(5px);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.35;z-index:2}
#log .e{padding:2px 0;border-bottom:1px solid #ffffff08}
#log .tm{font-family:var(--mono);color:var(--faint);font-size:10.5px;margin-right:6px}
#log .bad{color:var(--red2)}#log .good{color:#8fe0a6}#log .info{color:#c9d4d8}#log .dip{color:#d6c2ff}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#1a1206ee;border:1px solid var(--accent);color:var(--accent2);padding:8px 14px;border-radius:6px;font-weight:700;letter-spacing:.04em;pointer-events:none;z-index:3}
#zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
#zoomctl button{width:34px;height:34px;padding:0;font-size:18px;background:#0e161ce6}
#toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center;z-index:4}
#toast div{background:#2a0f0dee;border:1px solid var(--red);color:#ffd2cc;padding:7px 14px;border-radius:5px;font-weight:700;animation:fade 4.5s forwards;box-shadow:0 6px 20px #0008}
#toast div.g{background:#0f2a18ee;border-color:var(--green);color:#cff5d9}
#toast div.d{background:#1c1330ee;border-color:var(--pp);color:#e6dbff}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
#banner{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:4}
#banner .b{background:linear-gradient(#2a0d0bf2,#1a0807f2);border:1px solid var(--red);border-left:0;border-right:0;padding:14px 46px;animation:fade 5.5s forwards}
#banner .b.d{background:linear-gradient(#18122af2,#0f0b1cf2);border-color:var(--pp)}
#banner h4{margin:0;font-family:var(--head);font-weight:600;font-size:30px;letter-spacing:.2em;color:#ffd2cc}
#banner .b.d h4{color:#e6dbff}
#banner p{margin:4px 0 0;font-size:15px;color:#e8cfcb;letter-spacing:.05em}
#tip{position:absolute;pointer-events:none;background:#0b1318f0;border:1px solid var(--line2);border-radius:5px;padding:7px 10px;font-size:13px;z-index:6;min-width:150px;box-shadow:0 6px 18px #0008}
#tip b{font-family:var(--head);font-weight:500;letter-spacing:.08em;font-size:15px}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--dim)}
#tip .r span:last-child{color:var(--text);font-family:var(--mono)}
/* startskjerm / modal */
#start{position:absolute;inset:0;pointer-events:none;z-index:5}
#startcard{pointer-events:auto;position:absolute;left:16px;top:16px;bottom:16px;width:410px;background:#0c141af2;backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #000a}
#startcard header{padding:18px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(#14202a,#0e171e)}
#startcard h1{margin:0;font-family:var(--head);font-weight:600;font-size:34px;letter-spacing:.2em;color:var(--accent2)}
#startcard .tag{color:var(--dim);font-size:13px;letter-spacing:.06em}
#startbody{flex:1;overflow:auto;padding:12px 18px}
#startfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;color:var(--text);padding:8px 10px;font-family:var(--ui);font-size:15px}
.clist{margin-top:8px}
.citem{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.citem:hover{background:#16232c}
.citem .cn{flex:1;font-weight:700;font-size:16px}
.citem .cc{font-family:var(--mono);font-size:12px;color:var(--dim)}
.seg{display:flex;gap:4px}.seg button{flex:1}
.rules{font-size:13px;color:var(--dim);line-height:1.5;margin:0;padding-left:18px}
.rules b{color:var(--text)}
#modal{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:20;backdrop-filter:blur(2px)}
#modal .box{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:18px;box-shadow:0 20px 60px #000c}
.slider{display:grid;grid-template-columns:28px 92px 1fr 40px;align-items:center;gap:10px;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
.bar{height:10px;border-radius:5px;background:#22313b;overflow:hidden;display:flex;margin:6px 0}
.bar .a{background:var(--accent)}.bar .d{background:var(--red)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.warn{color:var(--red2);font-size:13px;margin-top:6px;line-height:1.4}
@media (max-width:1560px){.brand small{display:none}.brand{font-size:18px}}
@media (max-width:980px){
  #main{grid-template-columns:1fr;grid-template-rows:1fr 42%}
  #side{border-left:0;border-top:1px solid var(--line)}
  #startcard{left:8px;right:8px;width:auto;top:auto;height:64%}
  #log{width:auto;right:60px;max-height:80px;font-size:12px}
  .goal,.brand small{display:none}
  .res{min-width:0}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand">EUROPA I KRIG<small>STRATEGISK KOMMANDO</small></div>
    <div id="hud" style="display:contents"></div>
    <div class="spacer"></div>
    <div class="ctrl" id="speedctl">
      <button data-act="pause" title="Pause (mellomrom)">❚❚</button>
      <button data-act="sp1">1x</button><button data-act="sp2">2x</button><button data-act="sp4">4x</button>
    </div>
    <div class="ctrl menu"><button data-act="menu">Meny ▾</button>
      <div id="menu" class="hidden"><button data-act="save">Lagre spill</button><button data-act="load">Last lagret spill</button><button data-act="new">Nytt spill</button></div>
    </div>
  </div>
  <div id="main">
    <div id="mapwrap">
      <svg id="map" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs">
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#123444" stroke-width=".5"/></pattern>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.2" height="6" fill="#000" opacity=".28"/></pattern>
          <radialGradient id="seaG" cx="48%" cy="42%" r="70%"><stop offset="0" stop-color="#123a4b"/><stop offset=".6" stop-color="#0b2533"/><stop offset="1" stop-color="#06141c"/></radialGradient>

    m.onclick = e => { const a = e.target.dataset.act; if (a === "mcancel" || e.target === m) { m.classList.add("hidden"); cancelTarget(); }
      if (a === "mjust") { justifyWar(S.player, tgt.o); m.classList.add("hidden"); cancelTarget(); $("#panel")._sig = null; renderPanel(); renderHUD(); updateCityMarkers(); }
      if (a === "mdeclare") { declareWar(S.player, tgt.o); m.classList.add("hidden"); cancelTarget(); $("#panel")._sig = null; renderPanel(); renderHUD(); updateCityMarkers(); } };
    return;
  }
  const sel = {inf: src.inf, tank: src.tank, nav: 0};
  // velg sjøvei automatisk hvis landvei mangler
  if (!findPath(from, to, sel, S.player) && src.nav) { sel.nav = src.nav; const cap = sel.nav * 4; sel.tank = Math.min(sel.tank, cap); sel.inf = Math.min(sel.inf, cap - sel.tank); }
  m.innerHTML = `<div class="box"><h2>${enemy ? "Angrep" : "Forflytning"}</h2><div class="sub">${CITIES[from].n} → ${CITIES[to].n} · ${enemy ? nm(tgt.o) : "egen by"}</div>
    <h3>Velg styrker</h3>
    ${["inf", "tank", "nav"].map(k => `<div class="slider"><span>${icon(k, 24, 20)}</span><span>${UNITS[k].n}</span><input type="range" min="0" max="${src[k]}" value="${sel[k]}" data-u="${k}" ${src[k] ? "" : "disabled"}><span class="mono" data-v="${k}">${sel[k]}</span></div>`).join("")}
    <div id="sendinfo"></div>
    <div class="row"><button data-act="mcancel">Avbryt</button><button class="primary" data-act="mgo" id="mgo">${enemy ? "Angrip" : "Send"}</button></div></div>`;
  const upd = () => {
    const mode = moveMode(sel), path = findPath(from, to, sel, S.player);
    let info = "";
    if (mode === "overcap") info = `<div class="warn">For få fartøy. ${sel.nav} fartøy kan frakte ${sel.nav * 4} landenheter, du har valgt ${sel.inf + sel.tank}.</div>`;
    else if (!path) info = `<div class="warn">${mode === "sea" ? "Ingen sjørute til målet. Fartøy kan bare seile mellom kystbyer langs blå linjer, gjennom egne havner." : "Ingen landvei til målet gjennom egne byer." + (src.nav ? " Prøv å ta med marinefartøy for å gå sjøveien." : "")}</div>`;
    else {
      const {km, h} = pathHours(path, sel);
      info = `<p class="note">${mode === "sea" ? "Sjøvei" : "Landvei"}: ${path.map(i => CITIES[i].n).join(" → ")}<br>${fmt(km)} km · ${Math.ceil(h)} timer (ca. ${mmss(h / S.speed)} ved ${S.speed}x)${mode === "land" ? ` · fart ${Math.round(landSpeed(sel, S.player))} km/t` : ` · fart ${Math.round(navSpeed(S.player))} km/t`}</p>`;
      if (enemy) {
        const A = attPower(sel, S.player) * (mode === "sea" ? .85 : 1), D = defPower(to), pct = A / (A + D) * 100, odds = A / D;
        info += `<h3>Styrkeforhold</h3><div class="bar"><div class="a" style="width:${pct}%"></div><div class="d" style="width:${100 - pct}%"></div></div>
          <div class="sub" style="justify-content:space-between"><span>Ditt angrep ${fmt(A)}</span><span>Forsvar ${fmt(D)}</span></div>
          <p class="note">${odds > 1.6 ? "Gode odds." : odds > 1.1 ? "Jevnt. Slaget kan bli langt og blodig." : "Dårlige odds. Angrepet vil trolig slås tilbake."} Forsvaret kan endre seg før du ankommer.${mode === "sea" ? " Landgang fra sjø svekker angrepet med 15 %." : ""}</p>`;
      }
    }
    $("#sendinfo").innerHTML = info;
    $("#mgo").disabled = !path || unitCount(sel) === 0;
  };
  m.querySelectorAll("input[type=range]").forEach(rg => rg.addEventListener("input", () => { sel[rg.dataset.u] = +rg.value; m.querySelector(`[data-v="${rg.dataset.u}"]`).textContent = rg.value; upd(); }));
  m.onclick = e => {
    const a = e.target.dataset.act;
    if (a === "mcancel" || e.target === m) { m.classList.add("hidden"); cancelTarget(); }
    if (a === "mgo") {
      if (sendArmy(from, to, {...sel}, S.player)) log(`${unitCount(sel)} enheter er på vei fra ${CITIES[from].n} mot ${CITIES[to].n}.`, "info");
      m.classList.add("hidden"); cancelTarget(); renderPanel(); updateCityMarkers();
    }
  };
  upd();
}
function peaceOfferModal(ai, pay = 0) {
  const m = $("#modal"); m.classList.remove("hidden");
  m.innerHTML = `<div class="box"><h2>Fredstilbud</h2><div class="sub"><span class="sw" style="background:${colorOf(ai)}"></span>${nm(ai)} ønsker fred</div>
    <p class="note" style="margin-top:12px">${nm(ai)} tilbyr å avslutte krigen${pay ? ` og betaler deg <b>${pay} kr</b>` : ""}. Pågående angrep mellom dere stanses, og det blir ${mmss(TRUCE)} våpenhvile. Du beholder byene du har erobret.</p>
    <div class="row"><button data-act="pno">Avslå</button><button class="primary" data-act="pyes">Godta fred${pay ? ` · +${pay} kr` : ""}</button></div></div>`;
  m.onclick = e => { const a = e.target.dataset.act;
    if (a === "pyes") { if (pay) { S.nations[ai].money -= pay; S.nations[S.player].money += pay; } makePeace(S.player, ai); m.classList.add("hidden"); $("#panel")._sig = null; renderPanel(); }
    if (a === "pno") { log(`Du avslo fredstilbudet fra ${nm(ai)}.`, "dip"); opinion(ai, -5); m.classList.add("hidden"); } };
}
function allianceOfferModal(ai) {
  const m = $("#modal"); m.classList.remove("hidden");
  m.innerHTML = `<div class="box"><h2>Allianseforslag</h2><div class="sub"><span class="sw" style="background:${colorOf(ai)}"></span>${nm(ai)} ønsker en forsvarsallianse</div>
    <p class="note" style="margin-top:12px">Hvis noen erklærer krig mot en av dere, går den andre automatisk inn i krigen. Styrkene deres kan marsjere gjennom hverandres byer.${warsOf(ai).length ? ` ${nm(ai)} er nå i konflikt med ${warsOf(ai).map(nm).join(", ")}.` : ""}</p>
    <div class="row"><button data-act="ano">Avslå</button><button class="primary" data-act="ayes">Inngå allianse</button></div></div>`;
  m.onclick = e => { const a = e.target.dataset.act;
    if (a === "ayes") { if (canAlly(S.player, ai)) formAlliance(S.player, ai); m.classList.add("hidden"); $("#panel")._sig = null; renderPanel(); }
    if (a === "ano") { opinion(ai, -10); m.classList.add("hidden"); } };
}
function peaceDialog(o) {
  const m = $("#modal"), n = S.nations[S.player]; m.classList.remove("hidden");
  const lvl = p => p > .65 ? "Høy" : p > .35 ? "Middels" : "Lav";
  const opts = [["white", "Hvit fred", "Ingen betaling. Begge beholder det de har.", 0], ["pay", "Betal 300 kr", "Du betaler for å få slutt på krigen.", 300], ["demand", "Krev 300 kr", "Motparten betaler deg. Godtas bare hvis de taper.", -300]];
  m.innerHTML = `<div class="box"><h2>Tilby fred</h2><div class="sub"><span class="sw" style="background:${colorOf(o)}"></span>${nm(o)} · koster ${PP_PEACE} PK</div>
    ${opts.map(([k, t, d, money]) => { const pc = peaceChance(o, S.player, money); const dis = (money > 0 && n.money < money) || (money < 0 && S.nations[o].money < -money);
      return `<div class="opt"><div><b>${t}</b><div class="meta">${d} Sjanse: ${lvl(pc)}</div></div><button data-act="pd" data-m="${money}" ${dis ? "disabled" : ""}>Send</button></div>`; }).join("")}
    <div class="row"><button data-act="pc">Avbryt</button></div></div>`;
  m.onclick = e => { const a = e.target.dataset.act;
    if (a === "pc" || e.target === m) m.classList.add("hidden");
    if (a === "pd") {
      const money = +e.target.dataset.m; n.pp -= PP_PEACE; m.classList.add("hidden");
      if (aiAcceptsPeace(o, S.player, money)) {
        if (money > 0) { n.money -= money; S.nations[o].money += money; }
        if (money < 0) { S.nations[o].money += money; n.money -= money; }
        makePeace(S.player, o);
      } else { log(`${nm(o)} avviste fredstilbudet ditt.`, "dip"); toast(`${nm(o)} avviste fred`, "d"); }
      $("#panel")._sig = null; renderPanel(); renderHUD();
    } };
}

/* ===== startskjerm ===== */
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function renderStart() {
  $("#start").classList.remove("hidden");
  const card = $("#startcard");
  const list = COUNTRIES.slice().sort((a, b) => a.n.localeCompare(b.n, "nb"));
  if (!pickCountry) {
    card.innerHTML = `<header><h1>EUROPA I KRIG</h1><div class="tag">Velg nasjonen du skal lede. Klikk på kartet eller i listen.</div></header>
      <div id="startbody"><input type="search" id="q" placeholder="Søk etter land …"><div class="clist">${list.map(c => `<div class="citem" data-pick="${c.c}"><span class="sw" style="background:${COLORS[c.c]}"></span><span class="cn">${c.n}</span><span class="cc">${c.ids.length} byer</span></div>`).join("")}</div></div>
      <div id="startfoot">${hasSave() ? `<button data-act="load">Fortsett lagret spill</button>` : ""}<div class="note">Mål: kontroller ${Math.round(WIN_SHARE * 100)} % av alle ${CITIES.length} byer.</div></div>`;
    $("#q").addEventListener("input", e => { const q = e.target.value.toLowerCase(); card.querySelectorAll(".citem").forEach(it => it.style.display = CBY[it.dataset.pick].n.toLowerCase().includes(q) ? "" : "none"); });
  } else {
    const c = CBY[pickCountry], totPop = c.ids.reduce((s, i) => s + BASE_POP[CITIES[i].s], 0);
    const nbs = [...new Set(c.ids.flatMap(i => ADJ[i].map(e => CITIES[e.to].cc)).filter(x => x !== pickCountry))];
    card.innerHTML = `<header><h1 style="font-size:28px">${c.n.toUpperCase()}</h1><div class="tag">${c.ids.length} strategiske byer · ${fmtPop(totPop)} innbyggere</div></header>
      <div id="startbody">
        <h3 style="margin-top:4px">Strategiske byer</h3>
        <table><tr><th>By</th><th>Bef.</th><th>Inntekt</th><th>Tropper</th></tr>
        ${c.ids.map(i => { const C = CITIES[i], p = BASE_POP[C.s], tr = 2 + C.s + (C.cap ? 3 : 0) + ((C.co && C.s >= 2) ? 1 : 0);
          return `<tr class="click" data-goto="${i}"><td>${C.cap ? "★ " : ""}${C.n}${C.co ? ' <span style="color:var(--blue)" title="Kystby">⚓</span>' : ""}</td><td>${fmtPop(p)}</td><td>${(p / 1e6 * 12).toFixed(1)}/t</td><td>${tr}</td></tr>`; }).join("")}
        </table>
        <p class="note">Naboer: ${nbs.map(x => CBY[x].n).join(", ") || "ingen"}</p>
        <h3>Slik fungerer krigen</h3>
        <ul class="rules">
          <li>1 sekund = <b>1 time</b> spilltid ved 1x.</li>
          <li>Enheter <b>produseres over tid</b> i byene (12 til 45 timer). Oppgraderte byer får flere produksjonslinjer.</li>
          <li>Bygg en <b>kaserne</b> i en by for å få infanteri automatisk.</li>
          <li>Infanteri, stridsvogner og marinefartøy <b>forflytter seg fysisk</b> på kartet i reell fart.</li>
          <li>Krig krever to steg: <b>rettferdiggjør</b> (${PP_JUST} PK, ${mmss(WAR_PREP)}) og <b>erklær</b> (${PP_DECL} PK).</li>
          <li>Inngå <b>allianser</b>, send støtte og forhandle fred, gjerne med penger.</li>
          <li><b>Teknologi</b> og <b>bygninger</b> (festning, fabrikk, verft) gjør landet sterkere. Tropper koster vedlikehold.</li>
          <li>Erobrede byer kan ikke produsere før hele landet er <b>annektert</b>.</li>
          <li>Slag varer over tid. Byen faller når forsvarerne og festningsverket er nedkjempet.</li>
        </ul>
        <h3>Vanskelighetsgrad</h3>
        <div class="seg">${Object.entries(DIFF).map(([k, d]) => `<button data-diff="${k}" class="${pickDiff === k ? "on" : ""}">${d.n}</button>`).join("")}</div>
        <p class="note">${{easy: "Fiendene har svakere økonomi og erklærer sjelden krig.", medium: "Balansert motstand. Fiendene kan erklære krig etter et par minutter.", hard: "Sterkere fiender som erklærer krig tidlig og prioriterer deg."}[pickDiff]}</p>
      </div>
      <div id="startfoot"><button class="primary big" data-act="begin" style="margin:0">Start spillet</button><button data-act="back">Velg et annet land</button></div>`;
  }
}
function choosePick(code) {
  pickCountry = code; renderStart();
  CITIES.forEach((c, i) => regionEls[i].setAttribute("fill", c.cc === code ? PLAYER_COLOR : COLORS[c.cc]));
  updateBorders(); borderEls[code].classList.add("pb");
  flyToCountry(code);
}
function previewColors() { CITIES.forEach((c, i) => { updateRegion(i); cityEls[i].troops.textContent = ""; cityEls[i].ring.classList.add("hidden"); cityEls[i].war.classList.add("hidden"); cityEls[i].prog.setAttribute("d", ""); cityEls[i].upg.setAttribute("d", ""); }); }
function begin() {
  newGame(pickCountry, pickDiff);
  $("#start").classList.add("hidden");
  updateAllRegions(); select(CBY[S.player].ids[0]); renderLog(); renderHUD();
  flyToCountry(S.player);
}
function toMenu() {
  S = null; pickCountry = null; selected = null; targeting = null; fxList.length = 0;
  previewColors(); updateBorders(); renderEdges(); renderDynamic(0); renderLog(); renderHUD(); renderPanel();
  renderStart(); view = {k: 1, x: 0, y: 0}; applyView();
}
function endScreen(win) {
  const m = $("#modal"); m.classList.remove("hidden");
  const mine = ownedBy(S.player).length, g = gameDate();
  m.innerHTML = `<div class="box" style="text-align:center"><h2 style="font-size:34px;color:${win ? "var(--accent2)" : "var(--red)"}">${win ? "SEIER" : "NEDERLAG"}</h2>
    <p class="note">${win ? `${nm(S.player)} kontrollerer nå ${mine} av ${CITIES.length} byer i Europa.` : `${nm(S.player)} har mistet alle sine byer.`}<br>Krigen endte ${g.d} · ${DIFF[S.diff].n}</p>
    <div class="row" style="justify-content:center">${win ? `<button data-act="cont">Fortsett å spille</button>` : ""}<button class="primary" data-act="new">Nytt spill</button></div></div>`;
  m.onclick = e => { const a = e.target.dataset.act; if (a === "cont") m.classList.add("hidden"); if (a === "new") { m.classList.add("hidden"); toMenu(); } };
}

/* ===== lagring ===== */
function save() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); toast("Spillet er lagret", true); }
  catch (e) { toast("Kunne ikke lagre i denne nettleseren"); }
}
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!d || !d.cities || d.cities.length !== CITIES.length) { toast("Fant ingen lagret spill"); return; }
  S = d; S.paused = false; targeting = null;
  S.cities.forEach(c => { if (!c.bar) c.bar = newBar(); if (!c.b) c.b = {fort: 0, fac: 0, yard: 0}; if (c.bc === undefined) c.bc = null; });
  S.tech = S.tech || {}; S.research = S.research || {}; S.ally = S.ally || {}; S.op = S.op || {};
  for (const c of COUNTRIES) if (!S.tech[c.c]) S.tech[c.c] = {};
  $("#start").classList.add("hidden"); $("#modal").classList.add("hidden");
  updateAllRegions(); select(ownedBy(S.player)[0] ?? null); renderLog(); renderHUD();
  if (selected != null) flyToCountry(S.player);
  toast("Lagret spill lastet", true);
}

/* ===== knapper og taster ===== */
document.addEventListener("click", e => {
  if (!e.target.closest(".menu")) $("#menu").classList.add("hidden");
  const b = e.target.closest("button, [data-pick], [data-goto], [data-country], [data-tab], [data-diff]");
  if (!b || b.closest("#modal")) return;
  if (b.dataset.pick) return choosePick(b.dataset.pick);
  if (b.dataset.diff) { pickDiff = b.dataset.diff; return renderStart(); }
  if (b.dataset.tab) { tab = b.dataset.tab; $("#panel")._sig = null; setTab(); return renderPanel(); }
  if (b.dataset.goto) { const i = +b.dataset.goto; if (S) select(i); flyTo(CITIES[i].x, CITIES[i].y, Math.max(view.k, 3.2)); return; }
  if (b.dataset.country) { flyToCountry(b.dataset.country, S ? (ownedBy(b.dataset.country).length ? ownedBy(b.dataset.country) : null) : null); return; }
  const a = b.dataset.act; if (!a) return;
  if (a === "menu") { const mn = $("#menu"); mn.classList.toggle("hidden"); mn.style.left = ""; mn.style.right = ""; if (mn.getBoundingClientRect().left < 4) { mn.style.left = "0"; mn.style.right = "auto"; } return; }
  $("#menu").classList.add("hidden");
  if (a === "begin") return begin();
  if (a === "back") { pickCountry = null; previewColors(); updateBorders(); return renderStart(); }
  if (a === "zin") return zoomCenter(1.5);
  if (a === "zout") return zoomCenter(1 / 1.5);
  if (a === "zfit") return flyTo(W / 2, H / 2, 1);
  if (a === "save") return save();
  if (a === "load") return load();
  if (a === "new") return S && !S.over ? confirmNew() : toMenu();
  if (!S) return;
  if (a === "pause") S.paused = !S.paused;
  else if (a.startsWith("sp")) { S.speed = +a.slice(2); S.paused = false; }
  else if (a === "bar") { startBarracks(selected); updatePanel(); updateCityMarkers(); }
  else if (a === "bartoggle") { const b = S.cities[selected].bar; b.on = !b.on; b.wait = false; updatePanel(); updateCityMarkers(); }
  else if (a === "upg") { startUpgrade(selected); updatePanel(); updateCityMarkers(); }
  else if (a === "rec") { queueUnit(selected, b.dataset.t, +b.dataset.q); updatePanel(); updateCityMarkers(); }
  else if (a === "send") startTarget();
  else if (a === "justify") { justifyWar(S.player, b.dataset.o); $("#panel")._sig = null; renderPanel(); updateCityMarkers(); }
  else if (a === "declare") { declareWar(S.player, b.dataset.o); $("#panel")._sig = null; renderPanel(); updateCityMarkers(); }
  else if (a === "cancelj") { delete S.rel[rkey(S.player, b.dataset.o)]; log(`Du avbrøt krigsforberedelsene mot ${nm(b.dataset.o)}.`, "dip"); $("#panel")._sig = null; renderPanel(); updateCityMarkers(); }
  else if (a === "peace") peaceDialog(b.dataset.o);
  else if (a === "ally") {
    const o = b.dataset.o; S.nations[S.player].pp -= PP_ALLY;
    if (Math.random() < allyChance(o, S.player)) formAlliance(S.player, o);
    else { log(`${nm(o)} avslo allianseforslaget.`, "dip"); toast(`${nm(o)} avslo allianse`, "d"); }
    $("#panel")._sig = null; renderPanel();
  }
  else if (a === "unally") { breakAlliance(S.player, b.dataset.o); $("#panel")._sig = null; renderPanel(); }
  else if (a === "gift") { if (sendGift(S.player, b.dataset.o)) toast(`Støtte sendt til ${nm(b.dataset.o)}`, "d"); $("#panel")._sig = null; renderPanel(); }
  else if (a === "research") { startResearch(S.player, b.dataset.k); $("#panel")._sig = null; renderPanel(); }
  else if (a === "build") { startBuild(selected, b.dataset.k); updatePanel(); }
  renderHUD();
});
function confirmNew() {
  const m = $("#modal"); m.classList.remove("hidden");
  m.innerHTML = `<div class="box"><h2>Avslutte spillet?</h2><p class="note">Ulagret fremdrift går tapt.</p><div class="row"><button data-act="mc">Avbryt</button><button data-act="ms">Lagre først</button><button class="primary" data-act="my">Nytt spill</button></div></div>`;
  m.onclick = e => { const a = e.target.dataset.act; if (a === "mc" || e.target === m) m.classList.add("hidden"); if (a === "ms") { save(); m.classList.add("hidden"); toMenu(); } if (a === "my") { m.classList.add("hidden"); toMenu(); } };
}
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { if (targeting) cancelTarget(); }
  if (!S) return;
  if (e.key === " ") { e.preventDefault(); S.paused = !S.paused; renderHUD(); }
  if (["1", "2", "4"].includes(e.key)) { S.speed = +e.key; S.paused = false; renderHUD(); }
});

/* ================= SPILL-LØKKE ================= */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const modalOpen = !$("#modal").classList.contains("hidden");
  if (S && !S.paused && !S.over && !modalOpen) {
    const g = dt * S.speed;
    moveArmies(g);
    acc += g;
    let ticked = false;
    while (acc >= 1) { acc -= 1; tick(); ticked = true; }
    if (ticked) { renderHUD(); updatePanel(); updateCityMarkers(); }
  }
  svg.classList.toggle("paused", !!S && (S.paused || modalOpen));
  if (S) renderDynamic(now);
  requestAnimationFrame(frame);
}

buildMap(); previewColors(); applyView(); renderStart(); renderPanel(); renderHUD(); renderLog();
requestAnimationFrame(frame);
</script>
</body>
</html>
