<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KI-spillutfordringen – Spilloversikt</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-hover: #192540;
      --border: rgba(148, 163, 184, 0.16);
      --border-hover: rgba(56, 189, 248, 0.5);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-secondary: #818cf8;
      --shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(129, 140, 248, 0.12) 0%, transparent 45%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 2.75rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(1.9rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
      max-width: 360px;
    }

    .search-box input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.45rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .count {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.35rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      background: var(--surface-hover);
      border-color: var(--border-hover);
      outline: none;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(129, 140, 248, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      flex-shrink: 0;
    }

    .team-tag {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    .arrow {
      transition: transform 0.2s ease;
    }

    .card:hover .arrow {
      transform: translateX(4px);
    }

    .empty-state,
    .error-banner {
      text-align: center;
      padding: 2.5rem 1.5rem;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .error-banner {
      border-color: rgba(248, 113, 113, 0.45);
      color: #fca5a5;
      margin-bottom: 1.5rem;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">KI-utfordringen</div>
      <h1>Teamenes HTML-spill</h1>
      <p class="subtitle">
        Velg et spill under for å teste hva teamene har bygget ved hjelp av kunstig intelligens.
      </p>
    </header>

    <div id="error-container"></div>

    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-input" placeholder="Søk etter spill..." aria-label="Søk etter spill">
      </div>
      <div class="count" id="game-count"></div>
    </div>

    <main id="games-grid" class="grid" aria-live="polite"></main>
  </div>

  <!-- =====================================================================
       LEGG INN NYE SPILL HER (gyldig JSON-format)
       Obligatoriske felt:
         - "folder": Navn på undermappen på webserveren (f.eks. "romskip")
         - "title":  Tittel på spillet
         - "description": Kort beskrivelse av spillet

       Valgfrie felt (kan utelates):
         - "team": Navn på teamet som laget spillet
         - "icon": En valgfri emoji som vises på kortet
       ===================================================================== -->
  <script id="games-data" type="application/json">
  [
    {
      "folder": "sapfighter",
      "title": "SAP Fighter",
      "description": "Team Styring, bidrag 2."
    },
    {
      "folder": "norgeunderangrep",
      "title": "Norge under angrep",
      "description": "Team BW, bidrag 2."
    },
    {
      "folder": "trollguard",
      "title": "Trollguard",
      "description": "Team Styring."
    }
  ]
  </script>

  <script>
    const gridEl = document.getElementById("games-grid");
    const countEl = document.getElementById("game-count");
    const searchInput = document.getElementById("search-input");
    const errorContainer = document.getElementById("error-container");

    const defaultIcons = ["🎮", "🕹️", "🚀", "🧩", "👾", "🏆", "⚡", "🎲"];

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function buildGameUrl(folder) {
      const cleaned = String(folder ?? "").trim().replace(/^\/+|\/+$/g, "");
      if (!cleaned) return "#";
      if (cleaned.toLowerCase().endsWith(".html")) {
        return `./${cleaned}`;
      }
      return `./${cleaned}/`;
    }

    function loadGames() {
      const rawJson = document.getElementById("games-data").textContent;
      try {
        const parsed = JSON.parse(rawJson);
        if (!Array.isArray(parsed)) {
          throw new Error("JSON-dataene må være en liste ([ ... ]).");
        }
        return parsed;
      } catch (err) {
        errorContainer.innerHTML = `
          <div class="error-banner">
            <strong>Feil i JSON-listen:</strong> Sjekk at alle objekter har doble anførselstegn og komma mellom hvert spill (men ikke etter det siste spillet).<br>
            <small>${escapeHtml(err.message)}</small>
          </div>
        `;
        return [];
      }
    }

    const allGames = loadGames();

    function renderGames(filterText = "") {
      const query = filterText.trim().toLowerCase();
      const filtered = allGames.filter((game) => {
        const haystack = `${game.title ?? ""} ${game.description ?? ""} ${game.team ?? ""} ${game.folder ?? ""}`.toLowerCase();
        return haystack.includes(query);
      });

      countEl.textContent = filtered.length === 1
        ? "1 spill tilgjengelig"
        : `${filtered.length} spill tilgjengelig`;

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">Ingen spill matchet søket ditt.</div>`;
        return;
      }

      gridEl.innerHTML = filtered.map((game, index) => {
        const icon = game.icon || defaultIcons[index % defaultIcons.length];
        const teamHtml = game.team ? `<span class="team-tag">${escapeHtml(game.team)}</span>` : "";
        const href = buildGameUrl(game.folder);

        return `
          <a class="card" href="${escapeHtml(href)}">
            <div>
              <div class="card-top">
                <div class="icon-box" aria-hidden="true">${escapeHtml(icon)}</div>
                ${teamHtml}
              </div>
              <h2>${escapeHtml(game.title || "Uten tittel")}</h2>
              <p>${escapeHtml(game.description || "")}</p>
            </div>
            <div class="card-footer">
              <span>Spill nå</span>
              <span class="arrow" aria-hidden="true">&rarr;</span>
            </div>
          </a>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", (e) => {
      renderGames(e.target.value);
    });

    renderGames();
  </script>
</body>
</html>
