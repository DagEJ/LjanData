  // ================================================================ terrain mesh
  const tc = [0, 0, 0];
  function mixc(t, r, g, b) { tc[0] += (r - tc[0]) * t; tc[1] += (g - tc[1]) * t; tc[2] += (b - tc[2]) * t; }
  function terrainColor(x, y, z, ny, d) {
    const n1 = U.noise2(x * 0.09, z * 0.09), n2 = U.noise2(x * 0.017 + 5.1, z * 0.017 + 2.2);
    const slope = 1 - ny, th = P.theme;
    if (th === 'snow') {
      tc[0] = 0.9 - 0.08 * n1; tc[1] = 0.93 - 0.06 * n1; tc[2] = 0.98 - 0.02 * n1;
      mixc(0.45 * sstep(0.45, 0.7, n2) * sstep(8, 30, d), 0.68, 0.8, 0.92);
      const rk = sstep(0.42, 0.62, slope + 0.2 * (n1 - 0.5));
      const rv = 0.27 + 0.06 * n2;
      mixc(rk, rv, rv, rv + 0.03);
    } else if (th === 'night') {
      tc[0] = 0.22 + 0.04 * n1; tc[1] = 0.23 + 0.03 * n1; tc[2] = 0.16;
      mixc(0.8 * sstep(0.35, 0.65, n2), 0.31, 0.29, 0.27);
      const rk = sstep(0.3, 0.5, slope + 0.15 * (n1 - 0.5));
      const rv = 0.22 + 0.05 * n1;
      mixc(rk, rv, rv - 0.01, rv);
      mixc(0.7 * sstep(AR[3] + 25, AR[3] - 15, hyp(x - AX[3], z - AZ[3])), 0.19, 0.13, 0.11);
    } else {
      tc[0] = 0.27 + 0.09 * n2; tc[1] = 0.39 + 0.06 * n1; tc[2] = 0.16 + 0.03 * n2;
      mixc(0.35 * sstep(0.12, 0.3, slope), 0.4, 0.34, 0.2);
      const rk = Math.max(sstep(0.3, 0.48, slope + 0.15 * (n1 - 0.5)), sstep(45, 75, y));
      const rv = 0.4 + 0.08 * n1;
      mixc(rk, rv, rv, rv + 0.03);
      if (d > 0.5) {
        mixc(sstep(3.4, 1.7, y) * (1 - rk * 0.6), 0.72, 0.65, 0.49);
        if (y < 0.3) mixc(sstep(0.3, -1.5, y), 0.36, 0.34, 0.27);
      }
    }
    const sn = sstep(P.snowLine - 10, P.snowLine + 10, y + 18 * (n1 - 0.5)) * (1 - sstep(0.5, 0.75, slope));
    if (sn > 0) mixc(sn, 0.9, 0.92, 0.96);
  }

  function buildTerrainMesh(mat) {
    const nv = N * N, pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), col = new Float32Array(nv * 3);
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const o = j * N + i, x = -HALF + i * CELL, z = -HALF + j * CELL, y = H[o];
        const iL = i > 0 ? o - 1 : o, iR = i < N - 1 ? o + 1 : o, jD = j > 0 ? o - N : o, jU = j < N - 1 ? o + N : o;
        const ddx = (H[iR] - H[iL]) / ((iR - iL) * CELL), ddz = (H[jU] - H[jD]) / (((jU - jD) / N) * CELL);
        const l = Math.sqrt(ddx * ddx + 1 + ddz * ddz);
        pos[o * 3] = x; pos[o * 3 + 1] = y; pos[o * 3 + 2] = z;
        nor[o * 3] = -ddx / l; nor[o * 3 + 1] = 1 / l; nor[o * 3 + 2] = -ddz / l;
        terrainColor(x, y, z, 1 / l, SD[o]);
        col[o * 3] = tc[0]; col[o * 3 + 1] = tc[1]; col[o * 3 + 2] = tc[2];
      }
    }
    // a=(i,j) b=(i+1,j) c=(i,j+1) d=(i+1,j+1); triangles (a,c,b) and (b,c,d) are CCW seen from +Y
    const idx = new Uint32Array((N - 1) * (N - 1) * 6);
    let t = 0;
    for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) {
      const a = j * N + i, b = a + 1, c = a + N, d = c + 1;
      idx[t++] = a; idx[t++] = c; idx[t++] = b;
      idx[t++] = b; idx[t++] = c; idx[t++] = d;
    }
    addMeshNode(TG.R.geo.custom({ positions: pos, normals: nor, colors: col, indices: idx }), mat, true);
  }

  // Distant mountain ring outside the playable heightfield
  function buildBackdrop(mat) {
    const A = 160, radii = [250, 285, 330, 390, 460, 540, 630, 730, 840, 960], NR = radii.length;
    const pos = new Float32Array(A * NR * 3), col = new Float32Array(A * NR * 3);
    for (let a = 0; a < A; a++) {
      const ang = a / A * TAU, ca = Math.cos(ang), sa = Math.sin(ang);
      const mod = 0.5 + 0.5 * U.fbm2(ca * 2.2 + P.o3 * 0.01 + 3, sa * 2.2 + 7, 3);
      for (let r = 0; r < NR; r++) {
        const rad = radii[r], x = ca * rad, z = sa * rad, o = (a * NR + r) * 3;
        const amp = sstep(255, 470, rad) * P.bdAmp * mod * (1 - 0.35 * sstep(700, 960, rad));
        const h = P.bdBase + amp * (0.25 + 0.75 * ridge(x * 0.0045 + P.o5, z * 0.0045 + P.o6)) + sstep(255, 300, rad) * 12;
        pos[o] = x; pos[o + 1] = h; pos[o + 2] = z;
        const n = U.noise2(x * 0.02, z * 0.02);
        let c0, c1, c2;
        if (P.theme === 'snow') { c0 = 0.82 + 0.1 * n; c1 = 0.86 + 0.08 * n; c2 = 0.95; if (n > 0.62) { c0 = 0.32; c1 = 0.33; c2 = 0.37; } }
        else if (P.theme === 'night') { c0 = 0.16 + 0.06 * n; c1 = 0.15 + 0.06 * n; c2 = 0.17 + 0.06 * n; }
        else { c0 = 0.34 + 0.1 * n; c1 = 0.35 + 0.1 * n; c2 = 0.38 + 0.1 * n; if (h < 6) { c0 = 0.28; c1 = 0.36; c2 = 0.2; } }
        const sn = sstep(P.bdSnow - 25, P.bdSnow + 25, h + 40 * (n - 0.5));
        c0 = lerp(c0, 0.9, sn); c1 = lerp(c1, 0.92, sn); c2 = lerp(c2, 0.97, sn);
        col[o] = c0; col[o + 1] = c1; col[o + 2] = c2;
      }
    }
    const idx = new Uint16Array(A * (NR - 1) * 6);
    let t = 0;
    for (let a = 0; a < A; a++) {
      const a2 = (a + 1) % A;
      for (let r = 0; r < NR - 1; r++) {
        const v00 = a * NR + r, v01 = v00 + 1, v10 = a2 * NR + r, v11 = v10 + 1;
        idx[t++] = v00; idx[t++] = v01; idx[t++] = v10;
        idx[t++] = v10; idx[t++] = v01; idx[t++] = v11;
      }
    }
    fixWindingUp(pos, idx);
    addMeshNode(flatG(TG.R.geo.custom({ positions: pos, colors: col, indices: idx })), mat, false);
  }

  // ================================================================ stages + keep-out zones
  let gateT = [0, 0, 0];
  function buildStages() {
    const out = [];
    for (let k = 0; k < 4; k++) {
      const R = AR[k], cx = AX[k], cz = AZ[k], e = ENT[k];
      const ps = [cx + e[0] * (R - 6), cz + e[1] * (R - 6)];
      const bs = [cx - e[0] * R * 0.5, cz - e[1] * R * 0.5];
      const ea = Math.atan2(e[1], e[0]);
      const sp = [];
      for (let i = 0; i < 18; i++) {
        const a = 0.1 + i / 18 * TAU;
        if (angDist(a, ea) < 0.6) continue;
        sp.push([cx + Math.cos(a) * (R - 4), cz + Math.sin(a) * (R - 4)]);
      }
      out.push({ center: [cx, cz], radius: R, playerStart: ps, playerYaw: U.yawTo(ps[0], ps[1], cx, cz), bossSpawn: bs, spawnPoints: sp });
    }
    for (let k = 0; k < 3; k++) gateT[k] = AR[k] + (SL[k] - AR[k] - AR[k + 1]) * 0.5;
    World.stages = out;
  }
  // true if a prop of radius r at (x,z) keeps gameplay spaces clear
  function keepOk(x, z, r) {
    const st = World.stages;
    for (let k = 0; k < st.length; k++) {
      const s = st[k];
      if (hyp(x - s.playerStart[0], z - s.playerStart[1]) < r + 6) return false;
      if (hyp(x - s.bossSpawn[0], z - s.bossSpawn[1]) < r + 8) return false;
      if (hyp(x - s.center[0], z - s.center[1]) < r + 9) return false;
      if (hyp(x - (AX[k] + EXI[k][0] * AR[k]), z - (AZ[k] + EXI[k][1] * AR[k])) < r + 9) return false;
      if (hyp(x - (AX[k] + ENT[k][0] * AR[k]), z - (AZ[k] + ENT[k][1] * AR[k])) < r + 7) return false;
      for (const p of s.spawnPoints) if (hyp(x - p[0], z - p[1]) < r + 2.5) return false;
    }
    for (let k = 0; k < 3; k++) {
      const gx = SX[k] + SUX[k] * gateT[k], gz = SZ[k] + SUZ[k] * gateT[k];
      if (hyp(x - gx, z - gz) < r + 12) return false;
      // nothing inside the exposed part of a corridor
      if (segPointDist(SX[k], SZ[k], AX[k + 1], AZ[k + 1], x, z) < HW + r + 1) {
        if (hyp(x - AX[k], z - AZ[k]) > AR[k] - 2 && hyp(x - AX[k + 1], z - AZ[k + 1]) > AR[k + 1] - 2) return false;
      }
    }
    return true;
  }

  // ================================================================ props
  let K = null; // per-load kit: batches, instance sets, models, materials

  function addFire(x, y, z, size, col) {
    const base = col || [3.2, 1.5, 0.45];
    let light = null;
    safe(() => { light = TG.R.lights.add({ pos: [x, y + 0.4, z], color: base.slice(), radius: 9 + size * 9 }); });
    if (light) lights.push(light);
    fires.push({ x: x, y: y, z: z, size: size, light: light, base: base, acc: Math.random(), ph: Math.random() * 10 });
  }

  function placeBoulder(x, z, s, rng, collide) {
    if (collide && (!colliderFree(x, z, 1.1 * s, 2.2) || !keepOk(x, z, 1.1 * s))) return false;
    const set = rng() < 0.5 ? K.rockA : K.rockB;
    iAdd(set, x, heightAt(x, z) - 0.25 * s, z, rng() * TAU, s);
    if (collide) addCollider(x, z, 1.15 * s, 0.85 * s);
    return true;
  }
  function placeTree(set, x, z, s, rng, collide) {
    if (collide && (!colliderFree(x, z, 0.5, 2.5) || !keepOk(x, z, 0.6))) return false;
    iAdd(set, x, heightAt(x, z) - 0.15, z, rng() * TAU, s);
    if (collide) addCollider(x, z, 0.42 * s, 6.5 * s);
    return true;
  }
  function footprintH(x, z, yaw, hw, hd, useMax) {
    let m = useMax ? -1e9 : 1e9;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const o = rotXZ(sx * hw, sz * hd, yaw), h = heightAt(x + o[0], z + o[1]);
      m = useMax ? Math.max(m, h) : Math.min(m, h);
    }
    return m;
  }
  function placeHouse(model, x, z, yaw, y, collide) {
    bAdd(K.main, model.main, [x, y, z], [0, yaw, 0]);
    if (model.glow) bAdd(K.glow, model.glow, [x, y, z], [0, yaw, 0]);
    if (collide) {
      for (const sx of [-1.6, 1.6]) { const o = rotXZ(sx, 0, yaw); addCollider(x + o[0], z + o[1], 2.65, 7); }
    }
  }
  function canHouse(x, z) { return colliderFree(x, z, 4.2, 3) && keepOk(x, z, 4.2); }

  function clusterAt(k, x, z, rng, idx) {
    const th = P.theme, yaw = rng() * TAU;
    const kind = idx % 3;
    let anchored = false;
    if (th === 'coast') {
      if (kind === 0 && canHouse(x, z)) {
        placeHouse(K.rorbuLow, x, z, yaw, footprintH(x, z, yaw, 3.2, 2.3, false) - 0.1, true); anchored = true;
      } else if (kind === 1 && colliderFree(x, z, 4.2, 2.5) && keepOk(x, z, 4.2)) {
        bAdd(K.main, K.hjell, [x, heightAt(x, z) - 0.1, z], [0, yaw, 0]);
        for (const sx of [-3.6, 0, 3.6]) { const o = rotXZ(sx, 0, yaw); addCollider(x + o[0], z + o[1], 0.75, 4); }
        anchored = true;
      } else if (kind === 2 && colliderFree(x, z, 3, 2.5) && keepOk(x, z, 3)) {
        // upturned boat on trestles + crates
        const y = heightAt(x, z);
        bAdd(K.main, K.boat, [x, y + 1.25, z], [Math.PI, yaw, 0]);
        const o = rotXZ(0, 0, yaw);
        addCollider(x + o[0], z + o[1], 1.6, 1.8);
        for (const s of [-1, 1]) { const q = rotXZ(0, s * 1.9, yaw); addCollider(x + q[0], z + q[1], 1.3, 1.8); }
        const c = rotXZ(2.4, 0.5, yaw);
        bAdd(K.main, TG.R.geo.box(1.1, 0.8, 0.8), [x + c[0], heightAt(x + c[0], z + c[1]) + 0.4, z + c[1]], [0, yaw + 0.3, 0], null, [0.42, 0.32, 0.22]);
        anchored = true;
      }
    } else if (th === 'snow') {
      if (kind === 0 && canHouse(x, z)) {
        placeHouse(K.cabin, x, z, yaw, footprintH(x, z, yaw, 3.2, 2.3, true) + 0.05, true); anchored = true;
      } else if (kind === 1 && colliderFree(x, z, 1.2, 2.5) && keepOk(x, z, 1.2)) {
        bAdd(K.main, K.cairns[idx % K.cairns.length], [x, heightAt(x, z) - 0.1, z], [0, yaw, 0], 1.4);
        addCollider(x, z, 1.05, 3); anchored = true;
      } else if (kind === 2) {
        for (let i = 0; i < 3; i++) {
          const a = rng() * TAU, d = 1.5 + rng() * 3;
          if (placeTree(K.treeA, x + Math.cos(a) * d, z + Math.sin(a) * d, 0.8 + rng() * 0.5, rng, true)) anchored = true;
        }
      }
    } else {
      if (kind === 0 && colliderFree(x, z, 3.5, 2.5) && keepOk(x, z, 3.5)) {
        for (let i = 0; i < 3; i++) {
          const a = yaw + i * 2.1, sx = x + Math.cos(a) * 2.6, sz = z + Math.sin(a) * 2.6;
          bAdd(K.main, K.stones[i % K.stones.length], [sx, heightAt(sx, sz) - 0.4, sz], [0, a, rng() * 0.08], 0.9 + rng() * 0.35);
          addCollider(sx, sz, 0.75, 4);
        }
        placeBrazier(x, z);
        anchored = true;
      } else if (kind === 1) {
        for (let i = 0; i < 2; i++) {
          const a = rng() * TAU, d = 1 + rng() * 3;
          if (placeTree(K.treeA, x + Math.cos(a) * d, z + Math.sin(a) * d, 0.9 + rng() * 0.4, rng, true)) anchored = true;
        }
      } else if (kind === 2 && colliderFree(x, z, 1, 3) && keepOk(x, z, 1)) {
        placeTorch(x, z); anchored = true;
      }
    }
    // boulders around the anchor for cover
    const nb = anchored ? 1 + ((rng() * 2) | 0) : 2 + ((rng() * 2) | 0);
    for (let i = 0; i < nb; i++) {
      const a = rng() * TAU, d = (anchored ? 5 : 1.5) + rng() * 3.5;
      placeBoulder(x + Math.cos(a) * d, z + Math.sin(a) * d, 1.0 + rng() * 1.1, rng, true);
    }
    for (let i = 0; i < 4; i++) {
      const a = rng() * TAU, d = 2 + rng() * 6, s = 0.2 + rng() * 0.35;
      const px = x + Math.cos(a) * d, pz = z + Math.sin(a) * d;
      if (sdRoute(px, pz) < -1) iAdd(rng() < 0.5 ? K.rockA : K.rockB, px, heightAt(px, pz) - 0.1 * s, pz, rng() * TAU, s);
    }
  }

  function placeBrazier(x, z) {
    const y = heightAt(x, z) - 0.05;
    bAdd(K.main, K.brazier.main, [x, y, z]);
    bAdd(K.glow, K.brazier.glow, [x, y, z]);
    addCollider(x, z, 0.6, 1.6);
    addFire(x, y + 1.6, z, 1.0);
  }
  function placeTorch(x, z) {
    const y = heightAt(x, z) - 0.1;
    bAdd(K.main, K.torch.main, [x, y, z]);
    bAdd(K.glow, K.torch.glow, [x, y, z]);
    addCollider(x, z, 0.25, 2.6);
    addFire(x, y + 2.75, z, 0.55);
  }

  function arenaCover(k, rng) {
    const R = AR[k], n = (P.theme === 'night' && k === 3) ? 4 : 6;
    const a0 = rng() * TAU;
    for (let c = 0; c < n; c++) {
      for (let tries = 0; tries < 14; tries++) {
        const a = a0 + c * TAU / n + (rng() - 0.5) * 0.7, d = 15 + rng() * (R - 24);
        const x = AX[k] + Math.cos(a) * d, z = AZ[k] + Math.sin(a) * d;
        if (!keepOk(x, z, 4)) continue;
        clusterAt(k, x, z, rng, c + k);
        break;
      }
    }
    // a few trees near the rim inside the arena (solid)
    for (let i = 0; i < 5; i++) {
      const a = rng() * TAU, d = R - 4 - rng() * 6;
      const x = AX[k] + Math.cos(a) * d, z = AZ[k] + Math.sin(a) * d;
      if (sdRoute(x, z) < -2) placeTree(rng() < 0.6 ? K.treeA : K.treeB, x, z, 0.85 + rng() * 0.45, rng, true);
    }
  }

  function corridorMarkers(rng) {
    for (let k = 0; k < 3; k++) {
      const t0 = AR[k] + 1, t1 = SL[k] - AR[k + 1] - 1;
      const px = -SUZ[k], pz = SUX[k];
      const step = P.theme === 'coast' ? 5 : P.theme === 'snow' ? 11 : 13;
      let side = 1;
      for (let t = t0; t <= t1; t += step) {
        if (Math.abs(t - gateT[k]) < 5) continue;
        const bx = SX[k] + SUX[k] * t, bz = SZ[k] + SUZ[k] * t;
        if (P.theme === 'coast') {
          for (const s of [-1, 1]) { const x = bx + px * s * (HW + 0.6), z = bz + pz * s * (HW + 0.6); iAdd(K.post, x, heightAt(x, z) - 0.1, z, rng(), 1); }
        } else {
          side = -side;
          const x = bx + px * side * (HW + 1.2), z = bz + pz * side * (HW + 1.2);
          if (P.theme === 'snow') bAdd(K.main, K.cairns[(t | 0) % K.cairns.length], [x, heightAt(x, z) - 0.1, z], [0, rng() * TAU, 0], 1.1);
          else placeTorch(x, z);
        }
      }
    }
  }

  function scenery(rng) {
    const th = P.theme;
    let placed = 0;
    const want = th === 'snow' ? 520 : th === 'coast' ? 420 : 300;
    for (let i = 0; i < 9000 && placed < want; i++) {
      const x = (rng() * 2 - 1) * (HALF - 4), z = (rng() * 2 - 1) * (HALF - 4);
      const d = sdRoute(x, z);
      if (d < 1.0 || d > 36) continue;
      if (rng() > 1.15 - d / 36) continue;
      normalInto(x, z);
      if (nY < 0.6) continue;
      const y = heightAt(x, z);
      if (P.sea && y < 1.4) continue;
      let nearGate = false;
      for (let k = 0; k < 3; k++) if (hyp(x - (SX[k] + SUX[k] * gateT[k]), z - (SZ[k] + SUZ[k] * gateT[k])) < 11) nearGate = true;
      if (nearGate) continue;
      iAdd(rng() < (th === 'night' ? 0.55 : 0.6) ? K.treeA : K.treeB, x, y - 0.25, z, rng() * TAU, 0.7 + rng() * 0.7);
      placed++;
    }
    // craggy outcrops on the slopes
    placed = 0;
    for (let i = 0; i < 3000 && placed < 190; i++) {
      const x = (rng() * 2 - 1) * (HALF - 4), z = (rng() * 2 - 1) * (HALF - 4);
      const d = sdRoute(x, z);
      if (d < 0.8 || d > 60) continue;
      const y = heightAt(x, z);
      if (P.sea && y < -2) continue;
      const s = 1.2 + rng() * (1.5 + d * 0.06);
      iAdd(rng() < 0.5 ? K.rockA : K.rockB, x, y - 0.3 * s, z, rng() * TAU, s);
      placed++;
    }
    // pebbles inside the playable area (decorative, no collision)
    placed = 0;
    for (let i = 0; i < 2000 && placed < 150; i++) {
      const x = (rng() * 2 - 1) * HALF, z = (rng() * 2 - 1) * HALF;
      if (sdRoute(x, z) > -1) continue;
      const s = 0.15 + rng() * 0.3;
      iAdd(rng() < 0.5 ? K.rockA : K.rockB, x, heightAt(x, z) - 0.1 * s, z, rng() * TAU, s);
      placed++;
    }
    // grass tufts
    if (K.grass) {
      placed = 0;
      for (let i = 0; i < 9000 && placed < 1500; i++) {
        const x = (rng() * 2 - 1) * HALF, z = (rng() * 2 - 1) * HALF;
        const d = sdRoute(x, z);
        if (d > 6) continue;
        const y = heightAt(x, z);
        if (P.sea && y < 2.2) continue;
        if (d > 0) { normalInto(x, z); if (nY < 0.8) continue; }
        iAdd(K.grass, x, y - 0.05, z, rng() * TAU, 0.7 + rng() * 0.8);
        placed++;
      }
    }
  }

  // ------------------------------------------------ theme specials
  function coastSpecials(rng) {
    for (let k = 0; k < 4; k++) {
      const fx = FREE[k][0], fz = FREE[k][1], R = AR[k];
      if (SITES.pier[k]) {
        // pier into the fjord with rorbuer on stilts and moored boats
        const rx = AX[k] + fx * (R - 1.5), rz = AZ[k] + fz * (R - 1.5);
        const deckY = Math.max(heightAt(rx, rz), 1.4) + 0.25, yaw = U.yawTo(rx, rz, rx + fx, rz + fz), len = 30;
        const g = TG.R.geo;
        const cx = rx + fx * len * 0.5, cz = rz + fz * len * 0.5;
        bAdd(K.main, g.box(3, 0.2, len), [cx, deckY, cz], [0, yaw, 0], null, [0.44, 0.36, 0.26]);
        const px = -fz, pz = fx;
        for (let t = 2; t <= len; t += 3.5) {
          for (const s of [-1, 1]) {
            const x = rx + fx * t + px * s * 1.4, z = rz + fz * t + pz * s * 1.4;
            bAdd(K.main, g.cylinder(0.15, 0.17, 8, 6), [x, deckY - 4, z], null, null, [0.26, 0.21, 0.16]);
          }
        }
        for (const t of [9, 21]) {
          for (const s of [-1, 1]) {
            if (t === 21 && s === 1) continue;
            const x = rx + fx * t + px * s * 6.4, z = rz + fz * t + pz * s * 6.4;
            placeHouse(K.rorbuHigh, x, z, U.yawTo(x, z, x - px * s, z - pz * s), deckY + 0.3 - 2.2, true);
          }
        }
        for (const b of [[15, 3.2], [26, -3.4], [38, 8]]) {
          const x = rx + fx * b[0] + px * b[1], z = rz + fz * b[0] + pz * b[1];
          bAdd(K.main, K.boatW, [x, 0.02, z], [0, yaw + (rng() - 0.5) * 0.4, (rng() - 0.5) * 0.1]);
        }
        safe(() => lights.push(TG.R.lights.add({ pos: [rx + fx * 9, deckY + 3, rz + fz * 9], color: [2.6, 1.6, 0.7], radius: 14 })));
      } else {
        // land side: a pair of rorbuer and a fish rack just outside the arena rim
        for (const s of [-0.35, 0.35]) {
          const a = Math.atan2(fz, fx) + s, x = AX[k] + Math.cos(a) * (R + 6), z = AZ[k] + Math.sin(a) * (R + 6);
          const yaw = U.yawTo(x, z, AX[k], AZ[k]);
          placeHouse(K.rorbuLow, x, z, yaw, footprintH(x, z, yaw, 3.2, 2.3, false) - 0.1, true);
        }
      }
    }
  }

  function snowSpecials(rng, lake) {
    if (lake) {
      const g = TG.R.geo;
      bAdd(K.ice, g.cylinder(lake.r + 1, lake.r + 1, 0.2, 40), [lake.x, lake.h, lake.z], null, null, [0.78, 0.88, 0.97]);
      for (let i = 0; i < 4; i++) {
        const a = rng() * TAU, d = rng() * lake.r * 0.7;
        bAdd(K.ice, g.box(0.05, 0.02, 3 + rng() * 6), [lake.x + Math.cos(a) * d, lake.h + 0.11, lake.z + Math.sin(a) * d], [0, rng() * 3, 0], null, [0.55, 0.65, 0.8]);
      }
    }
    // DNT cabin just outside the rim of the start and third arenas
    for (const k of [0, 2]) {
      const a = Math.atan2(FREE[k][1], FREE[k][0]) + 0.3, x = AX[k] + Math.cos(a) * (AR[k] + 7), z = AZ[k] + Math.sin(a) * (AR[k] + 7);
      const yaw = U.yawTo(x, z, AX[k], AZ[k]);
      placeHouse(K.cabin, x, z, yaw, footprintH(x, z, yaw, 3.2, 2.3, true) + 0.05, true);
    }
  }

  function nightSpecials(rng, church) {
    const g = TG.R.geo;
    if (church) {
      const y = heightAt(church.x, church.z) - 0.2;
      bAdd(K.main, K.church.main, [church.x, y, church.z], [0, church.yaw, 0]);
      bAdd(K.glow, K.church.glow, [church.x, y, church.z], [0, church.yaw, 0]);
      addCollider(church.x, church.z, 6, 20);
      const o = rotXZ(0, -7, church.yaw);
      placeBrazier(church.x + o[0], church.z + o[1]);
    }
    // standing-stone ring outside arena 2 rim
    {
      const k = 2, a = Math.atan2(FREE[k][1], FREE[k][0]), cx = AX[k] + Math.cos(a) * (AR[k] + 5), cz = AZ[k] + Math.sin(a) * (AR[k] + 5);
      for (let i = 0; i < 7; i++) {
        const b = i / 7 * TAU, x = cx + Math.cos(b) * 8, z = cz + Math.sin(b) * 8;
        bAdd(K.main, K.stones[i % K.stones.length], [x, heightAt(x, z) - 0.5, z], [0, b, (rng() - 0.5) * 0.1], 1.2 + rng() * 0.3);
      }
    }
    // Mountain King's hall in arena 4
    const k = 3, R = AR[k], cx = AX[k], cz = AZ[k], ea = Math.atan2(ENT[k][1], ENT[k][0]), xa = ea + Math.PI;
    for (let i = 0; i < 10; i++) {
      const a = xa + (i + 0.5) / 10 * TAU;
      if (angDist(a, ea) < 0.75) continue;
      const x = cx + Math.cos(a) * (R - 7), z = cz + Math.sin(a) * (R - 7);
      if (!colliderFree(x, z, 3.1, 1)) continue;
      const y = heightAt(x, z) - 0.6;
      bAdd(K.main, K.pillar.main, [x, y, z], [0, a, 0]);
      bAdd(K.lava, K.pillar.glow, [x, y, z], [0, a, 0]);
      addCollider(x, z, 3.1, 30);
    }
    const ex = EXI[k][0], ez = EXI[k][1], gx = cx + ex * (R + 4), gz = cz + ez * (R + 4);
    const gyaw = U.yawTo(gx, gz, cx, cz), gy = heightAt(gx, gz) - 0.3;
    bAdd(K.main, K.hallGate.main, [gx, gy, gz], [0, gyaw, 0]);
    bAdd(K.lava, K.hallGate.glow, [gx, gy, gz], [0, gyaw, 0]);
    for (const s of [-1, 1]) {
      const o = rotXZ(s * 14, 0, gyaw); addCollider(gx + o[0], gz + o[1], 4.6, 46);
      const b = rotXZ(s * 8, -9, gyaw); placeBrazier(gx + b[0], gz + b[1]);
    }
    const dl = rotXZ(0, 2, gyaw);
    safe(() => lights.push(TG.R.lights.add({ pos: [gx + dl[0], gy + 8, gz + dl[1]], color: [3.2, 0.9, 0.25], radius: 32 })));
    safe(() => lights.push(TG.R.lights.add({ pos: [cx, heightAt(cx, cz) + 2, cz], color: [2.2, 0.6, 0.15], radius: 24 })));
    buildCracks(rng, k);
  }

  function buildCracks(rng, k) {
    const R = AR[k], pos = [], idx = [], pts = [];
    for (let c = 0; c < 18; c++) {
      const a0 = rng() * TAU, d0 = 6 + rng() * (R + 8);
      let x = AX[k] + Math.cos(a0) * d0, z = AZ[k] + Math.sin(a0) * d0, dir = rng() * TAU;
      const n = 10 + ((rng() * 16) | 0), w = 0.22 + rng() * 0.45, v0 = pos.length / 3;
      for (let i = 0; i <= n; i++) {
        const wi = w * Math.sin(Math.PI * i / n) + 0.04, px = -Math.sin(dir), pz = Math.cos(dir);
        pos.push(x + px * wi, heightAt(x + px * wi, z + pz * wi) + 0.05, z + pz * wi);
        pos.push(x - px * wi, heightAt(x - px * wi, z - pz * wi) + 0.05, z - pz * wi);
        if (i % 3 === 1) pts.push(x, heightAt(x, z) + 0.1, z);
        if (i < n) { const b = v0 + i * 2; idx.push(b, b + 1, b + 2, b + 2, b + 1, b + 3); }
        dir += (rng() - 0.5) * 0.9;
        x += Math.cos(dir) * 1.4; z += Math.sin(dir) * 1.4;
      }
    }
    const P32 = new Float32Array(pos), I16 = new Uint16Array(idx), nor = new Float32Array(pos.length);
    for (let i = 1; i < nor.length; i += 3) nor[i] = 1;
    fixWindingUp(P32, I16);
    addMeshNode(TG.R.geo.custom({ positions: P32, normals: nor, indices: I16 }), lavaMat, false);
    crackPts = new Float32Array(pts);
  }

  // ================================================================ site planning (before the heightfield: pads)
  let SITES = { pier: [false, false, false, false], lake: null, church: null };
  function planSites(rng) {
    pads = [];
    SITES = { pier: [false, false, false, false], lake: null, church: null };
    const th = P.theme;
    if (th === 'coast') {
      P.seaSpots = [];
      for (let k = 0; k < 4; k++) {
        if (k === 0 || rng() < 0.7) P.seaSpots.push(AX[k] + FREE[k][0] * (AR[k] + 40), AZ[k] + FREE[k][1] * (AR[k] + 40));
      }

        SITES.pier[k] = seaMask(x, z) > 0.6;
        if (!SITES.pier[k]) {
          for (const s of [-0.35, 0.35]) {
            const a = Math.atan2(FREE[k][1], FREE[k][0]) + s, px = AX[k] + Math.cos(a) * (AR[k] + 6), pz = AZ[k] + Math.sin(a) * (AR[k] + 6);
            pads.push({ x: px, z: pz, r: 4.5, b: 6, h: walkH(px, pz) + 0.3 });
          }
        }
      }
    } else if (th === 'snow') {
      for (const k of [0, 2]) {
        const a = Math.atan2(FREE[k][1], FREE[k][0]) + 0.3, px = AX[k] + Math.cos(a) * (AR[k] + 7), pz = AZ[k] + Math.sin(a) * (AR[k] + 7);
        pads.push({ x: px, z: pz, r: 5, b: 6, h: walkH(px, pz) + 0.2 });
      }
      const k = 1, lx = AX[k] + FREE[k][0] * (AR[k] + 22), lz = AZ[k] + FREE[k][1] * (AR[k] + 22);
      const h = walkH(AX[k] + FREE[k][0] * AR[k], AZ[k] + FREE[k][1] * AR[k]) - 0.6;
      pads.push({ x: lx, z: lz, r: 22, b: 12, h: h });
      SITES.lake = { x: lx, z: lz, r: 22, h: h };
    } else {
      const k = 1, cx = AX[k] + FREE[k][0] * (AR[k] + 20), cz = AZ[k] + FREE[k][1] * (AR[k] + 20);
      pads.push({ x: cx, z: cz, r: 9, b: 9, h: walkH(cx, cz) + 4 });
      SITES.church = { x: cx, z: cz, yaw: U.yawTo(cx, cz, AX[k], AZ[k]) };
      const sx = AX[2] + FREE[2][0] * (AR[2] + 5), sz = AZ[2] + FREE[2][1] * (AR[2] + 5);
      pads.push({ x: sx, z: sz, r: 9, b: 6, h: walkH(sx, sz) + 0.2 });
      const hx = AX[3] + EXI[3][0] * (AR[3] + 9), hz = AZ[3] + EXI[3][1] * (AR[3] + 9);
      pads.push({ x: hx, z: hz, r: 12, b: 16, h: walkH(AX[3] + EXI[3][0] * (AR[3] - 4), AZ[3] + EXI[3][1] * (AR[3] - 4)) });
    }
  }

  // ================================================================ gates
  function barrierGeo(W, Hh) {
    const cols = 15, rowsF = [0, 0.18, 0.5, 1], rowB = [1, 0.85, 0.45, 0], nr = rowsF.length;
    const pos = new Float32Array(cols * nr * 3), nor = new Float32Array(cols * nr * 3), col = new Float32Array(cols * nr * 3);
    for (let r = 0; r < nr; r++) for (let c = 0; c < cols; c++) {
      const o = (r * cols + c) * 3, u = c / (cols - 1);
      const edge = sstep(0, 0.12, u) * sstep(1, 0.88, u), b = rowB[r] * (0.3 + 0.7 * edge);
      pos[o] = -W / 2 + W * u; pos[o + 1] = Hh * rowsF[r]; pos[o + 2] = 0;
      nor[o + 2] = 1;
      col[o] = b; col[o + 1] = b; col[o + 2] = b;
    }
    const idx = new Uint16Array((nr - 1) * (cols - 1) * 6);
    let t = 0;
    for (let r = 0; r < nr - 1; r++) for (let c = 0; c < cols - 1; c++) {
      const a = r * cols + c, b = a + 1, c2 = a + cols, d = c2 + 1;
      idx[t++] = a; idx[t++] = b; idx[t++] = c2;   // CCW seen from +Z
      idx[t++] = b; idx[t++] = d; idx[t++] = c2;
    }
    return TG.R.geo.custom({ positions: pos, normals: nor, colors: col, indices: idx });
  }

  function buildGates(rng) {
    gates = [];
    const R = TG.R, th = P.theme;
    const runeE = th === 'night' ? [3.0, 0.9, 0.3] : th === 'snow' ? [0.6, 1.6, 3.2] : [0.4, 2.2, 2.0];
    const barC = th === 'night' ? [1.0, 0.42, 0.18] : th === 'snow' ? [0.45, 0.75, 1.0] : [0.35, 1.0, 0.85];
    const barE = th === 'night' ? [1.2, 0.35, 0.1] : th === 'snow' ? [0.35, 0.75, 1.4] : [0.25, 1.0, 0.85];
    const Hh = 6.5, W = 2 * (HW + 1.0) - 1.4;
    for (let k = 0; k < 3; k++) {
      const t = gateT[k], ux = SUX[k], uz = SUZ[k], px = -uz, pz = ux;
      const gx = SX[k] + ux * t, gz = SZ[k] + uz * t;
      const yaw = U.yawTo(gx, gz, gx + ux, gz + uz);
      let gy = 1e9;
      for (let s = -1; s <= 1.001; s += 0.25) gy = Math.min(gy, heightAt(gx + px * s * HW, gz + pz * s * HW));
      gy -= 0.5;
      const runeParts = [];
      for (const side of [-1, 1]) {
        const sx = gx + px * side * (HW + 1.0), sz = gz + pz * side * (HW + 1.0), sy = heightAt(sx, sz) - 0.6;
        bAdd(K.main, K.gateStone, [sx, sy, sz], [0, yaw, 0]);
        const local = [];
        for (let gI = 0; gI < 4; gI++) {
          const yy = 1.5 + gI * 1.1, dd = (1.35 + (1.0 - 1.35) * yy / 6.2) / 2 + 0.08;
          runeStrokes(local, rng, 0, yy, dd, false);
          runeStrokes(local, rng, 0, yy, -dd, true);
        }
        runeParts.push(part(merge(local), [sx, sy, sz], [0, yaw, 0]));
        addCollider(sx, sz, 1.25, 5.6);
      }
      const runeMat = R.material({ color: [0.25, 0.25, 0.25], emissive: runeE.slice(), rough: 0.5 });
      addMeshNode(merge(runeParts), runeMat, false);
      const bmat = R.material({ color: barC.slice(), emissive: barE.slice(), alpha: 0.6, additive: true, unlit: true, doubleSided: true, rough: 1 });
      const node = addMeshNode(barrierGeo(W, Hh), bmat, false, [gx, gy, gz], [0, yaw, 0]);
      node.scale = [1, 1, 1];
      gates.push({ k: k, x: gx, z: gz, y: gy, h: Hh + 1, ux: ux, uz: uz, px: px, pz: pz, W: W, Hh: Hh, block: true, state: 0, t: 0,
        node: node, mat: bmat, runeMat: runeMat, runeE: runeE, barC: barC, barE: barE, acc: 0 });
    }
  }

  // ================================================================ load / dispose
  function quiet(fn) { try { fn(); } catch (e) { /* already gone */ } }
  function disposeAll() {
    const R = TG.R;
    if (R) {
      for (const n of nodes) quiet(() => R.scene.remove(n));
      for (const h of instHandles) quiet(() => R.scene.removeInstances(h));
      for (const l of lights) quiet(() => R.lights.remove(l));
    }
    for (const m of meshes) quiet(() => m.dispose());
    meshes = []; nodes = []; instHandles = []; lights = [];
    gates = []; fires = []; crackPts = null; glowMats = []; lavaMat = null; K = null;
    colList = []; NC = 0; World.colliders = colList;
    CX = new Float32Array(0); CZ = CX; CR = CX; CH = CX; CB = CX;
    cellStart = new Int32Array(GN * GN + 1); cellItems = new Int32Array(0);
  }

  function validateSpawns() {
    const tmp = [0, 0, 0];
    for (let k = 0; k < World.stages.length; k++) {
      const st = World.stages[k], R = st.radius, out = [];
      for (const p of st.spawnPoints) {
        tmp[0] = p[0]; tmp[2] = p[1];
        World.resolve(tmp, 1.2);
        if (hyp(tmp[0] - p[0], tmp[2] - p[1]) < 4.5 && hyp(tmp[0] - st.center[0], tmp[2] - st.center[1]) <= R) out.push([tmp[0], tmp[2]]);
      }
      for (let i = 0; i < 36 && out.length < 8; i++) {
        const a = 0.13 + i / 36 * TAU, d = R - 10 - (i % 3) * 4;
        tmp[0] = st.center[0] + Math.cos(a) * d; tmp[2] = st.center[1] + Math.sin(a) * d;
        World.resolve(tmp, 1.2);
        let dup = false;
        for (const q of out) if (hyp(q[0] - tmp[0], q[1] - tmp[2]) < 5) dup = true;
        if (!dup) out.push([tmp[0], tmp[2]]);
      }
      st.spawnPoints = out;
      tmp[0] = st.playerStart[0]; tmp[2] = st.playerStart[1]; World.resolve(tmp, 0.6);
      st.playerStart = [tmp[0], tmp[2]];
      st.playerYaw = U.yawTo(tmp[0], tmp[2], st.center[0], st.center[1]);
      tmp[0] = st.bossSpawn[0]; tmp[2] = st.bossSpawn[1]; World.resolve(tmp, 2.5);
      st.bossSpawn = [tmp[0], tmp[2]];
    }
  }

  World.load = function (levelIndex) {
    const levels = (TG.Data && TG.Data.levels) || [];
    let li = levelIndex | 0;
    if (li < 0 || li >= levels.length) li = 0;
    const L = levels[li] || { theme: 'coast' };
    const theme = (L.theme === 'snow' || L.theme === 'night') ? L.theme : 'coast';
    disposeAll();
    loaded = false;
    levelIdx = li;
    World.theme = theme;
    World.footstep = theme === 'snow' ? 'footstep_snow' : 'footstep';
    P = makeParams(li, theme);
    const rng = P.rng;
    setRoute(genRoute(rng));
    computeFree(rng);
    buildStages();
    planSites(rng);
    buildHeights();
    ambT = 0; emberAcc = 0;
    const R = TG.R;
    if (R && R.geo) {
      safe(() => {
        makeKit(rng);
        const tmat = R.material({ color: [1, 1, 1], rough: 0.93, detail: 0.85, detailScale: 1.0, snow: theme === 'snow' ? 0.25 : 0, wet: theme === 'coast' ? 0.05 : 0 });
        buildTerrainMesh(tmat);
        const bmat = R.material({ color: [1, 1, 1], rough: 0.95, detail: 0.3, detailScale: 0.3, snow: theme === 'snow' ? 0.4 : 0 });
        buildBackdrop(bmat);
        if (theme === 'coast') coastSpecials(rng);
        else if (theme === 'snow') snowSpecials(rng, SITES.lake);

      const dx = f.x - cx, dz = f.z - cz;

        f.acc -= 1;
        FL.pos[0] = f.x; FL.pos[1] = f.y; FL.pos[2] = f.z;
        FL.spread = 0.12 * f.size; FL.size[0] = 0.75 * f.size + 0.15; FL.vel[1] = 1.3 + f.size;
        emit(FL);
        if (Math.random() < 0.12) { SM.pos[0] = f.x; SM.pos[1] = f.y + 0.6; SM.pos[2] = f.z; emit(SM); }
        if (Math.random() < 0.1) { EM.pos[0] = f.x; EM.pos[1] = f.y + 0.3; EM.pos[2] = f.z; EM.spread = 0.2; emit(EM); }
      }
    }

    if (lavaMat && lavaMat.emissive && P && P.theme === 'night') {
      const p = 0.82 + 0.12 * Math.sin(time * 1.7) + 0.06 * Math.sin(time * 4.3);
      lavaMat.emissive[0] = 5 * p; lavaMat.emissive[1] = 1.6 * p; lavaMat.emissive[2] = 0.3 * p;

        emberAcc += dt * 16;
        let n = 0;
        while (emberAcc >= 1 && n++ < 4) {
          emberAcc -= 1;
          const j = ((Math.random() * (crackPts.length / 3)) | 0) * 3;
          EM.pos[0] = crackPts[j]; EM.pos[1] = crackPts[j + 1]; EM.pos[2] = crackPts[j + 2]; EM.spread = 0.4;
          emit(EM);
        }
      }
    }
  };

  TG.World = World;
})();

      const e = onEll(c, rad, b.r(thMin, thMax), b.r(0.0, 1.2));
      const d = [e.n[0] + b.r(-0.3, 0.3), e.n[1] + 0.6, e.n[2] + b.r(-0.3, 0.3)];
      b.spike(e.p, d, b.r(0.05, 0.1) * lenMul, b.r(0.25, 0.55) * lenMul, b.rng() < 0.5 ? ICE : [0.86, 0.95, 1.0], 5);
    }
  }

  function buildBody(P, C, D, seed) {
    const b = new Builder(seed + 11);
    const lw = P.legW, bw = Math.sqrt(P.belly);
    b.lump([0, 0.04, 0.04], [0.4 * bw * Math.pow(lw, 0.3), 0.27, 0.34 * bw], C.skin, 0.12);
    b.cyl([0, -0.1, 0.02], 0.42 * bw, 0.52 * bw, 0.32, C.cloth, null, 9, 0.06);
    b.cyl([0, 0.06, 0.02], 0.45 * bw, 0.45 * bw, 0.08, [0.2, 0.14, 0.09], null, 9);
    b.box([0, -0.3, -0.36 * bw], 0.34, 0.3, 0.05, mulC(C.cloth, 0.85), [0.15, 0, 0]);
    b.box([0, -0.3, 0.4 * bw], 0.38, 0.28, 0.05, mulC(C.cloth, 0.8), [-0.15, 0, 0]);
    if (P.bag) {
      b.lump([-0.46 * bw, -0.06, 0.08], [0.17, 0.21, 0.15], mulC(C.cloth, 1.15), 0.1);
      b.lump([-0.47 * bw, 0.13, 0.04], [0.09, 0.08, 0.09], C.rock, 0.25, null, 6);
      b.lump([-0.43 * bw, 0.14, 0.13], [0.08, 0.07, 0.08], C.rock, 0.25, null, 6);
    }
    if (D.kelp) decoKelp(b, [0, -0.12, 0.05], 10, 0.55, 0.45 * bw);
    if (D.cloak) b.lump([0, 0.06, 0.04], [0.5 * bw, 0.09, 0.42 * bw], GOLD, 0.05, null, 8);
    return b.geo();
  }

  function buildTorso(P, C, D, seed) {
    const b = new Builder(seed + 23);
    const ch = P.chest, be = P.belly, sh = P.shX, sq = Math.sqrt(ch);
    b.lump([0, 0.32, -0.08 - 0.12 * (be - 1)], [0.5 * be, 0.48 * be, 0.5 * be], C.belly, 0.1);
    b.lump([0, 0.72, 0.04], [0.58 * ch, 0.44 * ch, 0.44 * ch], C.skin, 0.13);
    const humpC = [0, 0.86, 0.28], humpR = [0.46 * ch, 0.4 * P.hump, 0.34 * P.hump];
    b.lump(humpC, humpR, C.hair, 0.2);
    b.lump([sh, 0.86, 0.02], [0.27 * P.armW, 0.25 * P.armW, 0.27 * P.armW], C.skin, 0.12);
    b.lump([-sh, 0.86, 0.02], [0.27 * P.armW, 0.25 * P.armW, 0.27 * P.armW], C.skin, 0.12);
    b.lump([0, P.neckY - 0.02, -0.12], [0.22 * sq, 0.2 * sq, 0.22 * sq], C.skin, 0.1);
    b.lump([0.2 * ch, 0.62, -0.34 * ch], [0.2 * ch, 0.13 * ch, 0.1 * ch], C.skin, 0.1);
    b.lump([-0.2 * ch, 0.62, -0.34 * ch], [0.2 * ch, 0.13 * ch, 0.1 * ch], C.skin, 0.1);
    b.lump([0, 0.3, -0.56 * be - 0.08 * (be - 1)], [0.04, 0.04, 0.03], mulC(C.belly, 0.7), 0, null, 6); // navel
    // mossy, hairy back
    const nm = Math.round(12 * P.moss);
    for (let i = 0; i < nm; i++) {
      const e = onEll(humpC, humpR, b.r(-1.3, 1.3), b.r(-0.3, 1.1));
      b.spike(e.p, [e.n[0] * 0.6, e.n[1] + 0.7, e.n[2] + 0.4], b.r(0.05, 0.09), b.r(0.18, 0.34) * Math.sqrt(P.moss), b.rng() < 0.6 ? C.hair : mulC(C.hair, 0.7), 5);
    }
    for (let i = 0; i < 4; i++) {
      const e = onEll(humpC, humpR, b.r(-1.2, 1.2), b.r(-0.2, 0.9));
      b.lump(e.p, [0.12, 0.06, 0.12], mixC(C.hair, [0.3, 0.42, 0.18], 0.4), 0.3, null, 6);
    }
    if (P.backRocks) {
      for (let i = 0; i < 6; i++) {
        const e = onEll(humpC, humpR, b.r(-1.1, 1.1), b.r(0.0, 1.0));
        b.lump(e.p, [b.r(0.1, 0.18), b.r(0.09, 0.16), b.r(0.1, 0.17)], C.rock, 0.3, null, 6);
      }
    }
    // ---- boss decorations
    if (D.spikes) {
      for (let i = 0; i < D.spikes; i++) {
        const t = D.spikes > 1 ? i / (D.spikes - 1) : 0.5;
        const e = onEll(humpC, humpR, 0, lerp(-0.35, 1.15, t));
        b.spike([e.p[0], e.p[1], e.p[2] - 0.04], [0, e.n[1] + 0.6, e.n[2] + 0.5], 0.09 + 0.03 * Math.sin(t * 3), 0.3 + 0.25 * Math.sin(t * Math.PI), D.spikeCol || C.rock, 5);
      }
    }
    if (D.kelp) {
      decoKelp(b, [sh, 1.0, 0.05], 7, 0.8, 0.2);
      decoKelp(b, [-sh, 1.0, 0.05], 7, 0.8, 0.2);
      decoKelp(b, [0, 0.95, 0.3], 8, 0.9, 0.35);
      decoKelp(b, [0, 0.55, -0.45 * ch], 5, 0.45, 0.3);
    }
    if (D.barnacles) {
      decoBarnacles(b, humpC, humpR, 22);
      decoBarnacles(b, [sh, 0.86, 0.02], [0.27 * P.armW, 0.25 * P.armW, 0.27 * P.armW], 6);
      decoBarnacles(b, [0, 0.32, -0.1], [0.5 * be, 0.48 * be, 0.5 * be], 8);
    }
    if (D.boat) {
      // half a broken færing draped over the LEFT shoulder (-X), keel up
      const bx = -sh - 0.06, by = 1.02, bz = 0.02, red = [0.5, 0.12, 0.08], tar = [0.24, 0.17, 0.11], white = [0.86, 0.85, 0.8];
      b.box([bx + 0.26, by - 0.06, bz], 0.06, 0.55, 1.25, tar, [0, 0, 0.62]);
      b.box([bx - 0.26, by - 0.06, bz], 0.06, 0.55, 1.25, tar, [0, 0, -0.62]);
      b.box([bx + 0.3, by - 0.16, bz], 0.07, 0.1, 1.27, red, [0, 0, 0.62]);
      b.box([bx - 0.3, by - 0.16, bz], 0.07, 0.1, 1.27, red, [0, 0, -0.62]);
      b.box([bx + 0.22, by + 0.02, bz], 0.07, 0.06, 1.26, white, [0, 0, 0.62]);
      b.box([bx - 0.22, by + 0.02, bz], 0.07, 0.06, 1.26, white, [0, 0, -0.62]);
      b.box([bx, by + 0.2, bz], 0.12, 0.1, 1.35, tar);
      for (let i = 0; i < 3; i++) b.box([bx, by + 0.02, bz - 0.45 + i * 0.45], 0.62, 0.06, 0.07, DARKWOOD, [0, 0, 0]);
      // splintered end
      for (let i = 0; i < 4; i++) b.spike([bx + b.r(-0.3, 0.3), by + b.r(-0.2, 0.15), bz + 0.62], [b.r(-0.3, 0.3), b.r(-0.2, 0.3), 1], 0.04, b.r(0.12, 0.25), tar, 4);
      decoBarnacles(b, [bx, by + 0.05, bz], [0.3, 0.2, 0.6], 10);
      decoKelp(b, [bx, by - 0.1, bz], 6, 0.7, 0.4);
    }
    if (D.iceBack) {
      decoIce(b, [sh, 0.95, 0.05], [0.25, 0.22, 0.25], 5, 1.0, -1.5, 1.5);
      decoIce(b, [-sh, 0.95, 0.05], [0.25, 0.22, 0.25], 5, 1.0, -1.5, 1.5);
    }
    if (D.cloak) {
      const red = [0.5, 0.06, 0.09], fur = [0.88, 0.85, 0.78];
      b.parts.push({ geo: TG.R.geo.cone(1, 1, 9), pos: [0, 0.35, 0.42], rot: [0.18, 0, 0], scale: [0.95 * ch, 1.7, 0.5], color: red });
      b.lump([0, -0.45, 0.62], [0.85 * ch, 0.12, 0.35], mulC(red, 0.8), 0.15);
      for (let i = 0; i < 11; i++) {
        const th = -2.2 + i * 0.44;
        b.lump([Math.sin(th) * 0.5 * ch, 1.0 + b.r(-0.03, 0.05), Math.cos(th) * 0.38 + 0.02], [0.17, 0.14, 0.17], b.rng() < 0.2 ? [0.12, 0.1, 0.1] : fur, 0.2, null, 6);
      }
      b.lump([0.0, 0.96, -0.3 * ch], [0.1, 0.1, 0.06], GOLD, 0.05, null, 6); // clasp
    }
    if (D.belt) b.cyl([0, 0.12, -0.06], 0.52 * be, 0.52 * be, 0.1, D.belt, null, 9);
    return b.geo();
  }

  function buildHead(P, C, D, seed) {
    const b = new Builder(seed + 37);
    const hs = P.hs, nz = P.nose, er = P.ear;
    b.lump([0, 0.24 * hs, 0.03 * hs], [0.3 * hs, 0.31 * hs, 0.33 * hs], C.skin, 0.12);
    b.lump([0, 0.33 * hs, -0.24 * hs], [0.3 * hs, 0.09 * hs, 0.12 * hs], mulC(C.skin, 0.9), 0.15);
    b.lump([0.16 * hs, 0.13 * hs, -0.18 * hs], [0.14 * hs, 0.12 * hs, 0.13 * hs], C.skin, 0.12);
    b.lump([-0.16 * hs, 0.13 * hs, -0.18 * hs], [0.14 * hs, 0.12 * hs, 0.13 * hs], C.skin, 0.12);
    // the enormous nose: bridge + drooping bulb
    b.lump([0, 0.21 * hs, -0.34 * hs], [0.09 * hs * nz, 0.11 * hs * nz, 0.14 * hs * nz], C.nose, 0.1);
    b.lump([0, 0.12 * hs - 0.04 * nz, -0.4 * hs - 0.12 * nz], [0.12 * hs * nz, 0.13 * hs * nz, 0.13 * hs * nz], C.nose, 0.14);
    b.lump([0.03 * hs, 0.16 * hs, -0.48 * hs - 0.1 * nz], [0.025, 0.025, 0.025], mulC(C.nose, 0.8), 0, null, 5); // wart
    // pointed ears
    const ex = 0.3 * hs, ey = 0.26 * hs;
    b.spike([ex, ey, 0.03], [1, 0.35, 0.25], 0.09 * hs * Math.sqrt(er), 0.32 * hs * er, C.skin, 5);
    b.spike([-ex, ey, 0.03], [-1, 0.35, 0.25], 0.09 * hs * Math.sqrt(er), 0.32 * hs * er, C.skin, 5);
    // hair tufts
    const nt = D.mane ? 14 : 4;
    for (let i = 0; i < nt; i++) {
      const e = onEll([0, 0.26 * hs, 0.05 * hs], [0.28 * hs, 0.3 * hs, 0.3 * hs], b.r(-1.6, 1.6), b.r(0.3, 1.3));
      b.spike(e.p, [e.n[0] * 0.5, e.n[1] + 0.4, e.n[2] + 0.9], b.r(0.04, 0.07) * hs, b.r(0.15, 0.3) * hs * (D.mane ? 1.8 : 1), C.hair, 5);
    }
    // ---- horns / antlers / crowns
    const hc = D.hornCol || BONE;
    if (D.horns === 0) { // ram curls
      for (let s = -1; s <= 1; s += 2) for (let i = 0; i < 6; i++) {
        const a = i / 5 * 4.2, rr = 0.16 * hs * (1 - i * 0.06);
        b.lump([s * (0.28 * hs + Math.sin(a) * 0.06 * hs + i * 0.012), 0.38 * hs + Math.cos(a) * rr - 0.1 * hs, 0.08 * hs + Math.sin(a) * rr],
          [0.085 * hs * (1 - i * 0.1), 0.085 * hs * (1 - i * 0.1), 0.085 * hs * (1 - i * 0.1)], hc, 0.12, null, 6);
      }
    } else if (D.horns === 1) { // bull horns
      for (let s = -1; s <= 1; s += 2) {
        b.spike([s * 0.22 * hs, 0.42 * hs, 0.02], [s, 0.25, -0.1], 0.08 * hs, 0.32 * hs, hc, 6);
        b.spike([s * 0.5 * hs, 0.48 * hs, -0.02], [s * 0.25, 1, -0.2], 0.06 * hs, 0.36 * hs, hc, 6);
      }
    } else if (D.horns === 2) { // antlers
      for (let s = -1; s <= 1; s += 2) {
        b.spike([s * 0.16 * hs, 0.48 * hs, 0.06], [s * 0.7, 1, 0.3], 0.045 * hs, 0.62 * hs, hc, 5);
        for (let i = 0; i < 3; i++) {
          const t = 0.3 + i * 0.22;
          b.spike([s * (0.16 + 0.32 * t) * hs, (0.48 + 0.48 * t) * hs, 0.06 + 0.15 * t * hs], [s * 0.2, 1, -0.5 + i * 0.4], 0.03 * hs, 0.26 * hs, hc, 4);
        }
      }
    } else if (D.horns === 3) { // ring of spikes
      for (let i = 0; i < 7; i++) {
        const th = -1.6 + i * (3.2 / 6);
        b.spike([Math.sin(th) * 0.24 * hs, 0.46 * hs, Math.cos(th) * 0.22 * hs + 0.04], [Math.sin(th) * 0.5, 1, Math.cos(th) * 0.4], 0.05 * hs, (0.22 + 0.12 * Math.cos(th)) * hs, hc, 5);
      }
    }
    if (D.crown) {
      b.cyl([0, 0.5 * hs, 0.03 * hs], 0.3 * hs, 0.28 * hs, 0.14 * hs, GOLD, null, 10);
      for (let i = 0; i < 8; i++) {
        const th = i / 8 * TAU;
        b.spike([Math.sin(th) * 0.29 * hs, 0.55 * hs, Math.cos(th) * 0.28 * hs + 0.03 * hs], [Math.sin(th) * 0.25, 1, Math.cos(th) * 0.25], 0.06 * hs, 0.24 * hs, GOLD, 4);
        b.lump([Math.sin(th) * 0.305 * hs, 0.5 * hs, Math.cos(th) * 0.29 * hs + 0.03 * hs], [0.035 * hs, 0.035 * hs, 0.035 * hs], i % 2 ? [0.7, 0.05, 0.08] : [0.1, 0.25, 0.7], 0, null, 6);
      }
    }
    if (D.iceHead) decoIce(b, [0, 0.3 * hs, 0.05 * hs], [0.26 * hs, 0.28 * hs, 0.3 * hs], 7, hs * 0.9, -1.6, 1.6);
    if (D.kelp) decoKelp(b, [0, 0.42 * hs, 0.08 * hs], 9, 0.55 * hs, 0.25 * hs);
    if (D.barnacles) decoBarnacles(b, [0, 0.24 * hs, 0.03 * hs], [0.3 * hs, 0.31 * hs, 0.33 * hs], 7);
    return b.geo();
  }

  function buildJaw(P, C, D, seed) {
    const b = new Builder(seed + 41);
    const hs = P.hs, tk = P.tusk;
    b.lump([0, -0.07 * hs, -0.17 * hs], [0.25 * hs, 0.11 * hs, 0.22 * hs], C.skin, 0.12);
    b.lump([0, -0.1 * hs, -0.33 * hs], [0.12 * hs, 0.08 * hs, 0.07 * hs], mulC(C.skin, 0.92), 0.12);
    b.spike([0.13 * hs, -0.02 * hs, -0.3 * hs], [0.25, 1, -0.2], 0.04 * hs * Math.sqrt(tk), 0.17 * hs * tk, BONE, 5);
    b.spike([-0.13 * hs, -0.02 * hs, -0.3 * hs], [-0.25, 1, -0.2], 0.04 * hs * Math.sqrt(tk), 0.17 * hs * tk, BONE, 5);
    b.spike([0.05 * hs, -0.03 * hs, -0.36 * hs], [0, 1, 0], 0.02 * hs, 0.06 * hs, BONE, 4);
    b.spike([-0.06 * hs, -0.03 * hs, -0.35 * hs], [0, 1, 0], 0.02 * hs, 0.05 * hs, BONE, 4);
    if (D.beard) {
      for (let i = 0; i < 16; i++) {
        const x = b.r(-0.22, 0.22) * hs;
        b.spike([x, -0.12 * hs, b.r(-0.36, -0.1) * hs], [x * 0.6, -1, b.r(-0.3, 0.1)], b.r(0.04, 0.07) * hs, b.r(0.3, 0.75) * hs * (1 - Math.abs(x) * 1.5), i % 3 ? [0.93, 0.97, 1.0] : ICE, 5);
      }
    }
    if (D.kelp) decoKelp(b, [0, -0.14 * hs, -0.25 * hs], 6, 0.45 * hs, 0.15 * hs);
    if (D.mane) for (let i = 0; i < 6; i++) b.spike([b.r(-0.2, 0.2) * hs, -0.14 * hs, b.r(-0.3, -0.1) * hs], [0, -1, -0.2], 0.05 * hs, 0.25 * hs, C.hair, 5);
    return b.geo();
  }

  function buildEyes(P) {
    const b = new Builder(5);
    const hs = P.hs;
    b.lump([0.11 * hs, 0.235 * hs, -0.295 * hs], [0.052 * hs, 0.045 * hs, 0.04 * hs], [1, 1, 1], 0, null, 7);
    b.lump([-0.11 * hs, 0.235 * hs, -0.295 * hs], [0.052 * hs, 0.045 * hs, 0.04 * hs], [1, 1, 1], 0, null, 7);
    return b.geo();
  }

  function buildUpperArm(P, C, D, seed, side) {
    const b = new Builder(seed + 53 + side);
    const L = P.arm, aw = P.armW;
    b.lump([0, -0.3 * L, 0], [0.17 * aw, 0.36 * L, 0.17 * aw], C.skin, 0.13);
    b.lump([0, -0.22 * L, -0.07 * aw], [0.13 * aw, 0.18 * L, 0.11 * aw], C.skin, 0.12);
    if (D.pauldron) {
      b.lump([side * 0.03, 0.05, 0], [0.3 * aw, 0.15 * aw, 0.3 * aw], D.pauldronCol || C.rock, 0.18, null, 8);
      for (let i = 0; i < 3; i++) b.spike([side * (0.06 + i * 0.07) * aw, 0.12 * aw, (i - 1) * 0.12 * aw], [side * 0.5, 1, 0], 0.05 * aw, 0.18 * aw, D.spikeCol || BONE, 5);
    }
    if (D.kelp) decoKelp(b, [0, -0.05, 0], 5, 0.6, 0.12);
    if (D.barnacles) decoBarnacles(b, [0, -0.3 * L, 0], [0.17 * aw, 0.36 * L, 0.17 * aw], 6);
    if (D.iceArm) decoIce(b, [0, -0.1, 0], [0.17 * aw, 0.2, 0.17 * aw], 3, 0.8, side > 0 ? 0.5 : -2.6, side > 0 ? 2.6 : -0.5);
    if (D.armband) b.cyl([0, -0.42 * L, 0], 0.18 * aw, 0.18 * aw, 0.08, D.armband, null, 8);
    return b.geo();
  }

  function buildForearm(P, C, D, seed, side) {
    const b = new Builder(seed + 67 + side);
    const L = P.arm, aw = P.armW, hd = P.hand;
    b.lump([0, -0.28 * L, -0.01], [0.155 * aw, 0.34 * L, 0.155 * aw], C.skin, 0.12);
    b.lump([0, -0.12 * L, 0], [0.17 * aw, 0.14 * L, 0.16 * aw], C.skin, 0.12);
    const hy = -(0.62 * L + 0.08 * hd);
    const hcol = mulC(C.skin, 0.88);
    b.lump([0, hy, -0.02], [0.21 * hd, 0.17 * hd, 0.12 * hd], hcol, 0.12);
    const clawL = D.claws ? 2.2 : 1;
    for (let i = 0; i < 4; i++) {
      const fx = (-0.13 + i * 0.087) * hd;
      const fy = hy - 0.13 * hd;
      b.spike([fx, fy, -0.02], [fx * 0.5, -1, -0.15], 0.05 * hd, 0.22 * hd, hcol, 5);
      b.spike([fx * 1.05, fy - 0.2 * hd, -0.04], [fx * 0.4, -1, -0.3], 0.022 * hd * Math.sqrt(clawL), 0.07 * hd * clawL, D.claws ? BONE : CLAW, 4);
    }
    b.spike([-side * 0.18 * hd, hy - 0.02, -0.06], [-side * 0.6, -0.6, -0.6], 0.055 * hd, 0.2 * hd, hcol, 5); // thumb
    if (D.barnacles) decoBarnacles(b, [0, -0.28 * L, 0], [0.155 * aw, 0.34 * L, 0.155 * aw], 4);
    if (D.iceArm) decoIce(b, [0, -0.25 * L, 0.02], [0.15 * aw, 0.25, 0.15 * aw], 3, 0.7, 2.0, 4.2);
    if (D.bracer) b.cyl([0, -0.42 * L, 0], 0.175 * aw, 0.165 * aw, 0.2 * L, D.bracer, null, 8);
    return b.geo();
  }

  function buildThigh(P, C, D, seed) {
    const b = new Builder(seed + 79);
    const lg = P.leg, lw = P.legW;
    b.lump([0, -0.22 * lg, 0], [0.2 * lw, 0.3 * lg, 0.21 * lw], C.skin, 0.12);
    if (D.kelp) decoKelp(b, [0, -0.15, 0], 3, 0.4, 0.1);
    return b.geo();
  }
  function buildShin(P, C, D, seed) {
    const b = new Builder(seed + 83);

    b.lump([0, -0.2 * lg, 0.02], [0.15 * lw, 0.25 * lg, 0.16 * lw], C.skin, 0.12);
    b.lump([0, -0.45 * lg + 0.08, -0.1 * lw], [0.17 * lw, 0.09, 0.26 * lw], mulC(C.skin, 0.85), 0.12);
    for (let i = -1; i <= 1; i++) b.spike([i * 0.08 * lw, -0.45 * lg + 0.05, -0.3 * lw], [i * 0.2, -0.2, -1], 0.045 * lw, 0.12 * lw, mulC(C.skin, 0.8), 4);
    if (D.barnacles) decoBarnacles(b, [0, -0.2 * lg, 0.02], [0.15 * lw, 0.25 * lg, 0.16 * lw], 4);

  function buildTail(P, C, D, seed) {
    const b = new Builder(seed + 97);
    const tl = P.tail;
    b.cyl([0, -0.28 * tl, 0], 0.035, 0.06, 0.56 * tl, C.skin, null, 6, 0.1);
    b.lump([0, -0.62 * tl, 0], [0.11, 0.16, 0.11], C.hair, 0.25, null, 7);
    for (let i = 0; i < 4; i++) b.spike([0, -0.64 * tl, 0], [b.r(-0.5, 0.5), -1, b.r(-0.5, 0.5)], 0.05, 0.18, C.hair, 4);
    return b.geo();
  }

  // emissive overlay (runes, molten cracks, glowing ice, bioluminescence) in torso space
  function buildGlow(P, C, D, seed) {
    const b = new Builder(seed + 101);
    const ch = P.chest, be = P.belly;
    const zc = -(0.44 * ch) - 0.02, zb = -(0.5 * be) - 0.12 * (be - 1) - 0.02;
    const nr = D.runes || 0;
    for (let i = 0; i < nr; i++) {
      const front = i % 2 === 0;
      if (front) addRune(b, b.r(-0.22, 0.22) * ch, b.r(0.62, 0.82), zc + 0.04, 0.22, 0.12);
      else addRune(b, b.r(-0.25, 0.25) * ch, b.r(0.75, 1.05), 0.28 + 0.34 * P.hump + 0.02, 0.24, 0.16);
    }
    if (D.cracks) {
      for (let i = 0; i < 4; i++) addCrack(b, b.r(-0.3, 0.3) * ch, b.r(0.75, 0.95), zc + 0.03, 5, 0.12);
      for (let i = 0; i < 3; i++) addCrack(b, b.r(-0.3, 0.3) * be, b.r(0.4, 0.6), zb + 0.05, 4, 0.14);
      for (let i = 0; i < 3; i++) addCrack(b, b.r(-0.3, 0.3) * ch, b.r(0.95, 1.15), 0.3 + 0.34 * P.hump, 5, 0.16);
    }
    if (D.glowSpots) {
      for (let i = 0; i < 18; i++) {
        const e = onEll([0, 0.6, 0.0], [0.58 * ch, 0.6, 0.5 * be], b.r(-Math.PI, Math.PI), b.r(-0.5, 0.9));
        b.lump(e.p, [0.035, 0.035, 0.035], [1, 1, 1], 0, null, 5);
      }
    }
    if (D.iceGlow) {
      const hc = [0, 0.86, 0.28], hr = [0.46 * ch, 0.4 * P.hump, 0.34 * P.hump];
      for (let i = 0; i < 9; i++) {
        const e = onEll(hc, hr, b.r(-1.2, 1.2), b.r(0.0, 1.1));
        b.spike(e.p, [e.n[0] * 0.5, e.n[1] + 0.6, e.n[2] + 0.5], b.r(0.08, 0.14), b.r(0.5, 0.95), ICE, 6);
      }
    }
    if (!b.parts.length) return null;
    return b.geo();
  }

  // weapons are authored hanging along -Y from the grip at the origin
  function buildWeapon(kind, C, seed) {
    const b = new Builder(seed || 7);
    if (kind === 'club') {
      b.cyl([0, -0.18, 0], 0.045, 0.06, 0.5, WOOD, null, 6, 0.05);
      b.cyl([0, -0.68, 0], 0.09, 0.16, 0.65, WOOD, null, 7, 0.14);
      for (let i = 0; i < 4; i++) b.spike([b.r(-0.1, 0.1), -0.55 - i * 0.12, b.r(-0.1, 0.1)], [b.r(-1, 1), -0.2, b.r(-1, 1)], 0.04, 0.1, DARKWOOD, 4);
    } else if (kind === 'maul') {
      b.cyl([0, -0.42, 0], 0.05, 0.055, 1.05, WOOD, null, 6, 0.04);
      b.lump([0, -1.0, 0], [0.3, 0.26, 0.26], C.rock, 0.18);
      b.cyl([0, -0.88, 0], 0.2, 0.22, 0.07, C.cloth, null, 8);

    } else if (kind === 'trunk') {
      b.cyl([0, -0.75, 0], 0.08, 0.2, 1.7, [0.3, 0.23, 0.16], null, 7, 0.12);
      for (let i = 0; i < 6; i++) { const th = i / 6 * TAU; b.spike([Math.sin(th) * 0.15, -1.55, Math.cos(th) * 0.15], [Math.sin(th), -0.6, Math.cos(th)], 0.06, b.r(0.3, 0.55), [0.26, 0.2, 0.14], 4); }
      b.spike([0.07, -0.6, 0], [1, 0.4, 0.2], 0.04, 0.3, [0.3, 0.23, 0.16], 4);
      b.lump([0, -1.3, -0.15], [0.12, 0.1, 0.05], [0.25, 0.4, 0.15], 0.3, null, 6);
    } else if (kind === 'axe') {
      b.cyl([0, -0.5, 0], 0.045, 0.05, 1.2, DARKWOOD, null, 6);
      b.lump([0, -1.0, -0.22], [0.06, 0.26, 0.24], C.rock, 0.12, null, 7);
      b.cyl([0, -1.0, 0], 0.07, 0.07, 0.18, C.cloth, null, 6);
    } else if (kind === 'bone') {
      b.cyl([0, -0.5, 0], 0.06, 0.08, 1.0, BONE, null, 6, 0.06);
      b.lump([0.05, -1.05, 0], [0.13, 0.13, 0.12], BONE, 0.1, null, 7);
      b.lump([-0.07, -1.0, 0], [0.12, 0.12, 0.11], BONE, 0.1, null, 7);
      b.lump([0, 0.02, 0], [0.1, 0.08, 0.1], BONE, 0.1, null, 6);
    } else if (kind === 'anchor') {
      b.cyl([0, -0.8, 0], 0.06, 0.07, 1.75, IRON, null, 7, 0.03);

      b.cyl([0, 0.12, 0], 0.13, 0.13, 0.05, IRON, [Math.PI / 2, 0, 0], 8);
      b.box([0.3, -1.52, 0], 0.66, 0.1, 0.1, IRON, [0, 0, 0.55]);
      b.box([-0.3, -1.52, 0], 0.66, 0.1, 0.1, IRON, [0, 0, -0.55]);
      b.spike([0.55, -1.36, 0], [0.5, 1, 0], 0.13, 0.28, IRON, 4);
      b.spike([-0.55, -1.36, 0], [-0.5, 1, 0], 0.13, 0.28, IRON, 4);
      b.lump([0, -1.68, 0], [0.12, 0.1, 0.12], IRON, 0.1, null, 6);

    } else if (kind === 'iceclub') {
      b.cyl([0, -0.4, 0], 0.07, 0.08, 1.0, DARKWOOD, null, 6);
      b.spike([0, -0.85, 0], [0, -1, 0], 0.2, 1.1, ICE, 6);
      for (let i = 0; i < 9; i++) {
        const th = i / 9 * TAU;
        b.spike([Math.sin(th) * 0.08, -0.95 - b.r(0, 0.4), Math.cos(th) * 0.08], [Math.sin(th), b.r(-0.6, 0.3), Math.cos(th)], b.r(0.07, 0.12), b.r(0.35, 0.6), i % 2 ? ICE : [0.88, 0.96, 1.0], 5);
      }

      b.cyl([0, -0.9, 0], 0.08, 0.09, 2.05, DARKWOOD, null, 7);

      b.cyl([0, -1.4, 0], 0.1, 0.1, 0.1, GOLD, null, 8);

  function buildRock(C) {
    const b = new Builder(31);
    b.lump([0, 0, 0], [1, 0.85, 0.95], C.rock, 0.22, null, 8);

  // ------------------------------------------------------------------ actor construction
  function bindHeight(P) {

  function makeRig(a, kit, weaponKind, throwSide) {
    const R_ = TG.R, P = kit.P, M = a.mats, K = kit.parts;
    const swaps = a.swaps;
    function nd(part, mat, pos, rot, shadow) {
      const n = R_.node({ mesh: part.m, mat: mat, pos: pos, rot: rot || [0, 0, 0], scale: 1, castShadow: shadow !== false });
      if (part.s) swaps.push([n, part.s]);

    }
    const n = {};
    n.root = R_.node({ pos: [a.pos[0], a.pos[1], a.pos[2]], rot: [0, a.yaw, 0], scale: a.scale });
    n.body = n.root.add(nd(K.body, M.body, [0, P.hipH, 0]));
    n.torso = n.body.add(nd(K.torso, M.body, [0, 0.12, 0.04], [P.hunch, 0, 0]));
    n.head = n.torso.add(nd(K.head, M.body, [0, P.neckY, -0.22], [-P.hunch * 0.8, 0, 0]));
    n.jaw = n.head.add(nd(K.jaw, M.body, [0, 0.1 * P.hs, -0.04 * P.hs]));
    n.eyes = n.head.add(nd({ m: kit.eyes }, M.eye, [0, 0, 0], null, false));
    if (kit.glow) n.glow = n.torso.add(nd({ m: kit.glow }, M.glow, [0, 0, 0], null, false));
    n.uArmR = n.torso.add(nd(K.uArmR, M.body, [P.shX, 0.86, 0.02]));
    n.fArmR = n.uArmR.add(nd(K.fArmR, M.body, [0, -0.62 * P.arm, 0]));
    n.uArmL = n.torso.add(nd(K.uArmL, M.body, [-P.shX, 0.86, 0.02]));
    n.fArmL = n.uArmL.add(nd(K.fArmL, M.body, [0, -0.62 * P.arm, 0]));
    n.thighR = n.body.add(nd(K.thigh, M.body, [0.27 * P.legW, -0.02, 0]));
    n.shinR = n.thighR.add(nd(K.shin, M.body, [0, -0.45 * P.leg, 0]));
    n.thighL = n.body.add(nd(K.thigh, M.body, [-0.27 * P.legW, -0.02, 0]));
    n.shinL = n.thighL.add(nd(K.shin, M.body, [0, -0.45 * P.leg, 0]));
    n.tail = n.body.add(nd(K.tail, M.body, [0, 0.05, 0.3 * Math.sqrt(P.belly)], [-1.15, 0, 0]));
    const wk = weaponKit(weaponKind);
    if (wk) n.weapon = n.fArmR.add(nd(wk, M.weap, [0, -P.gripY, -0.04], [0.45, 0, 0]));
    if (throwSide) {
      const fa = throwSide > 0 ? n.fArmR : n.fArmL;

      n.rock.visible = false;
    }
    a.n = n;
    return n;
  }

  // ------------------------------------------------------------------ regular troll AI

  function aiTroll(a, dt, pl) {

  // ------------------------------------------------------------------ rocks (thrower + boss boulders)
  let rockMatObj = null;
  function rockMat() { if (!rockMatObj) rockMatObj = TG.R.material({ color: [1, 1, 1], rough: 0.9, metal: 0, detail: 0.6, detailScale: 2 }); return rockMatObj; }
  function throwRock(a, pl, big, idx) {
    if (!pl) return;
    const s = a.scale, side = a.throwSide || 1;
    const fx = -Math.sin(a.yaw), fz = -Math.cos(a.yaw), rx = -fz, rz = fx;
    const from = [a.pos[0] + fx * 0.4 * s + rx * side * 0.45 * s, a.pos[1] + 2.2 * s, a.pos[2] + fz * 0.4 * s + rz * side * 0.45 * s];
    const dist = U.dist2D(from[0], from[2], pl.pos[0], pl.pos[2]);
    const T = big ? clamp(0.9 + dist / 22, 1.0, 2.5) : clamp(0.55 + dist / 22, 0.7, 2.3);
    let tx = pl.pos[0], tz = pl.pos[2];

    const inacc = big ? (idx ? 2 + Math.random() * 4 : 0.8) : 0.5 + dist * 0.035;

  }
  function fireRock(from, vel, sc, dmg, splash, a, big) {

        p: [0, 0, 0], v: [0, 0, 0], from: [0, 0, 0], spin: [0, 0, 0] };
    }
    p.p[0] = from[0]; p.p[1] = from[1]; p.p[2] = from[2];
    p.v[0] = vel[0]; p.v[1] = vel[1]; p.v[2] = vel[2];
    p.from[0] = a.pos[0]; p.from[1] = a.pos[1] + a.height * 0.6; p.from[2] = a.pos[2];
    p.spin[0] = (Math.random() - 0.5) * 10; p.spin[1] = (Math.random() - 0.5) * 6; p.spin[2] = (Math.random() - 0.5) * 10;
    p.r = sc * 1.1; p.dmg = dmg; p.splash = splash; p.big = !!big; p.life = 6; p.trailT = 0;
    p.node.scale = sc;
    p.node.pos[0] = from[0]; p.node.pos[1] = from[1]; p.node.pos[2] = from[2];

  function rockImpact(p, direct) {

      let d;
      if (direct) d = 0;
      else {
        const cy = clamp(p.p[1], pl.pos[1] + 0.2, pl.pos[1] + 1.6);
        const dx = p.p[0] - pl.pos[0], dy = p.p[1] - cy, dz = p.p[2] - pl.pos[2];
        d = Math.sqrt(dx * dx + dy * dy + dz * dz);

      life: [0.5, 1.1], size: [0.1 * Math.sqrt(s), 0.05], color: [rk[0], rk[1], rk[2], 1], colorEnd: [rk[0] * 0.7, rk[1] * 0.7, rk[2] * 0.7, 1], gravity: 14, tex: 'shard', spin: 8 });

      life: [0.7, 1.5], size: [0.5 * Math.sqrt(s), 1.5 * Math.sqrt(s)], color: [0.48, 0.44, 0.4, 0.55], colorEnd: [0.42, 0.4, 0.38, 0], drag: 1.8, tex: 'smoke' });

  function updateProjectiles(dt) {

  // ------------------------------------------------------------------ boss AI
  const BT = { melee: [0.85, 0.22, 0.75], slam: [1.15, 0.25, 1.0], boulder: [0.85, 0, 0.8], charge: [1.1, 0, 1.3], summon: [0.7, 1.1, 0.6], roar: [0.5, 1.2, 0.5] };

  function attackWeight(a, atk, dist) {

      case 'melee': return dist <= a.reach + 0.3 ? 6 : 0;
      case 'slam': return dist < (a.isBig ? 22 : 16) ? (dist < a.reach * 1.6 ? 4 : 2) : 0;
      case 'boulder': return (a.los && dist > 9) ? 3 + (a.phase - 1) : 0;
      case 'charge': return (a.los && dist > 11 && dist < 42) ? 3 : 0;
      case 'summon': return (Actors.aliveCount() < 14 && (!a.isBig || a.phase >= 2 || a.t > 25)) ? 2.5 : 0;

  function chooseAttack(a, dist) {

    if (total <= 0) return null;

    return null;

    else if (atk === 'charge') { snd('boss_roar', a.pos, 1, 0.9); fxRing([a.pos[0], a.pos[1] + 0.05, a.pos[2]], a.radius * 2.6, [2.2, 0.5, 0.1], a.wind); }
  }

        color: [0.5, 0.46, 0.42, 0.4], colorEnd: [0.45, 0.43, 0.4, 0], drag: 2.5, tex: 'smoke' });

      if (a.light.color) { a.light.color[0] = 3 * fl; a.light.color[1] = 1.3 * fl; a.light.color[2] = 0.35 * fl; }
      a.light.radius = (5 + 2 * a.scale) * (0.85 + 0.15 * fl);
    }
    if (a.burnT <= 0) extinguish(a);
  }

  function kill(a, info) {
    if (!a.alive) return;
    a.alive = false; a.dying = true; a.hp = 0; a.dieT = 0; a.act = null; a.invuln = false; a.fxT = 0;
    a.state = 'dying';
    a.vel[0] = 0; a.vel[2] = 0; a.glitchX = 0;
    extinguish(a);
    if (a.n && a.n.rock) a.n.rock.visible = false;
    snd(a.isBoss ? 'boss_death' : 'troll_death', a.bc, a.isBoss ? 1.4 : 0.9, growlPitch(a));
    const s = a.scale;
    emit({ pos: [a.bc[0], a.bc[1], a.bc[2]], count: Math.round(6 + 4 * s), spread: a.hR * 1.2, vel: [0, 0.6, 0], velSpread: 0.8,
      life: [0.6, 1.2], size: [0.3 * s, 0.9 * s], color: [0.62, 0.6, 0.58, 0.45], colorEnd: [0.55, 0.54, 0.52, 0], drag: 2, tex: 'smoke' });
    if (a.isBoss) { shake(0.5); fxFlash(a.bc, mulC(a.mats.glowBase, 0.7), 12 + 2 * s, 0.4); }
    if (!a.reported) {
      a.reported = true;
      try { if (TG.Game && TG.Game.onEnemyKilled) TG.Game.onEnemyKilled(a, info || { type: 'bullet' }); } catch (e) { logErr(e); }
    }
  }

  function setC(arr, r, g, b) { if (arr) { arr[0] = r; arr[1] = g; arr[2] = b; } }

  function updateDying(a, dt) {
    a.dieT += dt;
    const t = a.dieT, M = a.mats, s = a.scale;
    if (a.airY > 0) { a.vy -= 20 * dt; a.airY = Math.max(0, a.airY + a.vy * dt); a.pos[1] = worldH(a.pos[0], a.pos[2]) + a.airY; }
    const T1 = 0.22, T2 = 0.55;
    if (!a.swapped && t >= T1) {
      a.swapped = true;
      for (let i = 0; i < a.swaps.length; i++) a.swaps[i][0].mesh = a.swaps[i][1];
      M.body.rough = 0.95; M.body.detail = 1; M.body.wet = 0; M.weap.metal = 0; M.weap.rough = 0.95;
      const rk = a.kit.C.rock;
      setC(M.eye.color, rk[0] * 0.6, rk[1] * 0.6, rk[2] * 0.6);
      setC(M.glow.color, rk[0], rk[1], rk[2]);
    }
    const c = t < T1 ? lerp(1, 0.45, t / T1) : lerp(0.45, 1, clamp((t - T1) / (T2 - T1), 0, 1));
    setC(M.body.color, c, c, c);
    setC(M.weap.color, c, c, c);
    const pe = t < T1 ? 0.35 * (1 - t / T1) : 0;
    setC(M.body.emissive, pe, pe, pe);
    setC(M.weap.emissive, 0, 0, 0);
    const ke = Math.max(0, 1 - t / 0.4), eb = M.eyeBase, gb = M.glowBase;
    setC(M.eye.emissive, eb[0] * ke, eb[1] * ke, eb[2] * ke);
    const kg = Math.max(0, 1 - t / 0.6);
    setC(M.glow.emissive, gb[0] * kg, gb[1] * kg, gb[2] * kg);
    const crumbleAt = a.isBig ? 2.6 : (a.isBoss ? 2.0 : 1.45);
    if (t > 0.55 && t < crumbleAt) {
      const k = (t - 0.55) / (crumbleAt - 0.55);
      a.glitchX = (Math.random() - 0.5) * 0.025 * s * k;
      if ((a.fxT -= dt) <= 0) {
        a.fxT = 0.1 - 0.05 * k;
        const u = Math.random(), rk = a.kit.C.rock;
        emit({ pos: [lerp(a.hA[0], a.hH[0], u), lerp(a.hA[1], a.hH[1], u), lerp(a.hA[2], a.hH[2], u)], count: 2 + Math.round(2 * k * Math.sqrt(s)), spread: a.hR,
          vel: [0, 0.3, 0], velSpread: 0.8, life: [0.5, 0.9], size: [0.05 * Math.sqrt(s), 0.03], color: [rk[0], rk[1], rk[2], 1],
          colorEnd: [rk[0] * 0.7, rk[1] * 0.7, rk[2] * 0.7, 1], gravity: 10, tex: 'shard', spin: 5 });
      }
    }
    placeRoot(a);
    if (t >= crumbleAt) crumble(a);
  }

  function crumble(a) {
    const s = a.scale, rk = a.kit.C.rock;
    const n = Math.min(160, Math.round(30 + 25 * s));
    const pts = [a.hA, a.bc, a.hH];
    for (let i = 0; i < 3; i++) {
      const p = pts[i];
      emit({ pos: [p[0], p[1], p[2]], count: Math.round(n / 3), spread: a.hR * 1.1, vel: [0, 2 + 0.5 * s, 0], velSpread: 2.5 + 0.8 * s,
        life: [0.7, 1.6], size: [0.12 * Math.sqrt(s) * 1.2, 0.06 * Math.sqrt(s)], color: [rk[0] * 1.05, rk[1] * 1.05, rk[2] * 1.05, 1],
        colorEnd: [rk[0] * 0.6, rk[1] * 0.6, rk[2] * 0.6, 1], gravity: 14, drag: 0.3, tex: 'shard', spin: 9 });
    }
    emit({ pos: [a.bc[0], a.bc[1] - a.height * 0.2, a.bc[2]], count: Math.round(10 + 6 * s), spread: a.radius * 1.2, vel: [0, 0.8, 0], velSpread: 1.5 + 0.4 * s,
      life: [1.0, 2.2], size: [0.5 * s, 1.6 * s], color: [0.55, 0.53, 0.5, 0.55], colorEnd: [0.5, 0.49, 0.47, 0], drag: 1.6, tex: 'smoke' });
    snd('troll_petrify', a.bc, a.isBoss ? 1.5 : 0.9, a.isBoss ? 0.7 : clamp(1.1 / Math.sqrt(s), 0.7, 1.3));
    if (a.isBoss) {
      fxFlash(a.bc, [2.2, 1.9, 1.6], 18 + 3 * s, 0.6);
      fxRing([a.pos[0], a.pos[1] + 0.1, a.pos[2]], 6 + 2.5 * s, [1.2, 1.1, 1.0], 0.9);
      snd('rock_impact', a.pos, 1.5, 0.55);
      const d = distToPlayer(a);
      shake(0.7 * clamp(15 / Math.max(d, 15), 0, 1));
      emit({ pos: [a.bc[0], a.bc[1], a.bc[2]], count: Math.round(20 + 5 * s), spread: a.hR, vel: [0, 7, 0], velSpread: 6, life: [1.0, 2.0],
        size: [0.35 * Math.sqrt(s), 0.2 * Math.sqrt(s)], color: [rk[0], rk[1], rk[2], 1], colorEnd: [rk[0] * 0.6, rk[1] * 0.6, rk[2] * 0.6, 1], gravity: 16, tex: 'shard', spin: 6 });
    }
    removeActorNodes(a);
    a.removed = true;
  }
  function removeActorNodes(a) { if (a.n && a.n.root) sceneRemove(a.n.root); }

  // ------------------------------------------------------------------ per-frame material effects (hit flash, burn, freeze glitch)
  function updateMats(a, dt, frozen) {
    const M = a.mats;
    a.flash = Math.max(0, a.flash - dt * 6);
    const f = a.flash * a.flash;
    let er = 0.9 * f, eg = 0.78 * f, eb = 0.65 * f;
    if (a.burnT > 0) {
      const fl = 0.55 + 0.45 * Math.sin(clock * 23 + a.seed) * Math.sin(clock * 7.3 + a.seed);
      er += 0.8 * fl; eg += 0.28 * fl; eb += 0.03 * fl;
    }
    let fr = 0, fg = 0, fb = 0;
    if (frozen) {
      let pz = 0.55 + 0.45 * Math.sin(clock * 17 + a.seed * 3);
      if (Math.random() < 0.06) pz += 0.9;
      fr = 0.03 * pz; fg = 0.32 * pz; fb = 1.05 * pz;
      if ((a.glitchT -= dt) <= 0) {
        a.glitchT = 0.05 + Math.random() * 0.12;
        a.glitchX = Math.random() < 0.35 ? (Math.random() - 0.5) * 0.12 * a.scale : 0;
      }
      if ((a.fxT2 = (a.fxT2 || 0) - dt) <= 0) {
        a.fxT2 = 0.2 + Math.random() * 0.3;
        const u = Math.random();
        emit({ pos: [lerp(a.hA[0], a.hH[0], u), lerp(a.hA[1], a.hH[1], u), lerp(a.hA[2], a.hH[2], u)], count: 3, spread: a.hR * 1.1, vel: [0, 0.2, 0], velSpread: 0.3,
          life: [0.15, 0.35], size: [0.08 * Math.sqrt(a.scale), 0.02], color: [0.3, 1.2, 3.0, 1], colorEnd: [0.1, 0.4, 1.5, 0], additive: true, tex: 'shard' });
      }
    } else {
      a.glitchX = 0;
      if (timeScale < 0.95) { fr = 0.01; fg = 0.05; fb = 0.16; }
    }
    setC(M.body.emissive, er + fr, eg + fg, eb + fb);
    const wb = M.weapBase;
    setC(M.weap.emissive, wb[0] + er * 0.5 + fr, wb[1] + eg * 0.5 + fg, wb[2] + eb * 0.5 + fb);
    const gb = M.glowBase, gk = frozen ? 0.4 : 1;
    setC(M.glow.emissive, gb[0] * gk + fr * 2, gb[1] * gk + fg * 2, gb[2] * gk + fb * 2);
    const ek = frozen ? (Math.random() < 0.12 ? 0.15 : 1) : 1, ebb = M.eyeBase;
    setC(M.eye.emissive, ebb[0] * ek, ebb[1] * ek, ebb[2] * ek);
  }

  function growl(a, dt, pl) {
    a.growlT -= dt;
    if (a.growlT > 0) return;
    a.growlT = 5 + Math.random() * 7;
    if (clock - lastGrowl < 0.7) return;
    if (pl && U.dist2D(a.pos[0], a.pos[2], pl.pos[0], pl.pos[2]) > 45) return;
    lastGrowl = clock;
    snd('troll_growl', a.hH, a.isBoss ? 1.2 : 0.7, growlPitch(a));
  }

  // soft separation between trolls (steering term + partial positional push, weighted by mass)
  function separation() {
    const n = list.length;
    for (let i = 0; i < n; i++) { list[i].sepx = 0; list[i].sepz = 0; }
    for (let i = 0; i < n; i++) {
      const a = list[i];
      if (!a.alive || a.state === 'spawn') continue;
      for (let j = i + 1; j < n; j++) {
        const b = list[j];
        if (!b.alive || b.state === 'spawn') continue;
        let dx = b.pos[0] - a.pos[0], dz = b.pos[2] - a.pos[2];
        const minD = (a.radius + b.radius) * 1.05, d2 = dx * dx + dz * dz;
        if (d2 >= minD * minD) continue;
        let d = Math.sqrt(d2);
        if (d < 1e-3) { dx = Math.random() - 0.5; dz = Math.random() - 0.5; d = Math.sqrt(dx * dx + dz * dz) || 1; }
        const nx = dx / d, nz = dz / d, ov = minD - Math.min(d, minD);
        a.sepx -= nx * ov; a.sepz -= nz * ov; b.sepx += nx * ov; b.sepz += nz * ov;
        const wa = b.mass / (a.mass + b.mass), wb = 1 - wa, push = ov * 0.5;
        if (a.state !== 'bcharge') { a.pos[0] -= nx * push * wa; a.pos[2] -= nz * push * wa; }
        if (b.state !== 'bcharge') { b.pos[0] += nx * push * wb; b.pos[2] += nz * push * wb; }
      }
    }
  }

  // ------------------------------------------------------------------ ray tests
  const RD = [0, 0, 0];
  let LAST_HEAD = false;
  function normDir(dir) {
    if (!dir || dir.length < 3) return false;
    const l = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1] + dir[2] * dir[2]);
    if (!(l > 1e-9)) return false;
    RD[0] = dir[0] / l; RD[1] = dir[1] / l; RD[2] = dir[2] / l;
    return true;
  }
  function raySphere(o, d, c, r) {
    const ox = o[0] - c[0], oy = o[1] - c[1], oz = o[2] - c[2];
    const b = ox * d[0] + oy * d[1] + oz * d[2];
    const cc = ox * ox + oy * oy + oz * oz - r * r;
    if (cc <= 0) return 0;
    const h = b * b - cc;
    if (h < 0) return -1;
    const t = -b - Math.sqrt(h);
    return t >= 0 ? t : -1;
  }
  function rayCapsule(o, d, pa, pb, r) {
    const bx = pb[0] - pa[0], by = pb[1] - pa[1], bz = pb[2] - pa[2];
    const ox = o[0] - pa[0], oy = o[1] - pa[1], oz = o[2] - pa[2];
    const baba = bx * bx + by * by + bz * bz;
    if (baba < 1e-8) return raySphere(o, d, pa, r);
    const bard = bx * d[0] + by * d[1] + bz * d[2];
    const baoa = bx * ox + by * oy + bz * oz;
    const rdoa = d[0] * ox + d[1] * oy + d[2] * oz;
    const oaoa = ox * ox + oy * oy + oz * oz;
    // origin inside?
    const tt = clamp(baoa / baba, 0, 1), qx = ox - bx * tt, qy = oy - by * tt, qz = oz - bz * tt;
    if (qx * qx + qy * qy + qz * qz <= r * r) return 0;
    const a = baba - bard * bard;
    if (a < 1e-8) {
      const t1 = raySphere(o, d, pa, r), t2 = raySphere(o, d, pb, r);
      if (t1 < 0) return t2; if (t2 < 0) return t1; return Math.min(t1, t2);
    }
    const b = baba * rdoa - baoa * bard;
    const c = baba * oaoa - baoa * baoa - r * r * baba;
    const h = b * b - a * c;
    if (h < 0) return -1;
    const t = (-b - Math.sqrt(h)) / a;
    const y = baoa + t * bard;
    if (y > 0 && y < baba) return t >= 0 ? t : -1;
    const cx = y <= 0 ? ox : o[0] - pb[0], cy = y <= 0 ? oy : o[1] - pb[1], cz = y <= 0 ? oz : o[2] - pb[2];
    const b2 = d[0] * cx + d[1] * cy + d[2] * cz, c2 = cx * cx + cy * cy + cz * cz - r * r, h2 = b2 * b2 - c2;
    if (h2 > 0) { const t2 = -b2 - Math.sqrt(h2); return t2 >= 0 ? t2 : -1; }
    return -1;
  }
  function rayActor(a, o, maxDist) {
    LAST_HEAD = false;
    if (!a.alive || a.removed) return -1;
    const cx = a.bc[0] - o[0], cy = a.bc[1] - o[1], cz = a.bc[2] - o[2];
    const tca = cx * RD[0] + cy * RD[1] + cz * RD[2];
    const d2 = cx * cx + cy * cy + cz * cz - tca * tca, br = a.br;
    if (d2 > br * br || tca < -br || tca - br > maxDist) return -1;
    const th = raySphere(o, RD, a.hH, a.hHR), tb = rayCapsule(o, RD, a.hA, a.hB, a.hR);
    let t = -1;
    if (th >= 0 && (tb < 0 || th <= tb)) { t = th; LAST_HEAD = true; } else if (tb >= 0) t = tb;
    if (t < 0 || t > maxDist) { LAST_HEAD = false; return -1; }
    return t;
  }

  // ------------------------------------------------------------------ public API
  Actors.reset = function () {
    try {
      for (let i = 0; i < list.length; i++) { const a = list[i]; extinguish(a); removeActorNodes(a); a.removed = true; a.alive = false; }
      list.length = 0;
      for (let i = projectiles.length - 1; i >= 0; i--) releaseProj(i);
      rings.length = 0;
      timeScale = 1; timeScaleT = 0; vulnMult = 1; vulnT = 0; burnLights = 0;
      for (let i = 0; i < retired.length; i++) { const c = retired[i]; for (const k in c) disposeKit(c[k]); }
      retired.length = 0;
    } catch (e) { logErr(e); }
  };

  Actors.setTheme = function (t) {
    try {
      const S = TG.Data.skins || {};
      if (!S[t] || t === theme) return;
      theme = t;
      retired.push(cache);
      cache = {};
      projPool.length = 0;
      if (!list.length) { for (let i = 0; i < retired.length; i++) { const c = retired[i]; for (const k in c) disposeKit(c[k]); } retired.length = 0; }
      // prewarm the regular troll kits so the first wave does not hitch
      const E = TG.Data.enemies || {};
      for (const id in E) { try { getKit('t:' + id, makeP(TYPE_P[id] || {}), {}, hashStr(id) & 0xffff); } catch (e) { logErr(e); break; } }
      try { weaponKit('club'); weaponKit('maul'); rockKit(); } catch (e) { /* lazy later */ }
    } catch (e) { logErr(e); }
  };

  Actors.aliveCount = function () {
    let n = 0;
    for (let i = 0; i < list.length; i++) if (list[i].alive) n++;
    return n;
  };

  Actors.update = function (dt, time) {
    try {
      dt = +dt;
      if (!(dt > 0)) dt = 0;
      if (dt > 0.1) dt = 0.1;
      clock += dt;
      if (timeScaleT > 0) { timeScaleT -= dt; if (timeScaleT <= 0) { timeScale = 1; timeScaleT = 0; } }
      if (vulnT > 0) { vulnT -= dt; if (vulnT <= 0) { vulnMult = 1; vulnT = 0; } }
      const adt = dt * timeScale, frozen = timeScale < 0.02;
      const pl = player();
      if (adt > 0) separation();
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        if (a.removed) continue;
        try {
          if (a.dying) { updateDying(a, dt); continue; }
          a.t += adt; a.st += adt;
          a.twitch = Math.max(0, a.twitch - adt * 4);
          if (a.isBoss) aiBoss(a, adt, pl); else aiTroll(a, adt, pl);
          integrate(a, adt);
          growl(a, adt, pl);
          updateBurn(a, dt);
          if (!a.alive) continue;
          updateMats(a, dt, frozen);
          poseActor(a, adt);
          updateHitVolumes(a);
        } catch (e) { logErr(e); }
      }
      for (let i = list.length - 1; i >= 0; i--) if (list[i].removed) list.splice(i, 1);
      updateProjectiles(adt);
      updateRings(dt);
    } catch (e) { logErr(e); }
  };

  Actors.raycast = function (origin, dir, maxDist) {
    try {
      if (!origin || origin.length < 3 || !normDir(dir)) return null;
      const md = maxDist > 0 ? maxDist : 1e9;
      let best = null, bt = md, bh = false;
      for (let i = 0; i < list.length; i++) {
        const t = rayActor(list[i], origin, bt);
        if (t >= 0 && t <= bt) { bt = t; best = list[i]; bh = LAST_HEAD; }
      }
      if (!best) return null;
      return { actor: best, dist: bt, point: [origin[0] + RD[0] * bt, origin[1] + RD[1] * bt, origin[2] + RD[2] * bt], head: bh };
    } catch (e) { logErr(e); return null; }
  };

  Actors.raycastAll = function (origin, dir, maxDist) {
    const out = [];
    try {
      if (!origin || origin.length < 3 || !normDir(dir)) return out;
      const md = maxDist > 0 ? maxDist : 1e9;
      for (let i = 0; i < list.length; i++) {
        const t = rayActor(list[i], origin, md);
        if (t >= 0) out.push({ actor: list[i], dist: t, point: [origin[0] + RD[0] * t, origin[1] + RD[1] * t, origin[2] + RD[2] * t], head: LAST_HEAD });
      }
      out.sort(function (x, y) { return x.dist - y.dist; });
    } catch (e) { logErr(e); }
    return out;
  };

  Actors.damage = function (actor, amount, info) {
    try { if (actor && actor.alive && list.indexOf(actor) >= 0) applyDamage(actor, +amount, info || { type: 'bullet' }); } catch (e) { logErr(e); }
  };

  Actors.damageRadius = function (pos, radius, amount, type) {
    try {
      if (!pos || pos.length < 3 || !(radius > 0) || !(amount > 0)) return;
      const n = list.length;
      for (let i = 0; i < n; i++) {
        const a = list[i];
        if (!a || !a.alive) continue;
        const dx = a.bc[0] - pos[0], dy = a.bc[1] - pos[1], dz = a.bc[2] - pos[2];
        const l = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const d = Math.max(0, l - a.radius * 0.8);
        if (d >= radius) continue;
        const inv = l > 1e-4 ? 1 / l : 0;
        applyDamage(a, amount * (1 - d / radius), { type: type || 'explosion', point: [a.bc[0], a.bc[1], a.bc[2]], dir: [dx * inv, dy * inv, dz * inv] });
      }
    } catch (e) { logErr(e); }
  };

  Actors.inCone = function (origin, dir, range, halfAngle) {
    const out = [];
    try {
      if (!origin || origin.length < 3 || !dir || dir.length < 3) return out;
      const l = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1] + dir[2] * dir[2]);
      if (!(l > 1e-9)) return out;
      const fx = dir[0] / l, fy = dir[1] / l, fz = dir[2] / l, ha = halfAngle > 0 ? halfAngle : 0.2, rg = range > 0 ? range : 10;
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        if (!a.alive) continue;
        const vx = a.bc[0] - origin[0], vy = a.bc[1] - origin[1], vz = a.bc[2] - origin[2];
        const d = Math.sqrt(vx * vx + vy * vy + vz * vz);
        if (d - a.hR > rg) continue;
        if (d > 1e-3) {
          const ang = Math.acos(clamp((vx * fx + vy * fy + vz * fz) / d, -1, 1));
          const tol = Math.atan2(a.hR + 0.25 * a.scale, Math.max(d, 0.1));
          if (ang > ha + tol) continue;
        }
        if (d > a.radius + 1.0 && !lineOfSight(origin, a.bc)) continue;
        out.push(a);
      }
    } catch (e) { logErr(e); }
    return out;
  };

  Actors.ignite = function (actor, dps, seconds) {
    try {
      if (!actor || !actor.alive || !(dps > 0) || !(seconds > 0)) return;

  // sleeve from start point along direction d; returns {sleeve:list, band:list|null}
  function sleeveGeo(sx, sy, sz, dx, dy, dz, len, withBand) {
    const n = Math.hypot(dx, dy, dz); dx /= n; dy /= n; dz /= n;
    const rot = segRot(dx, dy, dz);
    const S = [];
    // main sleeve: rTop (far end, toward camera) wider
    S.push({ geo: TG.R.geo.cylinder(0.058, 0.046, len, 10), pos: [sx + dx * len / 2, sy + dy * len / 2, sz + dz * len / 2], rot: rot, color: COL.W });
    // rolled cuff
    S.push({ geo: TG.R.geo.cylinder(0.051, 0.05, 0.045, 10), pos: [sx + dx * 0.025, sy + dy * 0.025, sz + dz * 0.025], rot: rot, color: [0.8, 0.8, 0.8] });
    // seam / pocket patch
    S.push({ geo: TG.R.geo.cylinder(0.0535, 0.052, 0.012, 10), pos: [sx + dx * 0.3, sy + dy * 0.3, sz + dz * 0.3], rot: rot, color: [0.82, 0.82, 0.82] });
    let B = null;
    if (withBand) {
      // Norwegian-flag ID armband (red | white | blue | white | red)
      B = [];
      const bands = [[0.16, 0.02, COL.NR], [0.173, 0.006, COL.WH], [0.181, 0.01, COL.NB], [0.189, 0.006, COL.WH], [0.202, 0.02, COL.NR]];
      for (let i = 0; i < bands.length; i++) {
        const t = bands[i][0], r = 0.046 + (0.058 - 0.046) * (t / len) + 0.0035;
        B.push({ geo: TG.R.geo.cylinder(r, r, bands[i][1], 12), pos: [sx + dx * t, sy + dy * t, sz + dz * t], rot: rot, color: bands[i][2] });
      }
    }
    return { sleeve: S, band: B };
  }
  function buildHandMeshes() {
    const out = {};
    let sv;
    sv = sleeveGeo(0.022, -0.01, 0.125, 0.3, -0.35, 1, 0.55, false);
    out.gripR = { glove: mkMesh(gripHandGeo(1)), sleeve: mkMesh(sv.sleeve), band: null };
    sv = sleeveGeo(-0.022, -0.01, 0.125, -0.3, -0.35, 1, 0.55, true);
    out.gripL = { glove: mkMesh(gripHandGeo(-1)), sleeve: mkMesh(sv.sleeve), band: mkMesh(sv.band) };
    sv = sleeveGeo(-0.02, -0.062, 0.13, -0.45, -0.4, 1, 0.6, true);
    out.support = { glove: mkMesh(supportHandGeo()), sleeve: mkMesh(sv.sleeve), band: mkMesh(sv.band) };
    return out;
  }
  function makeHand(kind, x, y, z, rx, ry, rz) {
    const hm = vm.hands[kind];
    const h = group(x, y, z, rx, ry, rz);
    h.add(node(hm.glove, vm.mats.glove));
    h.add(node(hm.sleeve, vm.mats.sleeve));
    if (hm.band) h.add(node(hm.band, vm.mats.plain));
    h.basePos = [x, y, z];
    h.baseRot = [rx || 0, ry || 0, rz || 0];
