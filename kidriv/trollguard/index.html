<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROLLGUARD — Defence of Norway</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;}
#ui{position:fixed;inset:0;}
/* TROLLGUARD — HUD and menus. Everything is scoped to #ui. System fonts only. */
#ui {
  position: fixed; inset: 0; z-index: 10; overflow: hidden; pointer-events: none;
  --red: #BA0C2F; --red-hi: #e8344f; --blue: #00205B; --blue-hi: #2f6fd6;
  --ink: #eef3f8; --ink-2: rgba(238,243,248,.74); --ink-3: rgba(238,243,248,.48);
  --line: rgba(255,255,255,.12); --line-2: rgba(255,255,255,.24);
  --gold: #f2c14e; --ok: #4fd18b; --warn: #ffb020; --sap: #0a6ed1;
  --ex: clamp(14px, 2.1vw, 80px); --ey: clamp(12px, 2.4vh, 64px);
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-cond: "Avenir Next Condensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", "Liberation Mono", monospace;
  font-family: var(--f-ui);
  font-size: clamp(11px, calc(0.5vw + 0.55vh), 32px);
  line-height: 1.3; color: var(--ink);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  user-select: none; -webkit-user-select: none; cursor: default;
}
#ui *, #ui *::before, #ui *::after { box-sizing: border-box; }
#ui h1, #ui h2, #ui h3, #ui p, #ui ul, #ui ol { margin: 0; padding: 0; }
#ui button { font: inherit; color: inherit; }
#ui svg { display: block; }
#ui .tg-ic { width: 1em; height: 1em; flex: none; }
#ui .tg-flag { width: 1.45em; height: 1.05em; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
#ui .tg-emb { width: 100%; height: 100%; overflow: visible; }
#ui kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.9em; height: 1.9em; padding: 0 .45em;
  border: 1px solid rgba(255,255,255,.32); border-bottom-width: 3px; border-radius: .3em; background: rgba(255,255,255,.07);
  font: 700 .78em/1 var(--f-mono); color: #fff; white-space: nowrap;
}

/* ------------------------------------------------------------------ buttons */
#ui .tg-btn {
  position: relative; display: inline-flex; align-items: center; gap: .7em; min-width: 14em;
  padding: .85em 1.6em .85em 1.3em; overflow: hidden; cursor: pointer; pointer-events: auto;
  background: linear-gradient(90deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border: 1px solid var(--line-2); color: var(--ink);
  font: condensed 700 1.1em/1.1 var(--f-cond); letter-spacing: .18em; text-transform: uppercase; text-align: left;
  clip-path: polygon(0 0, calc(100% - .8em) 0, 100% .8em, 100% 100%, 0 100%);
  transition: background .2s, border-color .2s, transform .2s, color .2s, opacity .2s;
}
#ui .tg-btn::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: .26em; background: var(--red);
  transform: scaleY(.35); transition: transform .22s;
}
#ui .tg-btn::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.2) 50%, transparent 62%);
  transform: translateX(-110%); transition: transform .6s;
}
#ui .tg-btn:hover { background: linear-gradient(90deg, rgba(186,12,47,.38), rgba(186,12,47,.08)); border-color: rgba(255,255,255,.5); transform: translateX(.3em); }
#ui .tg-btn:hover::before { transform: scaleY(1); }
#ui .tg-btn:hover::after { transform: translateX(110%); }
#ui .tg-btn:active { transform: translateX(.3em) scale(.98); }
#ui .tg-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#ui .tg-btn-i { width: 1.05em; height: 1.05em; }
#ui .tg-btn-l { flex: 1; white-space: nowrap; }
#ui .tg-btn-h { margin-left: 1.2em; font: 600 .66em var(--f-mono); letter-spacing: .12em; opacity: .65; }
#ui .tg-btn.primary { background: linear-gradient(90deg, #c40f33, #8e0a25); border-color: rgba(255,130,150,.55); color: #fff; }
#ui .tg-btn.primary::before { background: #fff; }
#ui .tg-btn.primary:hover { background: linear-gradient(90deg, #dc1640, #a50c2c); box-shadow: 0 0 1.6em rgba(186,12,47,.45); }
#ui .tg-btn.big { font-size: 1.35em; padding: .95em 1.8em .95em 1.4em; }
#ui .tg-btn.ghost { min-width: 10em; background: rgba(0,0,0,.25); }
#ui .tg-btn.small { min-width: 0; font-size: .9em; padding: .7em 1.2em; }
#ui .tg-btn.danger:hover { background: linear-gradient(90deg, rgba(186,12,47,.55), rgba(186,12,47,.12)); }
#ui .tg-btn.armed { background: linear-gradient(90deg, #c40f33, #6f0820); border-color: #ff8a9a; animation: tg-blink .7s steps(2) infinite; }
#ui .tg-btn:disabled { opacity: .38; cursor: not-allowed; transform: none; filter: grayscale(.7); box-shadow: none; }
#ui .tg-btn:disabled::before { transform: scaleY(.35); }
#ui .tg-btn:disabled::after { display: none; }

/* ------------------------------------------------------------------ shared screen chrome */
#ui .tg-screen { position: absolute; inset: 0; z-index: 10; display: none; pointer-events: auto; }
#ui .tg-screen.on { display: flex; animation: tg-fade .35s ease-out backwards; }
#ui .tg-scrim {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 70% at 50% 45%, rgba(2,6,14,.25), rgba(2,6,14,.6)),
    linear-gradient(180deg, rgba(2,6,14,.82) 0%, rgba(2,6,14,.45) 22%, rgba(2,6,14,.5) 72%, rgba(2,6,14,.9) 100%);
}
#ui .tg-scrim.dark { background: radial-gradient(ellipse at center, rgba(4,9,18,.72), rgba(2,5,10,.9)); }
#ui .tg-scrim.blur { background: radial-gradient(ellipse at center, rgba(4,9,18,.55), rgba(2,5,10,.85)); backdrop-filter: blur(6px) saturate(.75); -webkit-backdrop-filter: blur(6px) saturate(.75); }
#ui .tg-scrim.death {
  background: radial-gradient(ellipse at center, rgba(70,0,10,.45), rgba(14,0,3,.9));
  backdrop-filter: grayscale(.85) blur(2px); -webkit-backdrop-filter: grayscale(.85) blur(2px);
}
#ui .tg-scrim.win { background: radial-gradient(ellipse at 50% 40%, rgba(10,24,52,.6), rgba(2,5,12,.92)); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#ui .tg-panel {
  position: relative; background: linear-gradient(180deg, rgba(16,23,36,.9), rgba(8,12,20,.94));
  border: 1px solid var(--line); box-shadow: 0 2em 5em rgba(0,0,0,.55);
}
#ui .tg-panel::before, #ui .tg-flagstripe {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, #BA0C2F 0 27.3%, #fff 27.3% 31.8%, #00205B 31.8% 40.9%, #fff 40.9% 45.4%, #BA0C2F 45.4%);
}
#ui .tg-mh-k {
  display: flex; align-items: center; gap: .55em; color: var(--red-hi);
  font: condensed 700 .8em var(--f-cond); letter-spacing: .32em; text-transform: uppercase;
}
#ui .tg-mh-k b { font-family: var(--f-mono); color: #fff; letter-spacing: .05em; font-size: 1.15em; }
#ui .tg-mh-k span { color: var(--ink-3); font-family: var(--f-mono); letter-spacing: .05em; }
#ui h2 { font: condensed 800 2.5em/1.05 var(--f-cond); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
#ui .tg-flagbar { display: flex; height: .32em; width: min(30em, 70vw); }
#ui .tg-flagbar i { display: block; }
#ui .tg-flagbar .r { background: #BA0C2F; }
#ui .tg-flagbar .w { background: #fff; }
#ui .tg-flagbar .b { background: #00205B; }
#ui .tg-chip { display: inline-flex; align-items: center; gap: .7em; text-align: left; }
#ui .tg-chip .tg-emb { width: 2.6em; height: 2.6em; color: var(--acc-hi); flex: none; }
#ui .tg-chip b { display: block; font: condensed 800 1.15em var(--f-cond); letter-spacing: .08em; text-transform: uppercase; }
#ui .tg-chip em { display: block; font-style: normal; font-size: .78em; letter-spacing: .14em; text-transform: uppercase; color: var(--acc-hi); }
#ui .tg-chip.sm .tg-emb { width: 2em; height: 2em; }
#ui .tg-sel-badge {
  position: absolute; top: .7em; right: .7em; z-index: 3; width: 1.9em; height: 1.9em; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; background: var(--acc-hi, var(--red)); color: #08101a;
  transform: scale(0); transition: transform .25s cubic-bezier(.2,.9,.3,1.4);
}
#ui .tg-sel-badge .tg-ic { width: 1.1em; height: 1.1em; }
#ui .sel > .tg-sel-badge { transform: scale(1); }

/* ------------------------------------------------------------------ title screen */
#ui .tg-title { flex-direction: column; justify-content: center; padding: var(--ey) calc(var(--ex) * 2.2); }
#ui .tg-title-scrim {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(2,5,12,.88) 0%, rgba(2,5,12,.6) 32%, rgba(2,5,12,.12) 62%, rgba(2,5,12,0) 80%),
    linear-gradient(0deg, rgba(2,5,12,.75) 0%, rgba(2,5,12,0) 32%),
    radial-gradient(ellipse 60% 50% at 10% 20%, rgba(0,32,91,.35), transparent 70%);
}
#ui .tg-cross { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  -webkit-mask-image: radial-gradient(ellipse 70% 80% at 25% 50%, #000 20%, transparent 75%);
  mask-image: radial-gradient(ellipse 70% 80% at 25% 50%, #000 20%, transparent 75%); }
#ui .tg-cross i { position: absolute; display: block;
  background: linear-gradient(var(--dir, 90deg), rgba(255,255,255,.14) 0 22%, rgba(0,32,91,.55) 22% 78%, rgba(255,255,255,.14) 78% 100%); }
#ui .tg-cross .v { --dir: 90deg; left: 9%; top: 0; bottom: 0; width: 4.2vw; transform-origin: top; animation: tg-growy 1.6s .1s cubic-bezier(.7,0,.2,1) backwards; }
#ui .tg-cross .h { --dir: 180deg; top: 63%; left: 0; right: 30%; height: 4.2vw; transform-origin: left; animation: tg-grow 1.6s .3s cubic-bezier(.7,0,.2,1) backwards; }
#ui .tg-title-main { position: relative; max-width: 60em; }
#ui .tg-kicker {
  display: flex; align-items: center; gap: .8em; margin-bottom: .6em; color: var(--ink-2);
  font: condensed 700 .9em var(--f-cond); letter-spacing: .34em; text-transform: uppercase;
  animation: tg-rise .8s .05s backwards;
}
#ui .tg-kicker em { font-style: normal; color: var(--ink-3); padding-left: .8em; border-left: 1px solid var(--line-2); }
#ui .tg-word {
  margin: 0 0 .14em -.04em; font: condensed 800 min(7.6em, 12.5vw)/.9 var(--f-cond); letter-spacing: .05em;
  white-space: nowrap; filter: drop-shadow(0 .05em .22em rgba(0,0,0,.6));
}
#ui .tg-word span {
  display: inline-block; color: transparent;
  background: linear-gradient(180deg, #ffffff 28%, #d6dee9 62%, #93a6bd 100%);
  -webkit-background-clip: text; background-clip: text;
  animation: tg-letter .9s cubic-bezier(.2,.8,.2,1) calc(.15s + var(--i) * 55ms) backwards;
}
#ui .tg-title .tg-flagbar { transform-origin: left; animation: tg-grow .9s .7s cubic-bezier(.7,0,.2,1) backwards; }
#ui .tg-sub {
  margin: .9em 0 2.2em; font: condensed 600 1.4em var(--f-cond); letter-spacing: .62em; text-transform: uppercase;
  color: rgba(255,255,255,.9); animation: tg-sub 1.3s .85s cubic-bezier(.2,.8,.2,1) backwards;
}
#ui .tg-title-btns { display: flex; flex-direction: column; align-items: flex-start; gap: .7em; }
#ui .tg-title-btns .tg-btn { min-width: 19em; animation: tg-rise .6s backwards; }
#ui .tg-title-btns .tg-btn:nth-child(1) { animation-delay: 1.1s; }
#ui .tg-title-btns .tg-btn:nth-child(2) { animation-delay: 1.22s; }
#ui .tg-title-foot {
  position: absolute; left: calc(var(--ex) * 2.2); right: var(--ex); bottom: var(--ey); display: flex; justify-content: space-between; gap: 2em;
  font: 600 .72em var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
  animation: tg-fade 1s 1.4s backwards;
}

/* ------------------------------------------------------------------ menu screens (branch / mission) */
#ui .tg-menu { flex-direction: column; padding: var(--ey) var(--ex); }
#ui .tg-menu > header, #ui .tg-menu > .tg-mbody, #ui .tg-menu > footer { position: relative; width: 100%; max-width: 104em; margin-left: auto; margin-right: auto; }
#ui .tg-mh { display: flex; align-items: flex-end; justify-content: space-between; gap: 1em; padding-bottom: 1em; margin-bottom: 1.1em; border-bottom: 1px solid var(--line); animation: tg-rise .5s backwards; }
#ui .tg-mh h2 { margin-top: .15em; }
#ui .tg-mh-r .tg-flag { width: 2.2em; height: 1.6em; }
#ui .tg-mbody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: .5em .4em 1.2em; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
#ui .tg-mbody::-webkit-scrollbar { width: 6px; }
#ui .tg-mbody::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); }
#ui .tg-mf { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.5em; padding-top: 1em; border-top: 1px solid var(--line); animation: tg-fade .5s .2s backwards; }
#ui .tg-mf-info { display: flex; justify-content: center; min-height: 2.6em; align-items: center; }
#ui .tg-mf-hint { font: condensed 600 .9em var(--f-cond); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
#ui .tg-mf-r .tg-btn { min-width: 16em; }

/* ------------------------------------------------------------------ branch cards */
#ui .tg-cards6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1em; }
#ui .tg-ccard {
  position: relative; display: flex; flex-direction: column; gap: .62em; padding: 1.15em 1.25em 1.1em; overflow: hidden; cursor: pointer;
  background: linear-gradient(160deg, rgba(var(--acc-rgb), .3) 0%, rgba(8,12,20,.8) 42%, rgba(8,12,20,.9) 100%);
  border: 1px solid rgba(255,255,255,.1); border-top: 2px solid var(--acc-hi);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
  animation: tg-rise .55s calc(.05s + var(--i) * 60ms) backwards;
}
#ui .tg-ccard:hover { transform: translateY(-.3em); border-color: rgba(var(--acc-hi-rgb), .6); box-shadow: 0 1.2em 2.6em rgba(0,0,0,.5); }
#ui .tg-ccard.sel { border-color: var(--acc-hi); box-shadow: 0 0 0 2px var(--acc-hi), 0 0 2.6em rgba(var(--acc-hi-rgb), .35), 0 1.2em 2.6em rgba(0,0,0,.5); }
#ui .has-sel .tg-ccard:not(.sel):not(:hover) { opacity: .7; }
#ui .tg-cc-wm { position: absolute; right: -2.2em; bottom: -2.4em; width: 13em; height: 13em; opacity: .07; color: var(--acc-hi); pointer-events: none; transform: rotate(-12deg); }
#ui .tg-cc-top { position: relative; display: grid; grid-template-columns: 4.3em 1fr auto; gap: .9em; align-items: center; }
#ui .tg-cc-emb { width: 4.3em; height: 4.3em; color: var(--acc-hi); filter: drop-shadow(0 0 .6em rgba(var(--acc-hi-rgb), .35)); transition: transform .3s; }
#ui .tg-ccard:hover .tg-cc-emb { transform: scale(1.06) rotate(-3deg); }
#ui .tg-cc-no { font: condensed 800 1.38em/1.05 var(--f-cond); letter-spacing: .05em; text-transform: uppercase; color: #fff; }
#ui .tg-cc-en { margin-top: .25em; font: condensed 700 .74em var(--f-cond); letter-spacing: .2em; text-transform: uppercase; color: var(--acc-hi); }
#ui .tg-cc-idx { align-self: start; font: 700 .8em var(--f-mono); color: var(--ink-3); margin-right: 2.3em; }
#ui .tg-cc-motto { position: relative; padding-left: .9em; font-style: italic; color: var(--ink); border-left: 2px solid rgba(var(--acc-hi-rgb), .7); }
#ui .tg-cc-desc { position: relative; font-size: .9em; color: var(--ink-2); }
#ui .tg-cc-perks { position: relative; list-style: none; display: flex; flex-direction: column; gap: .22em; font-size: .88em; }
#ui .tg-cc-perks li { position: relative; padding-left: 1.2em; }
#ui .tg-cc-perks li::before { content: ''; position: absolute; left: .15em; top: .5em; width: .45em; height: .45em; background: var(--acc-hi); transform: rotate(45deg); }
#ui .tg-cc-hp { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: .7em; align-items: center; margin-top: auto; }
#ui .tg-cc-hp .l { font: condensed 700 .72em var(--f-cond); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); }
#ui .tg-cc-hp b { font: 700 1em var(--f-mono); }
#ui .tg-cc-hpbar { height: .4em; background: rgba(255,255,255,.12); }
#ui .tg-cc-hpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc-hi), #fff); }
#ui .tg-cc-ab { position: relative; display: grid; grid-template-columns: 2.9em 1fr auto; gap: .8em; align-items: center; padding: .6em .7em; background: rgba(0,0,0,.32); border: 1px solid rgba(var(--acc-hi-rgb), .28); }
#ui .tg-cc-abi { position: relative; width: 2.9em; height: 2.9em; border-radius: 50%; border: 1px solid rgba(var(--acc-hi-rgb), .6); display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(var(--acc-rgb), .55), rgba(0,0,0,.4)); }
#ui .tg-cc-abi .tg-ic { width: 1.5em; height: 1.5em; color: #fff; }
#ui .tg-cc-abi kbd { position: absolute; right: -.5em; bottom: -.4em; min-width: 1.5em; height: 1.5em; font-size: .62em; background: #0b1118; }
#ui .tg-cc-abt b { display: block; font: condensed 700 .98em var(--f-cond); letter-spacing: .08em; text-transform: uppercase; }
#ui .tg-cc-abt span { display: block; font-size: .8em; color: var(--ink-2); }
#ui .tg-cc-abcd { text-align: center; }
#ui .tg-cc-abcd b { display: block; font: 700 1.2em var(--f-mono); }
#ui .tg-cc-abcd small { font-size: .65em; color: var(--ink-3); }
#ui .tg-cc-abcd span { display: block; font-size: .6em; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

/* ------------------------------------------------------------------ mission cards */
#ui .tg-cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2em; }
#ui .tg-lcard {
  position: relative; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; --acc-hi: #fff;
  background: rgba(8,12,20,.86); border: 1px solid var(--line);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
  animation: tg-rise .6s calc(.08s + var(--i) * 90ms) backwards;
}
#ui .tg-lcard:hover { transform: translateY(-.3em); border-color: rgba(255,255,255,.4); box-shadow: 0 1.2em 2.6em rgba(0,0,0,.5); }
#ui .tg-lcard.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--red-hi), 0 0 2.6em rgba(186,12,47,.4); }
#ui .tg-lcard.sel .tg-sel-badge { background: var(--red-hi); color: #fff; }
#ui .tg-lc-art { position: relative; height: 9.5em; overflow: hidden; }
#ui .tg-lc-art > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#ui .tg-lc-art::before { content: ''; position: absolute; inset: 0; pointer-events: none; }
#ui .tg-lc-art.th-coast { background: linear-gradient(180deg, #120f2e 0%, #3a2357 42%, #a5506a 76%, #f0a070 100%); }
#ui .tg-lc-art.th-coast::before {
  left: -10%; right: -10%; height: 55%;
  background: radial-gradient(ellipse 45% 40% at 30% 60%, rgba(80,255,170,.5), transparent 70%), radial-gradient(ellipse 40% 30% at 68% 45%, rgba(120,255,210,.32), transparent 70%);
  filter: blur(4px); animation: tg-aurora 7s ease-in-out infinite alternate;
}
#ui .tg-lc-art.th-snow { background: linear-gradient(180deg, #7790ab 0%, #b4c8db 55%, #e6eef6 100%); }
#ui .tg-lc-art.th-snow::before {
  z-index: 1; background-image: radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.6px), radial-gradient(circle, rgba(255,255,255,.7) 0 1px, transparent 1.4px);
  background-size: 22px 22px, 37px 37px; background-position: 0 0, 11px 7px; animation: tg-snow 3s linear infinite;
}
#ui .tg-lc-art.th-night { background: linear-gradient(180deg, #03040a 0%, #0e0b1c 55%, #3d120a 100%); }
#ui .tg-lc-art.th-night::before { background: radial-gradient(circle at 78% 24%, #f4f0e0 0 3.5%, rgba(244,240,224,.25) 4.5%, transparent 13%); }
#ui .tg-lc-fade { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, transparent 45%, rgba(8,12,20,.95)); }
#ui .tg-lc-num { position: absolute; z-index: 2; left: .45em; top: .2em; font: condensed 800 3.2em/1 var(--f-cond); color: rgba(255,255,255,.88); text-shadow: 0 .05em .3em rgba(0,0,0,.6); }
#ui .tg-lc-op { position: absolute; z-index: 2; left: 1em; bottom: .7em; padding: .25em .6em; background: var(--red); font: condensed 700 .74em var(--f-cond); letter-spacing: .2em; text-transform: uppercase; }
#ui .tg-lc-body { position: relative; padding: .9em 1.2em 1.2em; display: flex; flex-direction: column; gap: .55em; flex: 1; }
#ui .tg-lc-name { font: condensed 800 1.9em/1 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; }
#ui .tg-lc-brief { font-size: .92em; color: var(--ink-2); min-height: 2.6em; }
#ui .tg-lc-sh { margin-top: .3em; font: condensed 700 .7em var(--f-cond); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
#ui .tg-lc-stages { list-style: none; display: flex; flex-direction: column; gap: .25em; }
#ui .tg-lc-stages li { display: grid; grid-template-columns: 1.4em 1fr auto; gap: .5em; align-items: center; padding: .38em .55em; font-size: .9em; background: rgba(255,255,255,.045); border-left: 2px solid rgba(255,255,255,.18); }
#ui .tg-lc-stages .k { font: 700 .9em var(--f-mono); color: var(--ink-3); }
#ui .tg-lc-stages .s { font-weight: 600; }
#ui .tg-lc-stages .b { display: flex; align-items: center; gap: .4em; color: var(--ink-2); font-size: .92em; }
#ui .tg-lc-stages .b .tg-ic { width: 1em; height: 1em; color: #ff8a8a; }
#ui .tg-lc-stages .b em { font-style: normal; padding: .05em .4em; background: var(--red); color: #fff; font: condensed 700 .72em var(--f-cond); letter-spacing: .14em; text-transform: uppercase; }
#ui .tg-lc-stages li.big { border-left-color: var(--red-hi); background: linear-gradient(90deg, rgba(186,12,47,.3), rgba(186,12,47,.05)); }
#ui .tg-lc-stages li.big .b { color: #fff; font-weight: 700; }
#ui .tg-lc-stages li.big .b .tg-ic { color: var(--gold); }
#ui .tg-lc-lock { display: none; }
#ui .tg-lcard.locked { cursor: not-allowed; }
#ui .tg-lcard.locked:hover { transform: none; box-shadow: none; border-color: var(--line); }
#ui .tg-lcard.locked .tg-lc-art, #ui .tg-lcard.locked .tg-lc-body { filter: grayscale(1) brightness(.45); }
#ui .tg-lcard.locked .tg-lc-lock {
  position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .45em; text-align: center; padding: 1em;
  background: repeating-linear-gradient(135deg, rgba(0,0,0,.25) 0 10px, rgba(0,0,0,.1) 10px 20px);
}
#ui .tg-lc-lock .tg-ic { width: 3em; height: 3em; color: rgba(255,255,255,.85); }
#ui .tg-lc-lock b { font: condensed 800 1.4em var(--f-cond); letter-spacing: .3em; text-transform: uppercase; }
#ui .tg-lc-lock span { font-size: .85em; color: var(--ink-2); }

/* ------------------------------------------------------------------ settings */
#ui .tg-settings { align-items: center; justify-content: center; padding: var(--ey) var(--ex); }
#ui .tg-set-panel { width: min(70em, 100%); max-height: 100%; display: flex; flex-direction: column; padding: 1.6em 2em 1.4em; animation: tg-rise .45s backwards; }
#ui .tg-ph { margin-bottom: 1.2em; }
#ui .tg-set-cols { display: grid; grid-template-columns: 1fr 1.1fr; gap: 2.4em; overflow-y: auto; min-height: 0; padding-right: .3em; }
#ui .tg-set-col h3 { margin: 1.1em 0 .6em; padding-bottom: .35em; border-bottom: 1px solid var(--line); font: condensed 700 .82em var(--f-cond); letter-spacing: .3em; text-transform: uppercase; color: var(--red-hi); }
#ui .tg-set-col h3:first-child { margin-top: 0; }
#ui .tg-sl, #ui .tg-seg-wrap { margin-bottom: .9em; }
#ui .tg-sl-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .2em; }
#ui .tg-sl-top label { font-weight: 600; }
#ui .tg-sl-top output { font: 700 .92em var(--f-mono); color: #fff; }
#ui .tg-range { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 1.6em; margin: 0; background: transparent; cursor: pointer; pointer-events: auto; --p: 50%; }
#ui .tg-range:focus { outline: none; }
#ui .tg-range::-webkit-slider-runnable-track { height: .32em; background: linear-gradient(90deg, var(--red-hi) 0 var(--p), rgba(255,255,255,.16) var(--p) 100%); }
#ui .tg-range::-webkit-slider-thumb { -webkit-appearance: none; width: 1.05em; height: 1.05em; margin-top: -.37em; background: #fff; border: .22em solid var(--red); border-radius: 2px; box-shadow: 0 0 .6em rgba(186,12,47,.6); }
#ui .tg-range::-moz-range-track { height: .32em; background: rgba(255,255,255,.16); border: 0; }
#ui .tg-range::-moz-range-progress { height: .32em; background: var(--red-hi); }
#ui .tg-range::-moz-range-thumb { width: .7em; height: .7em; background: #fff; border: .22em solid var(--red); border-radius: 2px; }
#ui .tg-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: .35em; margin-top: .3em; }
#ui .tg-btn.seg { min-width: 0; justify-content: center; padding: .6em .8em; font-size: .95em; clip-path: none; }
#ui .tg-btn.seg:hover { transform: none; }
#ui .tg-btn.seg .tg-btn-l { flex: none; }
#ui .tg-btn.seg.on { background: linear-gradient(180deg, rgba(186,12,47,.65), rgba(120,8,30,.55)); border-color: #ff8a9a; }
#ui .tg-btn.seg.on::before { transform: scaleY(1); background: #fff; }
#ui .tg-q-hint { margin-top: .5em; font-size: .85em; color: var(--ink-3); min-height: 2.4em; }
#ui .tg-keys { width: 100%; border-collapse: collapse; }
#ui .tg-keys td { padding: .42em .3em; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
#ui .tg-keys td:first-child { white-space: nowrap; width: 1%; padding-right: 1.4em; }
#ui .tg-keys td:last-child { color: var(--ink-2); }
#ui .tg-keys kbd { margin-right: .3em; }
#ui .tg-or { margin: 0 .35em 0 .05em; color: var(--ink-3); }
#ui .tg-pf { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-top: 1.2em; padding-top: 1em; border-top: 1px solid var(--line); }
#ui .tg-pf-r .tg-btn { min-width: 12em; }

/* ------------------------------------------------------------------ pause */
#ui .tg-pause { align-items: center; justify-content: center; }
#ui .tg-pause-p { width: min(28em, 92vw); padding: 1.8em 2em 1.5em; text-align: left; animation: tg-rise .4s backwards; }
#ui .tg-pause-p h2 { font-size: 3em; margin: .1em 0 .3em; }
#ui .tg-pause-info { display: flex; flex-direction: column; gap: .7em; margin-bottom: 1.3em; font-family: var(--f-cond); letter-spacing: .06em; color: var(--ink-2); }
#ui .tg-pause-info > b { color: #fff; letter-spacing: .14em; }
#ui .tg-col-btns { display: flex; flex-direction: column; gap: .5em; }
#ui .tg-col-btns .tg-btn { width: 100%; }
#ui .tg-pause-hint { margin-top: 1.1em; font-size: .78em; color: var(--ink-3); }

/* ------------------------------------------------------------------ death / complete / victory */
#ui .tg-center { position: relative; margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--ey) var(--ex); max-width: 100%; }
#ui .tg-row-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: .8em; margin-top: 2em; animation: tg-rise .5s .9s backwards; }
#ui .tg-dk { font: condensed 700 1em var(--f-cond); letter-spacing: .5em; padding-left: .5em; text-transform: uppercase; color: #ff6b7a; animation: tg-fade .6s backwards; }
#ui .tg-dt { margin: .15em 0; font-size: min(5.4em, 10vw); color: #fff; text-shadow: 0 0 .5em rgba(186,12,47,.8); letter-spacing: .14em; animation: tg-slam 1s .1s cubic-bezier(.2,.8,.2,1) backwards; }
#ui .tg-dline { width: min(36em, 80vw); height: 2px; background: linear-gradient(90deg, transparent, #ff3347, transparent); animation: tg-grow .8s .4s backwards; }
#ui .tg-ds { display: flex; gap: 2.4em; margin-top: 1.4em; animation: tg-fade .6s .6s backwards; }
#ui .tg-ds span { display: flex; flex-direction: column; font: condensed 600 .75em var(--f-cond); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
#ui .tg-ds b { font: 700 1.9em var(--f-mono); color: #fff; letter-spacing: 0; }
#ui .tg-ck { display: flex; align-items: center; gap: .9em; font: condensed 700 1em var(--f-cond); letter-spacing: .45em; text-transform: uppercase; color: var(--ink-2); animation: tg-fade .6s backwards; }
#ui .tg-ct { margin: .25em 0 .35em; font-size: min(4.6em, 9vw); letter-spacing: .12em; animation: tg-slam 1s .1s cubic-bezier(.2,.8,.2,1) backwards; }
#ui .tg-complete .tg-flagbar, #ui .tg-victory .tg-flagbar { animation: tg-grow .9s .35s cubic-bezier(.7,0,.2,1) backwards; }
#ui .tg-csub { margin-top: 1em; color: var(--ink-2); letter-spacing: .06em; animation: tg-fade .6s .5s backwards; }
#ui .tg-stats { display: grid; grid-template-columns: repeat(5, minmax(7.5em, 1fr)); gap: .7em; margin-top: 2em; width: min(56em, 92vw); }
#ui .tg-stat { padding: 1em .8em .9em; background: rgba(10,16,28,.75); border: 1px solid var(--line); border-top: 2px solid var(--red-hi); animation: tg-rise .5s calc(.35s + var(--i) * 100ms) backwards; }
#ui .tg-stat .v { font: 700 2em/1.1 var(--f-mono); color: #fff; font-variant-numeric: tabular-nums; }
#ui .tg-stat .l { margin-top: .3em; font: condensed 700 .72em var(--f-cond); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
#ui .tg-victory { overflow: hidden; }
#ui .tg-rays {
  position: absolute; left: 50%; top: 42%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; pointer-events: none; opacity: .55;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.06) 0deg 5deg, transparent 5deg 12deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 45%); mask-image: radial-gradient(circle, #000 0, transparent 45%);
  animation: tg-spin 80s linear infinite;
}
#ui .tg-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#ui .tg-confetti i { position: absolute; top: -4vh; display: block; width: var(--w); height: calc(var(--w) * .45); animation: tg-conf var(--t) var(--d) linear infinite; }
#ui .tg-vt {
  margin: .05em 0; font: condensed 800 min(9em, 16vw)/.95 var(--f-cond); letter-spacing: .12em; padding-left: .12em; text-transform: uppercase; color: transparent;
  background: linear-gradient(180deg, #fff6d8 20%, #f2c14e 60%, #b8862a); -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 0 .25em rgba(242,193,78,.45)); animation: tg-slam 1.2s .15s cubic-bezier(.2,.8,.2,1) backwards;
}
#ui .tg-vs { font: condensed 700 1.2em var(--f-cond); letter-spacing: .34em; text-transform: uppercase; color: #fff; animation: tg-fade .8s .6s backwards; }
#ui .tg-credits { margin-top: 2em; font: condensed 600 1.5em var(--f-cond); letter-spacing: .2em; color: #fff; text-transform: uppercase; animation: tg-sub 1.6s 1.3s cubic-bezier(.2,.8,.2,1) backwards; }
#ui .tg-credits2 { margin-top: .5em; font: 600 .74em var(--f-mono); letter-spacing: .1em; color: var(--ink-3); animation: tg-fade 1s 1.8s backwards; }

/* ------------------------------------------------------------------ loading */
#ui .tg-loading { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; pointer-events: auto; background: radial-gradient(ellipse at 50% 55%, rgba(14,24,40,.94), rgba(2,4,8,.985)); }
#ui .tg-loading.on { display: flex; animation: tg-fade .25s backwards; }
#ui .tg-ld-c { display: flex; flex-direction: column; align-items: center; gap: 1.1em; width: min(30em, 86vw); text-align: center; }
#ui .tg-ld-ring { position: relative; width: 4.6em; height: 4.6em; display: flex; align-items: center; justify-content: center; }
#ui .tg-ld-ring i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.12); border-top-color: var(--red-hi); border-right-color: #fff; animation: tg-spin .9s linear infinite; }
#ui .tg-ld-ring .tg-flag { width: 1.9em; height: 1.4em; }
#ui .tg-ld-t { font: condensed 700 1.3em var(--f-cond); letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; }
#ui .tg-ld-t i { font-style: normal; animation: tg-blink 1.2s infinite; }
#ui .tg-ld-t i:nth-of-type(2) { animation-delay: .2s; }
#ui .tg-ld-t i:nth-of-type(3) { animation-delay: .4s; }
#ui .tg-ld-bar { position: relative; width: 100%; height: 3px; overflow: hidden; background: rgba(255,255,255,.1); }
#ui .tg-ld-bar span { position: absolute; top: 0; bottom: 0; width: 35%; background: linear-gradient(90deg, transparent, var(--red-hi), #fff, transparent); animation: tg-indet 1.3s ease-in-out infinite; }
#ui .tg-ld-tip { font-size: .9em; color: var(--ink-2); min-height: 2.6em; }

/* ------------------------------------------------------------------ HUD */
#ui .tg-hud {
  position: absolute; inset: 0; z-index: 3; display: none; pointer-events: none;
  --acc: #BA0C2F; --acc-hi: #e8344f; --acc-rgb: 186,12,47; --acc-hi-rgb: 232,52,79;
  text-shadow: 0 1px 2px rgba(0,0,0,.55);
}
#ui .tg-hud.on { display: block; }
#ui .tg-hud.on .tg-tl { animation: tg-in-l .6s .1s backwards; }
#ui .tg-hud.on .tg-tr, #ui .tg-hud.on .tg-wbox { animation: tg-in-r .6s .1s backwards; }
#ui .tg-hud.on .tg-compass { animation: tg-in-t .6s .2s backwards; }
#ui .tg-hud.on .tg-health { animation: tg-in-b .6s .2s backwards; }

/* screen effects */
#ui .tg-fx { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; pointer-events: none; }
#ui .tg-fx.on { opacity: 1; }
#ui .tg-fx-lowhp { background: radial-gradient(ellipse at center, transparent 42%, rgba(150,0,12,.35) 72%, rgba(110,0,8,.78) 100%); }
#ui .tg-fx-lowhp.on { animation: tg-lowhp 1.1s ease-in-out infinite; }
#ui .tg-fx-hurt { background: radial-gradient(ellipse at center, transparent 50%, rgba(210,0,24,.5) 100%); transition: none; }
#ui .tg-fx-focus { background: radial-gradient(ellipse at center, transparent 48%, rgba(70,110,165,.28) 76%, rgba(16,34,72,.66) 100%); box-shadow: inset 0 0 0 2px rgba(150,200,255,.22), inset 0 0 6vmin rgba(120,170,230,.25); }
#ui .tg-fx-dbg { overflow: hidden; background: radial-gradient(ellipse at center, transparent 52%, rgba(10,110,209,.34) 100%); }
#ui .tg-dbg-scan { position: absolute; left: 0; right: 0; top: -6px; bottom: 0; background: repeating-linear-gradient(0deg, rgba(40,140,240,.14) 0 2px, transparent 2px 6px); animation: tg-scanline .6s linear infinite; }
#ui .tg-dbg-scan::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 18vh; background: linear-gradient(180deg, transparent, rgba(90,180,255,.14), transparent); animation: tg-sweep 2.4s linear infinite; }
#ui .tg-dbg-c { position: absolute; width: 7vmin; height: 7vmin; border: 3px solid #4aa3ff; filter: drop-shadow(0 0 .4em #0a6ed1); }
#ui .tg-dbg-c.tl { left: 3vmin; top: 3vmin; border-right: 0; border-bottom: 0; }
#ui .tg-dbg-c.tr { right: 3vmin; top: 3vmin; border-left: 0; border-bottom: 0; }
#ui .tg-dbg-c.bl { left: 3vmin; bottom: 3vmin; border-right: 0; border-top: 0; }
#ui .tg-dbg-c.br { right: 3vmin; bottom: 3vmin; border-left: 0; border-top: 0; }
#ui .tg-fx-tag {
  position: absolute; left: 50%; bottom: calc(var(--ey) + 8.6em); transform: translateX(-50%); display: flex; align-items: center; gap: .7em;
  padding: .45em 1em; white-space: nowrap; font: condensed 700 1em var(--f-cond); letter-spacing: .14em; text-transform: uppercase;
}
#ui .tg-fx-tag span { font: 600 .66em var(--f-mono); letter-spacing: .08em; opacity: .8; text-transform: none; }
#ui .tg-focus-tag { background: rgba(10,24,48,.7); border: 1px solid rgba(150,200,255,.45); color: #cfe6ff; }
#ui .tg-focus-tag .tg-ic { width: 1.2em; height: 1.2em; }
#ui .tg-dbg-tag { background: rgba(0,20,60,.82); border: 1px solid #4aa3ff; color: #fff; box-shadow: 0 0 1.4em rgba(10,110,209,.6); }
#ui .tg-dbg-tag b { font-family: var(--f-mono); letter-spacing: .24em; animation: tg-blink 1s steps(2) infinite; }
#ui .tg-bp { display: block; width: .9em; height: .9em; border-radius: 50%; background: #e23a50; box-shadow: 0 0 .7em #ff3347; animation: tg-blink 1s steps(2) infinite; }

/* sniper scope */
#ui .tg-scope { position: absolute; inset: 0; display: none; background: radial-gradient(circle at 50% 50%, transparent 0, transparent 45.6vmin, #000 46vmin); }
#ui .tg-scope.on { display: block; animation: tg-scope-in .18s ease-out backwards; }
#ui .tg-scope-lens, #ui .tg-ret { position: absolute; left: 50%; top: 50%; width: 92vmin; height: 92vmin; margin: -46vmin 0 0 -46vmin; border-radius: 50%; }
#ui .tg-scope-lens { box-shadow: inset 0 0 5vmin 1.5vmin rgba(0,0,0,.85); background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.07), transparent 32%), radial-gradient(circle, rgba(40,70,90,.06), rgba(0,10,20,.22)); }
#ui .tg-scope-info { position: absolute; left: 50%; top: calc(50% + 36vmin); transform: translateX(-50%); display: flex; align-items: center; gap: .7em; font: 700 .72em var(--f-mono); letter-spacing: .2em; color: rgba(255,255,255,.75); }
#ui .tg-scope-info i { width: .3em; height: .3em; background: #ff2a3a; border-radius: 50%; }
#ui .tg-hud.scoped .tg-xh, #ui .tg-hud.scoped .tg-hint, #ui .tg-hud.scoped .tg-objm { display: none; }
#ui .tg-hud.scoped .tg-wbox, #ui .tg-hud.scoped .tg-health { opacity: .32; }
#ui .tg-wbox, #ui .tg-health { transition: opacity .25s; }

/* crosshair, hint, hitmarker, damage indicators */
#ui .tg-xh { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --g: 6px; transition: opacity .15s; }
#ui .tg-xh i { position: absolute; display: block; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
#ui .tg-xh .t, #ui .tg-xh .b { left: -1px; top: 0; width: 2px; height: .8em; }
#ui .tg-xh .l, #ui .tg-xh .r { top: -1px; left: 0; height: 2px; width: .8em; }
#ui .tg-xh .t { transform: translateY(calc(-100% - var(--g))); }
#ui .tg-xh .b { transform: translateY(var(--g)); }
#ui .tg-xh .l { transform: translateX(calc(-100% - var(--g))); }
#ui .tg-xh .r { transform: translateX(var(--g)); }
#ui .tg-xh b { position: absolute; left: -1.5px; top: -1.5px; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
#ui .tg-hint { position: absolute; left: 50%; top: calc(50% + 3.4em); transform: translateX(-50%); opacity: 0; padding: .25em .7em; background: rgba(0,0,0,.45); font: condensed 700 .9em var(--f-cond); letter-spacing: .24em; text-transform: uppercase; color: var(--warn); white-space: nowrap; transition: opacity .2s; }
#ui .tg-hint.on { opacity: 1; animation: tg-blink 1.2s ease-in-out infinite; }
#ui .tg-hit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; --hg: .55em; --hl: .8em; --hc: #fff; --hw: 2px; }
#ui .tg-hit i { position: absolute; left: 0; top: 0; display: block; width: var(--hl); height: var(--hw); background: var(--hc); transform-origin: 0 50%; box-shadow: 0 0 2px rgba(0,0,0,.7); }
#ui .tg-hit i:nth-child(1) { transform: rotate(45deg) translate(var(--hg), -50%); }
#ui .tg-hit i:nth-child(2) { transform: rotate(135deg) translate(var(--hg), -50%); }
#ui .tg-hit i:nth-child(3) { transform: rotate(225deg) translate(var(--hg), -50%); }
#ui .tg-hit i:nth-child(4) { transform: rotate(315deg) translate(var(--hg), -50%); }
#ui .tg-hit.k-head { --hc: #ffcf3a; --hl: 1em; --hw: 2.5px; }
#ui .tg-hit.k-kill { --hc: #ff3b4e; --hl: 1.25em; --hg: .7em; --hw: 3px; }
#ui .tg-dmgs { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#ui .tg-dmg { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
#ui .tg-dmg svg { position: absolute; left: -8em; top: calc(-1 * min(30vh, 17em)); width: 16em; height: 3.2em; fill: rgba(255,36,52,.88); filter: drop-shadow(0 0 .5em rgba(255,0,24,.85)); }

/* objective marker */
#ui .tg-objm { position: absolute; left: 0; top: 0; display: none; will-change: transform; }
#ui .tg-objm.on { display: block; }
#ui .tg-objm-in { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: .15em; color: var(--gold); }
#ui .tg-objm-ico .tg-ic { width: 1.6em; height: 1.6em; filter: drop-shadow(0 0 .35em rgba(242,193,78,.7)); animation: tg-bob 1.6s ease-in-out infinite; }
#ui .tg-objm-d { font: 700 .78em var(--f-mono); color: #fff; padding: .05em .45em; background: rgba(0,0,0,.45); }
#ui .tg-objm-arr { position: absolute; left: -.5em; top: -.5em; width: 1em; height: 1em; display: none; }
#ui .tg-objm.edge .tg-objm-arr { display: block; }
#ui .tg-objm-arr::after { content: ''; position: absolute; left: 1.6em; top: .1em; border-left: .7em solid var(--gold); border-top: .4em solid transparent; border-bottom: .4em solid transparent; }

/* top-left: stage / objective / remaining */
#ui .tg-tl { position: absolute; left: var(--ex); top: var(--ey); width: min(26em, 30vw); }
#ui .tg-stg { display: flex; align-items: baseline; flex-wrap: wrap; gap: .45em; font-family: var(--f-cond); }

  // smooth random modulation signal in [-depth, depth]; connect the returned gain to an AudioParam
  function rlfo(v, rate, depth, t, t1) {
    const s = ctx.createBufferSource(); s.buffer = RBUF; s.loop = true;

  // formant voice (trolls, soldier grunts). q: { f0:[[time,hz]...], vow:[[time,vowel]...], size, breath, drive, a, r, peak,
  //   wob:[rate, depthFrac], rough:[rate, depth], sub, det, jit, body }
  const VOW = { a: [730, 1090, 2440], o: [570, 840, 2410], u: [440, 1020, 2240], uh: [640, 1190, 2390], e: [530, 1840, 2480], oo: [300, 870, 2240], i: [390, 1990, 2550] };
  function vox(v, dest, t, dur, q) {
    const end = t + dur, stop = end + 0.06, size = q.size || 1, f0 = q.f0[0][1];
    const s1 = v.osc('sawtooth', f0, t, stop), s2 = v.osc('sawtooth', f0, t, stop);
    s2.detune.value = q.det == null ? 12 : q.det;
    for (let k = 1; k < q.f0.length; k++) { xp(s1.frequency, q.f0[k][1], t + q.f0[k][0]); xp(s2.frequency, q.f0[k][1], t + q.f0[k][0]); }
    const mix = v.g(1); s1.connect(mix); const g2 = v.g(0.55); s2.connect(g2); g2.connect(mix);
    if (q.wob) { const w = lfo(v, 'sine', q.wob[0], f0 * q.wob[1], t, stop); w.connect(s1.frequency); w.connect(s2.frequency); }
    const j = rlfo(v, q.jit || 10, f0 * 0.035, t, stop); j.connect(s1.frequency); j.connect(s2.frequency);
    if (q.breath) { const n = v.noise('pink', t, stop); const bg = v.g(q.breath); n.connect(bg); bg.connect(mix); }
    let pre = mix;
    if (q.drive) {
      const sh = v.sh(q.drive > 1 ? CURVE.hard : CURVE.soft), dg = v.g(q.drive > 1 ? 1.4 : 1);
      mix.connect(dg); dg.connect(sh); pre = sh;
    }
    const am = v.g(1), amp = v.g(0);
    const FG = [4.5, 3.5, 2.2], FQ = [6, 8, 10], vw = q.vow;
    for (let k = 0; k < 3; k++) {
      const bp = v.f('bandpass', VOW[vw[0][1]][k] * size, FQ[k]);
      at(bp.frequency, VOW[vw[0][1]][k] * size, t);
      for (let m = 1; m < vw.length; m++) lin(bp.frequency, VOW[vw[m][1]][k] * size, t + vw[m][0]);
      const fg = v.g(FG[k]); pre.connect(bp); bp.connect(fg); fg.connect(am);
    }
    const body = v.f('lowpass', 260 * size, 0.7), bgn = v.g(q.body == null ? 0.35 : q.body);
    pre.connect(body); body.connect(bgn); bgn.connect(am);
    if (q.rough) {   // vocal-fry rattle (amplitude modulation)
      am.gain.value = 1 - q.rough[1] * 0.5;
      lfo(v, 'sine', q.rough[0], q.rough[1] * 0.5, t, stop).connect(am.gain);
    }
    am.connect(amp);
    if (q.sub) {
      const sb = v.osc('triangle', f0 * 0.5, t, stop);
      for (let k = 1; k < q.f0.length; k++) xp(sb.frequency, q.f0[k][1] * 0.5, t + q.f0[k][0]);
      const sg = v.g(q.sub); sb.connect(sg); sg.connect(amp);
    }
    amp.connect(dest);
    const a = Math.min(q.a || 0.05, dur * 0.4), r = q.r || 0.2, pk = q.peak || 0.6;
    at(amp.gain, 0, t); lin(amp.gain, pk, t + a); at(amp.gain, pk, Math.max(t + a, end - r)); xp(amp.gain, E, end);
  }

  // ------------------------------------------------------------------ one-shot playback (positional, polyphony)
  function playImpl(name, opt) {
    const d = SFX[name];
    if (!d) return null;
    if (softPaused && d.bus !== 'ui') return null;
    const now = ctx.currentTime;
    const lp = lastPlay[name];
    if (lp !== undefined && now - lp < d.gap && now >= lp) return null;
    let volume = num(opt && opt.volume, 0, 4, 1) * d.vol;
    if (volume <= 0.0005) return null;
    const pitch = num(opt && opt.pitch, 0.25, 4, 1) * (1 + (Math.random() * 2 - 1) * d.var);
    let pan = 0, lpf = 0, send = d.rev;
    const pos = opt && opt.pos;
    if (pos && pos.length >= 3 && Number.isFinite(pos[0]) && Number.isFinite(pos[2])) {
      const dx = pos[0] - L.x, dy = (Number.isFinite(pos[1]) ? pos[1] : L.y) - L.y, dz = pos[2] - L.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz), ref = d.ref;
      if (dist > ref * 50) return null;
      volume *= dist <= ref ? 1 : ref / dist;               // inverse-distance rolloff
      if (volume < 0.002) return null;
      const hd = Math.sqrt(dx * dx + dz * dz);
      if (hd > 0.05) {
        const s = Math.sin(L.yaw), c = Math.cos(L.yaw);
        const side = (dx * c - dz * s) / hd;                // right vector = [cos yaw, 0, -sin yaw]
        const front = (-dx * s - dz * c) / hd;              // forward = [-sin yaw, 0, -cos yaw]
        pan = side * Math.min(1, hd / 2.5) * 0.9;
        const behind = front < 0 ? -front : 0;
        lpf = 20000 / Math.pow(1 + dist / 35, 1.15) * (1 - 0.4 * behind);
        if (lpf < 600) lpf = 600;
      }
      send = Math.min(0.9, send + Math.min(0.35, dist / 120));
    }
    // polyphony: per-name cap (steal oldest of same name) and global cap (steal oldest lowest-priority)
    let same = 0, oldest = null, live = 0, victim = null;
    for (let i = 0; i < active.length; i++) {
      const a = active[i];
      if (a.dead) continue;
      live++;
      if (a.name === name) { same++; if (!oldest || a.t0 < oldest.t0) oldest = a; }
      if (a.prio <= d.prio && (!victim || a.prio < victim.prio || (a.prio === victim.prio && a.t0 < victim.t0))) victim = a;
    }
    if (same >= d.max && oldest) oldest.kill();
    else if (live >= MAXV) { if (!victim) return null; victim.kill(); }
    lastPlay[name] = now;

    const v = new Voice();
    v.name = name; v.prio = d.prio; v.reg = true;
    v.out.gain.value = volume;
    let node = v.out;
    if (lpf && lpf < 18000) { const f = v.f('lowpass', lpf, 0.6); node.connect(f); node = f; }
    if (pan) { const pn = v.pan(pan); node.connect(pn); node = pn; }
    const bus = d.bus === 'ui' ? uiBus : d.bus === 'voice' ? voiceBus : sfxBus;
    node.connect(bus);
    if (send > 0.001 && d.bus !== 'voice') { const sg = v.g(send); node.connect(sg); sg.connect(d.bus === 'ui' ? uiSend : sfxSend); }
    active.push(v);
    try { d.fn(v, now + 0.004, pitch, opt || {}); } catch (e) { report(e); }
    v.done();
    return v;
  }

  // ------------------------------------------------------------------ sustained loops
  const LOOPS = {
    flame_loop: function (level) {
      const t = ctx.currentTime, v = new Voice();
      v.out.gain.value = level * 0.5; v.out.connect(sfxBus);
      const sd = v.g(0.2); v.out.connect(sd); sd.connect(sfxSend);
      const env = v.g(0); env.connect(v.out); at(env.gain, 0, t); env.gain.setTargetAtTime(1, t, 0.05);
      const fl = v.g(0.85); fl.connect(env);                                    // flutter
      rlfo(v, 16, 0.22, t, null).connect(fl.gain); rlfo(v, 3, 0.12, t, null).connect(fl.gain);
      const r = v.noise('brown', t, null), rf = v.f('lowpass', 650, 0.8), rg = v.g(1.0);   // roar
      r.connect(rf); rf.connect(rg); rg.connect(fl); rlfo(v, 2.2, 220, t, null).connect(rf.frequency);
      const b = v.noise('pink', t, null), bf = v.f('bandpass', 330, 0.9), bg = v.g(0.9);   // body

      let d = 'M0 60 L0 ' + base.toFixed(1);
      for (let i = 0; i <= n; i++) {

    };

  // ================================================================== build
  function q(sel, host) { return (host || root).querySelector(sel); }

  function mkBtn(label, opts) {
    opts = opts || {};
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tg-btn' + (opts.cls ? ' ' + opts.cls : '');
    b.innerHTML = (opts.icon ? icon(opts.icon, 'tg-btn-i') : '') + '<span class="tg-btn-l">' + esc(label) + '</span>' +
      (opts.hint ? '<span class="tg-btn-h">' + esc(opts.hint) + '</span>' : '');
    b.addEventListener('mousedown', (e) => e.preventDefault()); // never keep focus (Space would re-click it in game)
    b.addEventListener('mouseenter', () => { if (!b.disabled) sfx('ui_hover'); });
    b.addEventListener('click', (e) => {
      if (b.disabled) return;
      sfx(opts.sound || 'ui_click');
      try { b.blur(); if (opts.onClick) opts.onClick(e); } catch (err) { console.error('[UI]', err); }
    });
    if (opts.host) opts.host.appendChild(b);
    return b;
  }
  function setBtnLabel(b, label) { const l = b && b.querySelector('.tg-btn-l'); if (l) l.textContent = label; }

  function build() {
    if (built) return true;
    if (buildTried || typeof document === 'undefined') return false;
    buildTried = true;
    root = document.getElementById('ui');
    if (!root) {
      root = document.createElement('div');
      root.id = 'ui';
      (document.body || document.documentElement).appendChild(root);
    }
    root.classList.add('tg-root');
    root.innerHTML = hudHTML() + screensHTML() + overlaysHTML();

    // ---- HUD refs
    $.hud = q('.tg-hud');
    $.fxLow = q('.tg-fx-lowhp'); $.fxHurt = q('.tg-fx-hurt'); $.fxFocus = q('.tg-fx-focus'); $.fxDbg = q('.tg-fx-dbg');
    $.scope = q('.tg-scope');
    $.objm = q('.tg-objm'); $.objmD = q('.tg-objm-d'); $.objmArr = q('.tg-objm-arr');
    $.xh = q('.tg-xh'); $.hint = q('.tg-hint'); $.hit = q('.tg-hit');
    $.dmg = Array.prototype.slice.call(root.querySelectorAll('.tg-dmg'));
    $.stgLvl = q('.tg-stg-lvl'); $.stgN = q('.tg-stg-n'); $.stgNm = q('.tg-stg-nm'); $.stg = q('.tg-stg');
    $.pips = Array.prototype.slice.call(root.querySelectorAll('.tg-pips i'));
    $.obj = q('.tg-obj'); $.objT = q('.tg-obj-t');
    $.left = q('.tg-left'); $.leftN = q('.tg-left b');
    $.cmpStrip = q('.tg-cmp-strip'); $.cmpObj = q('.tg-cmp-obj'); $.cmpHdg = q('.tg-cmp-hdg');
    $.boss = q('.tg-boss'); $.bossNm = q('.tg-boss-nm'); $.bossTt = q('.tg-boss-tt');
    $.bossF = q('.tg-boss-bar .f'); $.bossG = q('.tg-boss-bar .g');
    $.fps = q('.tg-fps');
    $.radar = q('.tg-radar'); $.radarCv = q('.tg-radar canvas');
    $.score = q('.tg-sc-v'); $.kills = q('.tg-kl-v'); $.combo = q('.tg-combo'); $.comboV = q('.tg-combo b');
    $.kf = q('.tg-kf');
    $.health = q('.tg-health'); $.hpEmb = q('.tg-hp-emb'); $.hpCn = q('.tg-hp-cn'); $.hpMax = q('.tg-hp-max');
    $.hpNum = q('.tg-hp-num'); $.hpF = q('.tg-hp-bar .f'); $.hpG = q('.tg-hp-bar .g');
    $.st = q('.tg-st'); $.stF = q('.tg-st-bar span');
    $.abil = q('.tg-abil'); $.abNm = q('.tg-abil-nm'); $.abTile = q('.tg-abil-tile'); $.abIco = q('.tg-abil-ico'); $.abCd = q('.tg-abil-cd');
    $.wpn = q('.tg-wpn'); $.wKind = q('.tg-wpn-kind'); $.wName = q('.tg-wpn-nm');
    $.ammo = q('.tg-ammo'); $.mag = q('.tg-mag'); $.res = q('.tg-res'); $.rlPct = q('.tg-rl b'); $.magF = q('.tg-magbar span');
    $.slots = Array.prototype.slice.call(root.querySelectorAll('.tg-slot')).map((el) => ({ el: el, ic: q('.tg-slot-ic', el), a: q('.tg-slot-a', el) }));
    // ---- overlays
    $.banner = q('.tg-banner'); $.bnKick = q('.tg-bn-kick'); $.bnTitle = q('.tg-bn-title'); $.bnSub = q('.tg-bn-sub');
    $.flash = q('.tg-flash'); $.radio = q('.tg-radio');
    $.loading = q('.tg-loading'); $.ldText = q('.tg-ld-t span'); $.ldTip = q('.tg-ld-tip');
    // ---- screens
    $.screens = {};
    root.querySelectorAll('.tg-screen').forEach((s) => { $.screens[s.getAttribute('data-s')] = s; });

    buildCompass();
    buildTitle();
    buildBranch();
    buildMissionShell();
    buildSettings();
    buildPause();
    buildEndScreens();

    // ---- global listeners
    window.addEventListener('resize', () => { sizeDirty = true; });
    window.addEventListener('pointerdown', onFirstGesture, true);
    window.addEventListener('keydown', onFirstGesture, true);
    window.addEventListener('keydown', onMenuKey);
    root.addEventListener('pointerdown', onFirstGesture, true);

    built = true;
    return true;
  }
  function ensure() {
    if (!built) { try { build(); } catch (e) { console.error('[UI] build failed', e); } }
    return built;
  }

  function onFirstGesture() {
    if (audioInited) return;
    audioInited = true;
    window.removeEventListener('pointerdown', onFirstGesture, true);
    window.removeEventListener('keydown', onFirstGesture, true);
    if (root) root.removeEventListener('pointerdown', onFirstGesture, true);
    try {
      const A = TG.Audio;
      if (A && typeof A.init === 'function') {
        A.init();
        const s = settings();
        if (typeof A.setVolume === 'function') A.setVolume(num(s.volume, DEFAULTS.volume));
        if (typeof A.setMusicVolume === 'function') A.setMusicVolume(num(s.music, DEFAULTS.music));
        if (gstate() === 'menu' && typeof A.music === 'function') A.music('menu');
      }
    } catch (e) { /* audio optional */ }
  }

  function onMenuKey(e) {
    if (e.code !== 'Escape' && e.key !== 'Escape') return;
    const st = gstate();
    if (st && st !== 'menu') return;
    if (curScreen === 'branch') { sfx('ui_click'); showScreen('title'); }
    else if (curScreen === 'mission') { sfx('ui_click'); openBranch(); }
    else if (curScreen === 'settings' && settingsReturn === 'title') { sfx('ui_click'); showScreen('title'); }
  }

  function showScreen(name) {
    for (const k in $.screens) $.screens[k].classList.toggle('on', k === name);
    curScreen = name || null;
    root.classList.toggle('tg-modal', !!name);
    const ae = document.activeElement;
    if (ae && ae !== document.body && root.contains(ae) && typeof ae.blur === 'function') ae.blur();
  }
  function setHud(on) {
    hudOn = !!on;
    $.hud.classList.toggle('on', hudOn);
    if (hudOn) { resetCache(); sizeDirty = true; hpGhost = -1; lastHpF = -1; }
  }

  // ---------------------------------------------------------------- compass
  function buildCompass() {
    const names = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
    let s = '';
    for (let d = -90; d <= 450; d += 5) {
      const n = ((d % 360) + 360) % 360;
      const left = ((d + 90) / 540 * 100).toFixed(3);
      if (n % 45 === 0) s += '<i class="tg-cmp-t c' + (n === 0 ? ' n' : '') + '" style="left:' + left + '%"><b>' + names[n] + '</b></i>';
      else if (n % 15 === 0) s += '<i class="tg-cmp-t m" style="left:' + left + '%"><b>' + pad3(n) + '</b></i>';
      else s += '<i class="tg-cmp-t" style="left:' + left + '%"></i>';
    }
    $.cmpStrip.innerHTML = s;
  }

  // ---------------------------------------------------------------- title
  function buildTitle() {
    const host = q('.tg-title-btns', $.screens.title);
    mkBtn('Play', { host: host, cls: 'primary big', icon: 'play', hint: 'Deploy', onClick: openBranch });
    mkBtn('Controls & Settings', { host: host, icon: 'gear', onClick: () => openSettings('title') });
  }

  // ---------------------------------------------------------------- branch select
  function buildBranch() {
    const scr = $.screens.branch;
    const host = q('.tg-cards6', scr);
    const classes = Array.isArray(data().classes) ? data().classes : NO_LIST;
    let maxHp = 100;
    classes.forEach((c) => { maxHp = Math.max(maxHp, num(c && c.hp, 100)); });
    classes.forEach((c, i) => {
      if (!c) return;
      const ab = c.ability || EMPTY;
      const card = document.createElement('div');
      card.className = 'tg-ccard';
      card.setAttribute('style', accent(c.uiColor).vars + ';--i:' + i);
      card.setAttribute('data-id', c.id);
      const hp = num(c.hp, 100);
      card.innerHTML =
        '<div class="tg-cc-wm">' + emblem(c.id) + '</div>' +
        '<div class="tg-sel-badge">' + icon('check') + '</div>' +
        '<div class="tg-cc-top"><div class="tg-cc-emb">' + emblem(c.id) + '</div>' +
          '<div class="tg-cc-names"><div class="tg-cc-no">' + esc(c.name) + '</div><div class="tg-cc-en">' + esc(c.en) + '</div></div>' +
          '<div class="tg-cc-idx">0' + (i + 1) + '</div></div>' +
        '<div class="tg-cc-motto">' + esc(c.motto) + '</div>' +
        '<div class="tg-cc-desc">' + esc(c.desc) + '</div>' +
        '<ul class="tg-cc-perks">' + (Array.isArray(c.perkText) ? c.perkText : NO_LIST).map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul>' +
        '<div class="tg-cc-hp"><span class="l">Health</span><div class="tg-cc-hpbar"><i style="width:' + (hp / maxHp * 100).toFixed(1) + '%"></i></div><b>' + hp + '</b></div>' +
        '<div class="tg-cc-ab"><div class="tg-cc-abi">' + abilIcon(ab.id) + '<kbd>Q</kbd></div>' +
          '<div class="tg-cc-abt"><b>' + esc(ab.name || 'Ability') + '</b><span>' + esc(ab.desc || '') + '</span></div>' +
          '<div class="tg-cc-abcd"><b>' + num(ab.cooldown, 0) + '<small>s</small></b><span>Cooldown</span></div></div>';
      card.addEventListener('mouseenter', () => sfx('ui_hover'));
      card.addEventListener('click', () => { if (selClass !== c.id) sfx('ui_click'); selectClass(c.id); });
      card.addEventListener('dblclick', () => { selectClass(c.id); openMission(); });
      host.appendChild(card);
    });
    $.brInfo = q('.tg-mf-info', scr);
    mkBtn('Back', { host: q('.tg-mf-l', scr), icon: 'back', cls: 'ghost', onClick: () => showScreen('title') });
    $.brConfirm = mkBtn('Confirm', { host: q('.tg-mf-r', scr), icon: 'next', cls: 'primary', hint: 'Mission', onClick: openMission });
  }
  function selectClass(id) {
    const c = classById(id);
    selClass = c ? c.id : null;
    const cards = $.screens.branch.querySelectorAll('.tg-ccard');
    cards.forEach((el) => el.classList.toggle('sel', el.getAttribute('data-id') === selClass));
    $.screens.branch.classList.toggle('has-sel', !!selClass);
    $.brConfirm.disabled = !selClass;
    if (c) {
      $.brInfo.innerHTML = '<span class="tg-chip" style="' + accent(c.uiColor).vars + '">' + emblem(c.id) +
        '<span><b>' + esc(c.name) + '</b><em>' + esc(c.en) + ' · ' + esc((c.ability && c.ability.name) || '') + '</em></span></span>';
    } else {
      $.brInfo.innerHTML = '<span class="tg-mf-hint">Choose a branch of the armed forces to continue</span>';
    }
  }
  function openBranch() {
    selectClass(selClass);
    showScreen('branch');
  }

  // ---------------------------------------------------------------- mission select
  function buildMissionShell() {
    const scr = $.screens.mission;
    $.msInfo = q('.tg-mf-info', scr);
    mkBtn('Back', { host: q('.tg-mf-l', scr), icon: 'back', cls: 'ghost', onClick: openBranch });
    $.msDeploy = mkBtn('Deploy', { host: q('.tg-mf-r', scr), icon: 'play', cls: 'primary', sound: 'ui_start', onClick: deploy });
  }
  function buildMission() {
    const scr = $.screens.mission;
    const host = q('.tg-cards3', scr);
    const levels = Array.isArray(data().levels) ? data().levels : NO_LIST;
    const unlocked = Math.min(progressUnlocked(), Math.max(0, levels.length - 1));
    if (selLevel < 0 || selLevel > unlocked) selLevel = unlocked;
    host.innerHTML = '';
    levels.forEach((lv, i) => {
      if (!lv) return;
      const locked = i > unlocked;
      const card = document.createElement('div');
      card.className = 'tg-lcard' + (locked ? ' locked' : '');
      card.setAttribute('style', '--i:' + i);
      const stages = Array.isArray(lv.stages) ? lv.stages : NO_LIST;
      const rows = stages.map((s, k) => {
        const b = (s && s.boss) || EMPTY;
        return '<li class="' + (b.big ? 'big' : '') + '"><span class="k">' + (k + 1) + '</span><span class="s">' + esc(s && s.name) + '</span>' +
          '<span class="b">' + icon(b.big ? 'crown' : 'troll') + '<span>' + esc(b.name || '') + '</span>' + (b.big ? '<em>Boss</em>' : '') + '</span></li>';
      }).join('');
      const prev = levels[i - 1];
      card.innerHTML =
        '<div class="tg-lc-art th-' + esc(lv.theme) + '">' + levelArt(lv, i) + '<div class="tg-lc-fade"></div>' +
          '<div class="tg-lc-num">0' + (i + 1) + '</div><div class="tg-lc-op">' + esc(lv.tagline) + '</div></div>' +
        '<div class="tg-lc-body"><div class="tg-lc-name">' + esc(lv.name) + '</div>' +
          '<div class="tg-lc-brief">' + esc(lv.brief) + '</div>' +
          '<div class="tg-lc-sh">Stages · bosses</div><ol class="tg-lc-stages">' + rows + '</ol></div>' +
        '<div class="tg-lc-lock">' + icon('lock') + '<b>Locked</b><span>Complete ' + esc(prev ? prev.name : 'the previous operation') + ' to unlock</span></div>' +
        '<div class="tg-sel-badge">' + icon('check') + '</div>';
      card.addEventListener('mouseenter', () => { if (!locked) sfx('ui_hover'); });
      card.addEventListener('click', () => {
        if (locked) {
          animate(card, [{ transform: 'translateX(0)' }, { transform: 'translateX(-.4em)' }, { transform: 'translateX(.4em)' }, { transform: 'translateX(0)' }], { duration: 260 });
          return;
        }
        if (selLevel !== i) sfx('ui_click');
        selLevel = i;
        refreshMission();
      });
      card.addEventListener('dblclick', () => { if (!locked) { selLevel = i; refreshMission(); deploy(); } });
      host.appendChild(card);
    });
    refreshMission();
  }
  function refreshMission() {
    const scr = $.screens.mission;
    const cards = scr.querySelectorAll('.tg-lcard');
    cards.forEach((el, i) => el.classList.toggle('sel', i === selLevel));
    const lv = (data().levels || NO_LIST)[selLevel];
    const c = classById(selClass);
    $.msDeploy.disabled = !c || !lv || selLevel > progressUnlocked();
    setBtnLabel($.msDeploy, lv ? 'Deploy · ' + lv.name : 'Deploy');
    $.msInfo.innerHTML = c ? '<span class="tg-chip" style="' + accent(c.uiColor).vars + '">' + emblem(c.id) +
      '<span><b>' + esc(c.name) + '</b><em>' + esc(c.en) + '</em></span></span>' : '';
  }
  function openMission() {
    if (!selClass) return;
    buildMission();
    showScreen('mission');
  }
  function deploy() {
    if (!selClass || selLevel < 0 || selLevel > progressUnlocked()) return;
    call('start', selClass, selLevel);
    if (gstate() === 'playing' && curScreen === 'mission') UI.showHUD();
  }

  // ---------------------------------------------------------------- settings
  const sliders = {};
  let qualBtns = [];
  const QUALITY = [
    ['low', 'Low', 'Reduced resolution, smaller shadows, no bloom. For older laptops.'],
    ['medium', 'Medium', 'Balanced image quality and performance.'],
    ['high', 'High', 'Full resolution, soft shadows and bloom.'],
  ];
  function mkSlider(host, key, label, min, max, step, fmt) {
    host.innerHTML = '<div class="tg-sl-top"><label>' + esc(label) + '</label><output></output></div>' +
      '<input class="tg-range" type="range" min="' + min + '" max="' + max + '" step="' + step + '">';
    const inp = q('input', host), out = q('output', host);
    const paint = () => {
      const v = parseFloat(inp.value);
      out.textContent = fmt(v);
      inp.style.setProperty('--p', ((v - min) / (max - min) * 100).toFixed(2) + '%');
    };
    inp.addEventListener('input', () => {
      const s = settings();
      const v = parseFloat(inp.value);
      s[key] = v;
      paint();
      try { // live audio preview without reapplying graphics on every tick
        const A = TG.Audio;
        if (A && key === 'volume' && typeof A.setVolume === 'function') A.setVolume(v);
        if (A && key === 'music' && typeof A.setMusicVolume === 'function') A.setMusicVolume(v);
      } catch (e) { /* ignore */ }
    });
    inp.addEventListener('change', () => { sfx('ui_click'); call('applySettings'); });
    sliders[key] = { inp: inp, paint: paint, min: min, max: max };
  }
  function buildSettings() {
    const scr = $.screens.settings;
    const sl = (k) => q('.tg-sl[data-k="' + k + '"]', scr);
    mkSlider(sl('sensitivity'), 'sensitivity', 'Mouse sensitivity', 0.2, 3, 0.05, (v) => v.toFixed(2) + '×');
    mkSlider(sl('volume'), 'volume', 'Master volume', 0, 1, 0.01, (v) => Math.round(v * 100) + '%');
    mkSlider(sl('music'), 'music', 'Music volume', 0, 1, 0.01, (v) => Math.round(v * 100) + '%');
    const seg = q('.tg-seg', scr);
    qualBtns = QUALITY.map((qd) => {
      const b = mkBtn(qd[1], { host: seg, cls: 'seg', onClick: () => { settings().quality = qd[0]; syncQuality(); call('applySettings'); } });
      b.setAttribute('data-q', qd[0]);
      return b;
    });
    $.qOut = q('.tg-q-out', scr); $.qHint = q('.tg-q-hint', scr);
    mkBtn('Reset defaults', { host: q('.tg-pf-l', scr), icon: 'restart', cls: 'ghost small', onClick: () => {
      Object.assign(settings(), DEFAULTS);
      syncSettings();
      call('applySettings');
    } });
    mkBtn('Back', { host: q('.tg-pf-r', scr), icon: 'back', cls: 'primary', onClick: closeSettings });
  }
  function syncQuality() {
    const qv = String(settings().quality || 'high');
    let found = QUALITY[2];
    QUALITY.forEach((qd) => { if (qd[0] === qv) found = qd; });
    qualBtns.forEach((b) => b.classList.toggle('on', b.getAttribute('data-q') === found[0]));
    $.qOut.textContent = found[1];
    $.qHint.textContent = found[2];
  }
  function syncSettings() {
    const s = settings();
    for (const k in sliders) {
      const o = sliders[k];
      const v = U.clamp(num(s[k], DEFAULTS[k]), o.min, o.max);
      o.inp.value = String(v);
      o.paint();
    }
    syncQuality();
  }
  function openSettings(from) {
    settingsReturn = from === 'pause' ? 'pause' : 'title';
    syncSettings();
    showScreen('settings');
  }
  function closeSettings() {
    if (settingsReturn === 'pause') { fillPause(); showScreen('pause'); }
    else showScreen('title');
  }

  // ---------------------------------------------------------------- pause
  function buildPause() {
    const scr = $.screens.pause;
    const host = q('.tg-col-btns', scr);
    $.pauseInfo = q('.tg-pause-info', scr);
    mkBtn('Resume', { host: host, cls: 'primary', icon: 'play', onClick: () => {
      call('resume');
      if (gstate() !== 'paused') UI.hidePause();
    } });
    mkBtn('Restart stage', { host: host, icon: 'restart', onClick: () => {
      call('restartStage');
      if (gstate() === 'playing') UI.showHUD();
    } });
    mkBtn('Controls & Settings', { host: host, icon: 'gear', onClick: () => openSettings('pause') });
    $.quitBtn = mkBtn('Quit to menu', { host: host, icon: 'exit', cls: 'danger', onClick: () => {
      if (!quitArmed) {
        quitArmed = 1;
        setBtnLabel($.quitBtn, 'Confirm quit?');
        $.quitBtn.classList.add('armed');
        clearTimeout(quitTimer);
        quitTimer = setTimeout(disarmQuit, 3000);
        return;
      }
      disarmQuit();
      quitToMenu();
    } });
  }
  function disarmQuit() {
    quitArmed = 0;
    clearTimeout(quitTimer);
    if ($.quitBtn) { setBtnLabel($.quitBtn, 'Quit to menu'); $.quitBtn.classList.remove('armed'); }
  }

  function countUp(node, to, fmt, delay) {
    const dur = 1100;
    const start = nowMs() + (delay || 0);
    node.textContent = fmt(0);
    const step = () => {
      const k = clamp01((nowMs() - start) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      node.textContent = fmt(to * e);
      if (k < 1 && node.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function fillStats(host, stats) {
    const s = stats || EMPTY;
    let acc = Math.max(0, num(s.accuracy, 0));
    if (acc <= 1) acc *= 100;
    acc = Math.min(100, acc);
    const items = [
      ['Score', Math.max(0, num(s.score, 0)), fmtInt],
      ['Kills', Math.max(0, num(s.kills, 0)), fmtInt],
      ['Headshots', Math.max(0, num(s.headshots, 0)), fmtInt],
      ['Accuracy', acc, (v) => Math.round(v) + '%'],
      ['Time', Math.max(0, num(s.time, 0)), fmtTime],
    ];
    host.innerHTML = items.map((it, i) => '<div class="tg-stat" style="--i:' + i + '"><div class="v"></div><div class="l">' + it[0] + '</div></div>').join('');
    const vs = host.querySelectorAll('.v');
    items.forEach((it, i) => countUp(vs[i], it[1], it[2], 350 + i * 120));
  }
  function confetti(host) {
    const cols = ['#BA0C2F', '#ffffff', '#1d4fa3', '#BA0C2F', '#ffffff', '#f2c14e'];
    let s = '';
    for (let i = 0; i < 72; i++) {
      s += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;--d:' + (-Math.random() * 8).toFixed(2) + 's;--t:' + (5 + Math.random() * 4).toFixed(2) +
        's;--r:' + ((Math.random() * 1080 - 540) | 0) + 'deg;--w:' + (0.45 + Math.random() * 0.55).toFixed(2) + 'em;--sx:' + ((Math.random() - 0.5) * 18).toFixed(1) +
        'vw;background:' + cols[i % cols.length] + '"></i>';
    }
    host.innerHTML = s;
  }

  function dropMsg(m, fast) {
    if (!m || m.dead) return;
    m.dead = true;
    if (m.iv) clearInterval(m.iv);
    m.timers.forEach((t) => clearTimeout(t));
    const i = radioMsgs.indexOf(m);

    m.node.classList.remove('tx');

    m.node.classList.add('out');
    setTimeout(() => { if (m.node.parentNode) m.node.parentNode.removeChild(m.node); }, fast ? 260 : 700);

  UI.radio = function (sender, text) {
    if (!ensure()) return;
    const msg = String(text == null ? '' : text).trim();
    if (!msg) return;
    const D = data();
    const who = String(sender == null || sender === '' ? (D.leader || 'HQ') : sender);
    const isLeader = !!D.leader && who.toUpperCase() === String(D.leader).toUpperCase();
    while (radioMsgs.length >= 3) dropMsg(radioMsgs[0], true);
    let bars = '';
    for (let i = 0; i < 14; i++) {
      bars += '<i style="--d:' + (0.28 + Math.random() * 0.4).toFixed(2) + 's;--o:' + (-Math.random() * 0.6).toFixed(2) + 's"></i>';
    }
    const node = document.createElement('div');
    node.className = 'tg-rmsg tx';
    node.innerHTML =
      '<div class="tg-rm-pic">' + (isLeader ? PORTRAIT : icon('radio')) + '<i class="tg-rm-sig"></i></div>' +
      '<div class="tg-rm-body"><div class="tg-rm-hd"><span class="tg-rm-tag">' + esc(who) + '</span>' +
        '<span class="tg-rm-ch">Platoon net · CH 2</span><span class="tg-rm-live">TX</span><span class="tg-wave">' + bars + '</span></div>' +
        '<div class="tg-rm-txt"><span class="v"></span><i class="tg-caret"></i><span class="h"></span></div></div>';
    const v = q('.v', node), h = q('.h', node);
    h.textContent = msg;
    const m = { node: node, n: 0, iv: 0, timers: [], dead: false };
    const cps = 36;
    m.iv = setInterval(() => {
      m.n = Math.min(msg.length, m.n + (msg.charCodeAt(m.n) === 32 ? 2 : 1));
      v.textContent = msg.slice(0, m.n);
      h.textContent = msg.slice(m.n);
      if (m.n >= msg.length) { clearInterval(m.iv); m.iv = 0; node.classList.add('typed'); }
    }, 1000 / cps);
    const typeMs = (msg.length / cps) * 1000;
    const txMs = Math.max(typeMs + 300, msg.length * 62 + 600); // roughly matches the spoken line
    m.timers.push(setTimeout(() => node.classList.remove('tx'), txMs));
    m.timers.push(setTimeout(() => dropMsg(m, false), Math.max(typeMs + 7000, txMs + 2500)));
    radioMsgs.push(m);
    $.radio.appendChild(node);
  };

  UI.bossBar = function (name, title, frac) {

    boss.frac = f;

  // ================================================================== per-frame HUD
  UI.update = function (dt) {
    if (!ensure()) return;

    catch (e) { if (updErr++ < 3) console.error('[UI] update', e); }

  function measure() {
    fontPx = parseFloat(getComputedStyle(root).fontSize) || 14;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = $.radar.clientWidth;
    if (cw > 0) {
      const px = Math.round(cw * dpr);
      if (px !== radarPx || !radarCtx) {
        radarPx = px;
        $.radarCv.width = px; $.radarCv.height = px;
        radarCtx = $.radarCv.getContext('2d');
        if (radarCtx) {
          const r = px / 2;
          radarBg = radarCtx.createRadialGradient(r, r, 0, r, r, r);
          radarBg.addColorStop(0, 'rgba(18,34,52,0.72)');
          radarBg.addColorStop(1, 'rgba(6,12,22,0.86)');
          radarSweep = null;
          if (typeof radarCtx.createConicGradient === 'function') {
            radarSweep = radarCtx.createConicGradient(-1.0, 0, 0);
            const e = 1.0 / TAU;
            radarSweep.addColorStop(0, 'rgba(120,200,255,0)');
            radarSweep.addColorStop(e, 'rgba(120,200,255,0.26)');
            radarSweep.addColorStop(Math.min(1, e + 0.001), 'rgba(120,200,255,0)');
            radarSweep.addColorStop(1, 'rgba(120,200,255,0)');
          }
          radarFont = '700 ' + Math.round(fontPx * 0.62 * dpr) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        }
      }
      sizeDirty = false;
    }
  }

  function frame(dt) {
    if (sizeDirty) measure();
    const P = TG.Player || null;
    const H = (TG.Game && TG.Game.hud) || EMPTY;
    const t = nowMs() / 1000;
    updClass(P);
    updHealth(P, dt);
    updWeapon(P);
    updAbility(P);
    updCrosshair(P);
    updCompass(P);
    updStage(H);
    updScore(H);
    updObjective(P, H);
    if (hudOn) updRadar(P, H, t);
    fpsT -= dt;
    if (fpsT <= 0) {
      fpsT = 0.5;
      const f = (TG.R && TG.R.stats) ? num(TG.R.stats.fps, 0) : 0;
      setText($.fps, 'fps', f > 0 ? Math.round(f) + ' FPS' : '');
    }
  }

  function updClass(P) {
    const cd = P && P.classDef;
    const id = cd && cd.id ? cd.id : '';
    if (C.cls === id) return;
    C.cls = id;
    if (cd) {
      const a = accent(cd.uiColor);
      accHiRgb = a.hi.join(',');
      $.hud.setAttribute('style', a.vars);
      $.hpEmb.innerHTML = emblem(cd.id);
      $.hpCn.textContent = cd.name || '';
    } else {
      $.hud.removeAttribute('style');
      $.hpEmb.innerHTML = '';
      $.hpCn.textContent = '';
    }
  }

  function updHealth(P, dt) {
    const maxHp = Math.max(1, num(P && P.maxHp, 100));
    const hp = U.clamp(num(P && P.hp, maxHp), 0, maxHp);
    const f = hp / maxHp;
    if (hpGhost < 0) hpGhost = f;
    if (lastHpF >= 0 && f < lastHpF - 1e-4 && hpGhost <= lastHpF + 1e-4) hpGhostHold = 0.5;
    lastHpF = f;
    if (f >= hpGhost) hpGhost = f;
    else if ((hpGhostHold -= dt) <= 0) hpGhost = Math.max(f, hpGhost - dt * 0.7);
    if (C.hpn !== Math.ceil(hp)) { C.hpn = Math.ceil(hp); $.hpNum.textContent = String(C.hpn); }
    if (C.hpm !== Math.round(maxHp)) { C.hpm = Math.round(maxHp); $.hpMax.textContent = 'Health / ' + C.hpm; }
    setScale($.hpF, 'hpf', f);
    setScale($.hpG, 'hpg', hpGhost);
    const low = f <= 0.3;
    setCls($.health, 'hplow', 'low', low);
    const alive = !P || P.alive !== false;
    setCls($.fxLow, 'fxl', 'on', fx.lowhp || (!!P && alive && low && hp > 0));
    const st = clamp01(num(P && P.stamina, 1));
    setScale($.stF, 'stf', st);
    setCls($.st, 'stfull', 'full', st >= 0.995);
    setCls($.st, 'stlow', 'low', st < 0.2);
  }

  function updWeapon(P) {
    const ws = (P && Array.isArray(P.weapons)) ? P.weapons : NO_LIST;
    const wi = Math.floor(num(P && P.weaponIndex, 0));
    const w = ws[wi] || null;
    const def = (w && w.def) || null;
    setText($.wKind, 'wk', def ? String(def.kind || '') : 'No weapon');
    setText($.wName, 'wn', def ? String(def.name || '') : '');
    const mag = w ? Math.max(0, Math.floor(num(w.mag, 0))) : 0;
    const magSize = w ? Math.max(1, num(w.magSize, (def && def.mag) || 1)) : 1;
    const res = w ? Math.max(0, Math.floor(num(w.reserve, 0))) : 0;
    if (C.mag !== (w ? mag : -1)) { C.mag = w ? mag : -1; $.mag.textContent = w ? String(mag) : '--'; }
    if (C.res !== (w ? res : -1)) { C.res = w ? res : -1; $.res.textContent = w ? String(res) : '--'; }
    const rl = num(P && P.reloadT, -1);
    const reloading = !!w && rl >= 0 && rl <= 1;
    setCls($.wpn, 'rl', 'reloading', reloading);
    if (reloading) {
      setScale($.magF, 'magf', clamp01(rl));
      const pc = Math.floor(rl * 100);
      if (C.rlp !== pc) { C.rlp = pc; $.rlPct.textContent = pc + '%'; }
    } else setScale($.magF, 'magf', w ? clamp01(mag / magSize) : 0);
    const fr = mag / magSize;
    setCls($.ammo, 'alow', 'low', !!w && fr <= 0.25 && mag > 0);
    setCls($.ammo, 'aemp', 'empty', !!w && mag <= 0);
    let hint = '';

// ===== world.js =====
// TROLLGUARD — TG.World: level terrain, props, gates, collision, environment.
