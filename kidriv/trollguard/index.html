  function updateWeapons(dt, act) {
    const w = cur();
    if (!w) return;
    const gun = vm ? (vm.guns[P.weaponIndex] || vm.guns[0]) : null;
    const def = w.def;
    const fireHeld = act && Input.mouse.left;
    const firePressed = act && Input.mousePressed[0];
    const aimHeld = act && Input.mouse.right;

    // --- switching input
    wheelCooldown -= dt;
    if (act) {
      const K = Input.pressed;
      if (K.Digit1 || K.Numpad1) requestSwitch(0);
      else if (K.Digit2 || K.Numpad2) requestSwitch(1);
      else if (K.Digit3 || K.Numpad3) requestSwitch(2);
      if (Input.wheel !== 0 && wheelCooldown <= 0 && P.weapons.length > 1) {
        const n = P.weapons.length;
        const base = switchPhase !== 0 ? switchTarget : P.weaponIndex;
        requestSwitch(((base + (Input.wheel > 0 ? 1 : -1)) % n + n) % n);
        wheelCooldown = 0.12;
      }
    }
    // --- switch progress
    if (switchPhase === 1) {
      switchBlend += dt / 0.16;
      if (switchBlend >= 1) {
        switchBlend = 1;
        P.weaponIndex = clamp(switchTarget, 0, P.weapons.length - 1);
        fireTimer = 0.0; bloom = 0; fuelAcc = 0; flameTickT = 0;
        switchPhase = 2;
      }
    } else if (switchPhase === 2) {
      switchBlend -= dt / 0.28;
      if (switchBlend <= 0) { switchBlend = 0; switchPhase = 0; switchTarget = -1; }
    }
    const wc = cur();
    const gc = vm ? (vm.guns[P.weaponIndex] || gun) : null;
    const dc = wc.def;

    // --- reload
    if (act && Input.pressed.KeyR) startReload();
    if (P.reloadT >= 0) {
      reloadElapsed += dt;
      P.reloadT = clamp(reloadElapsed / reloadDur, 0, 1);
      if (reloadElapsed >= reloadDur) finishReload();
    }

    // --- aim down sights
    const canAds = act && aimHeld && P.reloadT < 0 && switchPhase === 0 && throwT < 0 && !sprinting;
    adsBlend = clamp(adsBlend + (canAds ? 1 : -1) * dt / (dc.id === 'sniper' ? 0.2 : 0.16), 0, 1);
    P.ads = adsBlend;
    setScoped(dc.id === 'sniper' && canAds && adsBlend >= 0.97 && P.alive);

    // --- sniper bolt cycle timer
    if (boltT >= 0) { boltT += dt; if (boltT > 1.05) boltT = -1; }

    // --- firing
    const canFire = P.alive && switchPhase === 0 && P.reloadT < 0 && throwT < 0 && sprintBlend < 0.35;
    fireTimer -= dt;
    if (dc.id === 'flame') {
      flameStep(dt, wc, gc, fireHeld && canFire);
      if (fireTimer < 0) fireTimer = 0;
    } else if (dc.auto) {
      const interval = 60 / Math.max(1, dc.rpm || 600);
      if (fireHeld && canFire && wc.mag > 0) {
        if (fireTimer < -interval) fireTimer = -interval;
        let guard = 0;
        while (fireTimer <= 0 && wc.mag > 0 && guard++ < 4) { fireBullet(wc, gc); fireTimer += interval; }
      } else if (fireTimer < 0) fireTimer = 0;
    } else {
      if (firePressed) semiBuffer = 0.2;
      semiBuffer -= dt;
      if (fireTimer < 0) fireTimer = 0;
      if (semiBuffer > 0 && canFire && fireTimer <= 0 && wc.mag > 0 && boltT < 0) {
        semiBuffer = 0;
        fireBullet(wc, gc);
        fireTimer = Math.max(60 / Math.max(1, dc.rpm || 60), 1.05);
      }
    }
    // --- empty handling
    if (wc.mag <= 0) {
      if (wc.reserve > 0) {
        if (P.reloadT < 0 && switchPhase === 0 && P.alive) {
          autoReloadT += dt;
          if (autoReloadT > 0.22 || firePressed) { autoReloadT = 0; startReload(); }
        }
      } else if (firePressed && P.alive && switchPhase === 0 && now - dryT > 0.25) {
        dryT = now;
        audio('dry_fire');
      }
    } else autoReloadT = 0;
    if (!fireHeld && dc.id !== 'flame') stopFlame();

    computeSpread(dt, wc);
  }

  function sceneAdd(n) { const R = TG.R; if (R && R.scene && n) R.scene.add(n); }

  function lightRemove(l) { const R = TG.R; if (R && R.lights && l) { try { R.lights.remove(l); } catch (e) { /* already cleared */ } } }

  function throwGrenade() {
    const R = TG.R;
    if (!R) return;
    const m = worldMeshes();

  function updateGrenades(dt) {
    const W = TG.World;
    for (let i = grenades.length - 1; i >= 0; i--) {
      const g = grenades[i];
      g.fuse -= dt; g.bounceT -= dt;
      const p = g.pos, v = g.vel;
      if (!g.rest) {
        v[1] -= 18 * dt;
        const ox = p[0], oz = p[2];
        p[0] += v[0] * dt; p[1] += v[1] * dt; p[2] += v[2] * dt;
        // props / walls
        if (W && typeof W.resolve === 'function') {
          const bx_ = p[0], bz = p[2];
          W.resolve(p, 0.08);
          const cx = p[0] - bx_, czz = p[2] - bz, cl = Math.hypot(cx, czz);
          if (cl > 1e-4) {
            const nx = cx / cl, nz = czz / cl, vn = v[0] * nx + v[2] * nz;
            if (vn < 0) { v[0] -= 1.5 * vn * nx; v[2] -= 1.5 * vn * nz; v[0] *= 0.6; v[2] *= 0.6; bounceSnd(g, -vn); }
          }
        }
        // trolls
        const list = actorList();
        for (let k = 0; k < list.length; k++) {
          const a = list[k];

          if (d < r && p[1] > a.pos[1] && p[1] < a.pos[1] + (a.height || 2.4)) {

            p[0] = a.pos[0] + nx * r; p[2] = a.pos[2] + nz * r;
            const vn = v[0] * nx + v[2] * nz;
            if (vn < 0) { v[0] -= 1.4 * vn * nx; v[2] -= 1.4 * vn * nz; v[0] *= 0.4; v[2] *= 0.4; bounceSnd(g, -vn); }

  function aimGroundPoint(maxDist) {

  function useAbility() {

      const k = pickups[i];

      setPos(k.node, k.x, y, k.z);

        emit(k.x, y, k.z, 1, 0.1, 0, 0.35, 0, 0.1, 0.6, 0.9, 1.0, 1.5, k.kind === 'ammo' ? C.glowAmmo : C.glowHealth, C.glowEnd, -0.2, 0.5, true, 'soft', 0, 0);
      }

  function assignPickupLight(slot, k) {

  // ================================================================== MOVEMENT & CAMERA
  function updateLook(dt, act) {
    let dx = Input.dx, dy = Input.dy;
    Input.dx = 0; Input.dy = 0;
    const prevYaw = P.yaw, prevPitch = P.pitch;
    if (act) {
      const fovScale = P.scoped ? (fovCur / CFG.baseFov) : (1 - 0.25 * adsBlend);
      const k = CFG.lookRad * sensitivity() * fovScale;
      P.yaw -= dx * k;
      P.pitch -= dy * k;
      // fallback mode: turn when the free cursor rests at the screen edge
      if (Input.fallback && !Input.locked && Input.mouse.inside && typeof window !== 'undefined') {
        const w = window.innerWidth || 1, mx = Input.mouse.x;
        if (mx >= 0) {
          const e = mx < w * 0.04 ? -1 : mx > w * 0.96 ? 1 : 0;
          if (e) P.yaw -= e * 1.7 * sensitivity() * fovScale * dt;
        }
      }
      // recoil application (smoothed)
      const rp = recoilPending * damp(28, dt), ry = recoilYawPending * damp(28, dt);
      P.pitch += rp; P.yaw += ry; recoilPending -= rp; recoilYawPending -= ry; recoilAccum += rp;
      // player pulling down compensates accumulated recoil
      if (dy > 0) recoilAccum = Math.max(0, recoilAccum - dy * k);

      if (now - lastShotT > 0.14 && recoilAccum > 0) {
        const rec = recoilAccum * damp(P.weapons[P.weaponIndex] && P.weapons[P.weaponIndex].def.id === 'sniper' ? 6 : 4.5, dt);
        P.pitch -= rec * 0.85; recoilAccum -= rec;
      }
    } else { recoilPending = 0; recoilYawPending = 0; }
    P.pitch = clamp(P.pitch, -1.5, 1.5);
    if (P.yaw > 1000 || P.yaw < -1000) P.yaw = P.yaw % TAU;
    const inv = dt > 1e-5 ? 1 / dt : 0;
    lookYawRate = U.angleDiff(prevYaw, P.yaw) * inv;
    lookPitchRate = (P.pitch - prevPitch) * inv;
    // scope breathing sway
    const sw = P.scoped ? 1 : 0.0;
    const bm = (crouching ? 0.5 : 1) * (0.6 + 0.4 * clamp(hSpeed / CFG.walk, 0, 1.5));
    breathYaw += ((Math.sin(now * 0.9) * 0.0016 + Math.sin(now * 2.3) * 0.0006) * sw * bm - breathYaw) * damp(6, dt);
    breathPitch += ((Math.sin(now * 1.3 + 1) * 0.0013) * sw * bm - breathPitch) * damp(6, dt);
  }

  function updateMovement(dt, act) {
    const K = Input.keys;

    // stamina
    if (sprinting && hSpeed > 1) {
      P.stamina = Math.max(0, P.stamina - dt * 0.2);
      staminaDelay = 0.7;
      if (P.stamina <= 0) { exhausted = true; sprinting = false; }
    } else {
      staminaDelay -= dt;
      if (staminaDelay <= 0) P.stamina = Math.min(1, P.stamina + dt * 0.26);
    }
    sprintBlend = clamp(sprintBlend + (sprinting ? dt / 0.18 : -dt / 0.14), 0, 1);
    crouchBlend += ((crouching ? 1 : 0) - crouchBlend) * damp(12, dt);
    // eye height
    const eyeT = crouching ? CFG.eyeCrouch : CFG.eyeStand;
    P.eyeHeight += (eyeT - P.eyeHeight) * damp(11, dt);
    // wish velocity
    const sy = Math.sin(P.yaw), cyw = Math.cos(P.yaw);
    let wx = fwdIn * -sy + strafeIn * cyw, wz = fwdIn * -cyw + strafeIn * -sy;
    const wl = Math.hypot(wx, wz);
    if (wl > 1e-4) { wx /= wl; wz /= wl; }
    let speed = CFG.walk * perks.speed;
    if (sprinting) speed = CFG.sprint * perks.speed * perks.sprint;
    else if (crouching) speed = CFG.crouch * perks.speed;
    if (adsBlend > 0) speed *= lerp(1, P.scoped ? 0.5 : 0.7, adsBlend);
    if (fwdIn < 0 && !sprinting) speed *= 0.9;
    const tx = wx * speed, tz = wz * speed;
    const v = P.vel;
    if (P.onGround) {
      const rate = wl > 0 ? 15 : 11;
      const k = damp(rate, dt);
      v[0] += (tx - v[0]) * k; v[2] += (tz - v[2]) * k;
    } else if (wl > 0) {
      // air control: steer toward the wish direction without bleeding momentum much
      const k = damp(2.6, dt);
      const cur2 = Math.hypot(v[0], v[2]);
      v[0] += (tx - v[0]) * k; v[2] += (tz - v[2]) * k;
      const nl = Math.hypot(v[0], v[2]), cap = Math.max(cur2, speed);
      if (nl > cap && nl > 1e-4) { v[0] *= cap / nl; v[2] *= cap / nl; }
    }
    // jump (with coyote time)
    if (P.onGround) coyote = 0.1; else coyote -= dt;
    if (jumpBuffer > 0 && coyote > 0 && P.alive) {
      v[1] = JUMP_V;
      P.onGround = false; coyote = 0; jumpBuffer = 0;
      P.stamina = Math.max(0, P.stamina - 0.04);
      audio('jump', { volume: 0.7 });
    }
    const wasGround = P.onGround;
    if (!P.onGround) v[1] -= CFG.gravity * dt;
    // integrate
    const ox = P.pos[0], oz = P.pos[2];
    const hOld = groundY(ox, oz);
    P.pos[0] += v[0] * dt; P.pos[2] += v[2] * dt; P.pos[1] += v[1] * dt;
    // steep-slope limit (only when grounded; try sliding along one axis)
    if (wasGround) {
      const hNew = groundY(P.pos[0], P.pos[2]);
      const dist = Math.hypot(P.pos[0] - ox, P.pos[2] - oz);
      if (dist > 1e-5 && hNew - hOld > Math.max(0.04, dist * 1.6)) {
        const hx = groundY(P.pos[0], oz), hz = groundY(ox, P.pos[2]);
        if (hx - hOld <= Math.max(0.04, Math.abs(P.pos[0] - ox) * 1.6)) { P.pos[2] = oz; v[2] = 0; }
        else if (hz - hOld <= Math.max(0.04, Math.abs(P.pos[2] - oz) * 1.6)) { P.pos[0] = ox; v[0] = 0; }
        else { P.pos[0] = ox; P.pos[2] = oz; v[0] = 0; v[2] = 0; }
      }
    }
    // soft push out of live trolls
    const list = actorList();
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (!a || !a.alive || !a.pos) continue;
      const ar = (a.radius || 0.7) + CFG.radius;
      const dx = P.pos[0] - a.pos[0], dz = P.pos[2] - a.pos[2];
      if (Math.abs(dx) > ar || Math.abs(dz) > ar) continue;
      if (P.pos[1] > a.pos[1] + (a.height || 2.4) || P.pos[1] + 1.8 < a.pos[1]) continue;
      const d = Math.hypot(dx, dz);
      if (d < ar) {
        const nx = d > 1e-4 ? dx / d : Math.cos(now), nz = d > 1e-4 ? dz / d : Math.sin(now);
        const pen = ar - d, push = Math.min(pen, pen * 0.6 + 0.02);
        P.pos[0] += nx * push; P.pos[2] += nz * push;
        const vn = v[0] * nx + v[2] * nz;
        if (vn < 0) { v[0] -= vn * nx; v[2] -= vn * nz; }
      }
    }
    // world collision (authoritative)
    if (W && typeof W.resolve === 'function') {
      const bx_ = P.pos[0], bz = P.pos[2];
      W.resolve(P.pos, CFG.radius);
      const cx = P.pos[0] - bx_, czz = P.pos[2] - bz, cl = Math.hypot(cx, czz);
      if (cl > 1e-5) {
        const nx = cx / cl, nz = czz / cl, vn = v[0] * nx + v[2] * nz;
        if (vn < 0) { v[0] -= vn * nx; v[2] -= vn * nz; }
      }
    }
    // ground
    const g = groundY(P.pos[0], P.pos[2]);
    hSpeed = Math.hypot(v[0], v[2]);
    if (P.pos[1] <= g) {
      if (!wasGround) land(-v[1]);
      P.pos[1] = g; if (v[1] < 0) v[1] = 0;
      P.onGround = true;
    } else if (wasGround && v[1] <= 0 && P.pos[1] - g < 0.25 + hSpeed * dt * 1.2) {
      P.pos[1] = g; v[1] = 0; P.onGround = true; // stick to the ground going downhill
    } else {
      P.onGround = false;
    }
    airTime = P.onGround ? 0 : airTime + dt;
    // head-bob + footsteps
    const moving = P.onGround && hSpeed > 0.5;
    const bobT = moving ? clamp(hSpeed / CFG.walk, 0, 1.6) : 0;
    bobAmt += (bobT - bobAmt) * damp(8, dt);
    if (moving) {
      const stride = sprinting ? 1.25 : crouching ? 0.7 : 0.95;
      const prev = bobPhase;
      bobPhase += hSpeed * dt / stride * PI;
      if (Math.floor(prev / PI) !== Math.floor(bobPhase / PI)) footstep(sprinting ? 0.85 : crouching ? 0.3 : 0.55);
      if (bobPhase > TAU * 64) bobPhase -= TAU * 64;
    }
    // strafe roll
    const rightVel = v[0] * cyw + v[2] * -sy;
    strafeRoll += (-rightVel / 8 * 0.03 - strafeRoll) * damp(8, dt);
  }

  function footstep(vol) {
    const W = TG.World;
    audio((W && W.footstep) || 'footstep', { volume: vol });
  }

  function land(impact) {
    if (impact > 2) {
      landV -= Math.min(impact, 22) * 0.018;
      if (impact > 3.5) { audio('land', { volume: clamp(impact / 12, 0.3, 1) }); footstep(0.6); }
      if (impact > 11) Player.shake(Math.min(0.4, (impact - 11) * 0.05));
    }
  }

  function updateCamera(dt) {
    const R = TG.R;
    if (!R || !R.camera) return;
    const cam = R.camera;
    // landing spring
    landV += (-140 * landY - 16 * landV) * dt; landY += landV * dt;
    landY = clamp(landY, -0.35, 0.15);
    // damage punch springs
    punchPV += (-150 * punchP - 16 * punchPV) * dt; punchP += punchPV * dt;
    punchYV += (-150 * punchY - 16 * punchYV) * dt; punchY += punchYV * dt;
    // shake
    trauma = Math.max(0, trauma - dt * 1.4);
    const s = trauma * trauma, t = now * 23;
    const shY = 0.045 * s * (U.noise2(t, 1.3) * 2 - 1);
    const shP = 0.045 * s * (U.noise2(t, 7.7) * 2 - 1);
    const shR = 0.06 * s * (U.noise2(t, 13.1) * 2 - 1);
    const shX = 0.06 * s * (U.noise2(t, 21.7) * 2 - 1);
    // bob
    const ab = 1 - 0.75 * adsBlend;
    const bobY = (Math.abs(Math.sin(bobPhase)) - 0.5) * 0.05 * bobAmt * ab * (sprinting ? 1.35 : 1);
    const bobR = Math.cos(bobPhase) * 0.004 * bobAmt * ab;
    let eye = P.eyeHeight + landY + bobY;
    let roll = strafeRoll + bobR + shR;
    let pitch = P.pitch + breathPitch + punchP + shP;
    let yaw = P.yaw + breathYaw + punchY + shY;
    if (!P.alive) {
      deathT += dt;
      const d = ease(deathT / 1.2);
      eye = lerp(P.eyeHeight, 0.35, d);
      roll = lerp(roll, 0.6, d);
      pitch = lerp(pitch, -0.25, d * 0.7);
    }
    let gy = P.pos[1] + eye;
    if (!P.alive) gy = Math.max(gy, groundY(P.pos[0], P.pos[2]) + 0.3);
    if (!Array.isArray(cam.pos)) cam.pos = [0, 0, 0];
    basis(yaw, 0, _cf, _cr, _cu);
    cam.pos[0] = P.pos[0] + _cr[0] * shX;
    cam.pos[1] = gy;
    cam.pos[2] = P.pos[2] + _cr[2] * shX;
    cam.yaw = yaw; cam.pitch = pitch; cam.roll = roll;
    // fov
    const w = cur();
    const def = w ? w.def : null;
    let fovT = CFG.baseFov + CFG.sprintFov * sprintBlend;
    if (def && adsBlend > 0) {
      if (def.id === 'sniper') fovT = P.scoped ? (def.adsFov || 14) : lerp(fovT, 50, adsBlend);
      else fovT = lerp(fovT, def.adsFov || 60, ease(adsBlend));
    }
    if (P.scoped) fovCur = fovT; else fovCur += (fovT - fovCur) * damp(14, dt);
    cam.fov = fovCur;
    // camera basis for viewmodel->world mapping
    basis(cam.yaw, cam.pitch, _cf, _cr, _cu);
    const A = TG.Audio;
    if (A && typeof A.setListener === 'function') A.setListener(cam.pos, cam.yaw);
  }

  // ================================================================== PUBLIC API
  function findClass(classId) {
    const list = (TG.Data && TG.Data.classes) || [];
    for (let i = 0; i < list.length; i++) if (list[i].id === classId) return list[i];
    return list[0] || null;
  }

  function resetTransient() {
    stopFlame();
    if (P.scoped) setScoped(false);
    P.scoped = false;
    cancelReload();
    switchPhase = 0; switchBlend = 0; switchTarget = -1;
    fireTimer = 0; semiBuffer = 0; bloom = 0; adsBlend = 0; P.ads = 0; boltT = -1; flashT = 0; throwT = -1;
    kickZ = kickZV = kickP = kickPV = swayYaw = swayPitch = 0;
    recoilPending = recoilYawPending = recoilAccum = 0;
    trauma = 0; punchP = punchPV = punchY = punchYV = 0; landY = landV = 0;
    bobAmt = 0; strafeRoll = 0; sprintBlend = 0; jumpBuffer = 0; coyote = 0; airTime = 0;
    breathYaw = breathPitch = 0; deathT = 0; autoReloadT = 0; fuelAcc = 0;
    P.vel[0] = P.vel[1] = P.vel[2] = 0;
    hSpeed = 0;
    if (Input.endFrame) Input.endFrame();
    Input.dx = Input.dy = 0;
  }

  function setLowHp(on) {
    if (on === lowhpOn) return;
    lowhpOn = on;
    ui('setEffect', 'lowhp', on);
    audioLoop('heartbeat', on);
  }
  function clearEffects() {
    if (effectOn) { ui('setEffect', effectOn, false); effectOn = null; }
    setLowHp(false);
  }

  Player.reset = function (classId) {
    const cd = findClass(classId);
    P.classDef = cd;
    perks = Object.assign({}, PERK_DEFAULTS, (cd && cd.perks) || {});
    P.perks = perks;
    P.maxHp = cd && cd.hp > 0 ? cd.hp : 100;
    P.hp = P.maxHp;
    P.alive = true;
    deathReported = false;
    P.stamina = 1; exhausted = false; staminaDelay = 0;
    P.eyeHeight = CFG.eyeStand; crouching = false; sprinting = false; crouchBlend = 0;
    P.onGround = true;
    const defs = (TG.Data && TG.Data.weapons) || [];
    P.weapons = defs.map((def) => {
      const magSize = Math.max(1, Math.round((def.mag || 1) * perks.magSize));
      const reserveMax = Math.max(0, Math.round((def.reserve || 0) * perks.reserveAmmo));
      return { def: def, mag: magSize, reserve: reserveMax, magSize: magSize, reserveMax: reserveMax };
    });
    P.weaponIndex = 0;
    P.reloadT = -1;
    P.ability = { def: cd ? cd.ability : null, cd: 0, active: 0 };
    P.stats = { shots: 0, hits: 0, headshots: 0, damageTaken: 0 };
    P.spread = P.weapons[0] ? (P.weapons[0].def.spread || 0) : 0;
    lastDamageT = -100;
    clearAbilityObjects();
    clearEffects();
    resetTransient();
    attachViewmodel();
    recolorHands(cd);
    fovCur = CFG.baseFov;
  };

  Player.spawn = function (x, z, yaw) {
    x = +x || 0; z = +z || 0;
    P.pos[0] = x; P.pos[2] = z; P.pos[1] = groundY(x, z);
    P.yaw = typeof yaw === 'number' && yaw === yaw ? yaw : 0;
    P.pitch = 0;
    P.onGround = true;
    clearAbilityObjects();
    if (effectOn) { ui('setEffect', effectOn, false); effectOn = null; }
    if (P.ability) P.ability.active = 0;
    resetTransient();
    fovCur = CFG.baseFov;
    attachViewmodel();
    updateCamera(0);
  };

  Player.refill = function () {
    P.hp = P.maxHp;
    P.alive = true;
    deathReported = false;
    deathT = 0;
    P.stamina = 1; exhausted = false;
    for (let i = 0; i < P.weapons.length; i++) { const w = P.weapons[i]; w.mag = w.magSize; w.reserve = w.reserveMax; }
    cancelReload();
    if (P.ability) { P.ability.cd = 0; P.ability.active = 0; }
    clearEffects();
    lastDamageT = -100;
  };

  Player.update = function (dt, time) {
    if (!P.classDef) Player.reset(null);
    dt = +dt;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    now += dt;
    const act = Input._enabled && P.alive;
    // ability key
    if (act && Input.pressed.KeyQ) useAbility();
    updateLook(dt, act);
    updateMovement(dt, act);
    updateCamera(dt);           // camera first so muzzle/vfx positions match this frame
    updateWeapons(dt, act);
    updateAbilities(dt);
    updatePickups(dt);
    // regen
    if (P.alive && perks.regen > 0 && now - lastDamageT > 4 && P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + perks.regen * dt);
    setLowHp(P.alive && P.hp > 0 && P.hp / P.maxHp < 0.3);
    updateViewmodel(dt);
    Input.endFrame();
  };

  Player.damage = function (amount, fromPos) {
    amount = +amount;
    if (!P.alive || !(amount > 0)) return;
    const amt = amount * (perks.damageTaken || 1);
    P.hp = Math.max(0, P.hp - amt);
    P.stats.damageTaken += amt;
    lastDamageT = now;
    let angle = 0;
    if (Array.isArray(fromPos) && fromPos.length >= 3) {
      const dx = fromPos[0] - P.pos[0], dz = fromPos[2] - P.pos[2];
      if (dx * dx + dz * dz > 1e-6) angle = U.angleDiff(P.yaw, U.yawTo(P.pos[0], P.pos[2], fromPos[0], fromPos[2]));
      // view punch away from the hit
      punchYV -= Math.sin(angle) * Math.min(1.5, amt * 0.06);
    }
    ui('damage', angle);
    punchPV += Math.min(2.5, amt * 0.08);
    Player.shake(Math.min(0.5, amt / 45));
    if (P.hp <= 0) {
      P.hp = 0;
      P.alive = false;
      deathT = 0;
      stopFlame();
      setScoped(false);
      cancelReload();
      setLowHp(false);
      audio('death');
      if (!deathReported) {
        deathReported = true;
        const G = TG.Game;
        if (G && typeof G.onPlayerDeath === 'function') G.onPlayerDeath();
      }
      return;
    }
    if (now - hurtSndT > 0.22) { hurtSndT = now; audio('hurt', { volume: clamp(0.5 + amt / 40, 0.5, 1) }); }
  };

  Player.heal = function (n) {
    n = +n;
    if (!P.alive || !(n > 0)) return;
    P.hp = Math.min(P.maxHp, P.hp + n);
  };

  Player.addAmmo = function (frac) {
    frac = +frac;
    if (!(frac > 0)) return;
    for (let i = 0; i < P.weapons.length; i++) {
      const w = P.weapons[i];
      w.reserve = Math.min(w.reserveMax, w.reserve + Math.ceil(w.reserveMax * frac));
      if (frac >= 1 && P.reloadT < 0) w.mag = w.magSize; // full resupply also tops up magazines
    }
  };

  Player.shake = function (amount) {
    amount = +amount;
    if (!(amount > 0)) return;
    trauma = Math.min(1, trauma + amount);
  };

  Player.spawnPickup = function (kind, x, z) {
    if (kind !== 'ammo' && kind !== 'health') return;
    const R = TG.R;
    if (!R || !R.node) return;
    x = +x || 0; z = +z || 0;
    const m = worldMeshes();
    const y = groundY(x, z);
    const root = R.node({ pos: [x, y + 0.42, z], rot: [0, rnd() * TAU, 0], scale: 1, castShadow: true });
    if (kind === 'ammo') {
      root.add(R.node({ mesh: m.ammo, mat: m.crateMat, pos: [0, 0, 0], rot: [0, 0, 0], scale: 1, castShadow: true }));
      root.add(R.node({ mesh: m.ammoStrip, mat: m.ammoGlow, pos: [0, 0, 0], rot: [0, 0, 0], scale: 1 }));
    } else {
      root.add(R.node({ mesh: m.health, mat: m.crateMat, pos: [0, 0, 0], rot: [0, 0, 0], scale: 1, castShadow: true }));
      root.add(R.node({ mesh: m.healthStrip, mat: m.healthGlow, pos: [0, 0, 0], rot: [0, 0, 0], scale: 1 }));
    }
    sceneAdd(root);
    pickups.push({ kind: kind, node: root, x: x, y: y, z: z, t: 0, phase: rnd() * TAU, glowT: rnd() * 0.3 });
  };

  Player.clearPickups = function () {
    for (let i = 0; i < pickups.length; i++) sceneRemove(pickups[i].node);
    pickups.length = 0;
    lightRemove(pickupLights[0]); lightRemove(pickupLights[1]);
    pickupLights[0] = pickupLights[1] = null;
  };

  TG.Input = Input;
  TG.Player = Player;
})();

<script>
// ===== game.js =====
// TROLLGUARD — game glue: frame loop, waves, bosses, gates, radio chatter, progression.
(function () {
  'use strict';
  const U = TG.util, D = TG.Data;
  const SAVE_KEY = 'trollguard.save.v1';
  const MAX_ALIVE = 12;

  const Game = {
    state: 'boot',
    settings: { sensitivity: 1, volume: 0.8, music: 0.6, quality: 'high' },
    progress: { unlocked: 0 },
    hud: { score: 0, kills: 0, enemiesLeft: 0, levelIndex: 0, stageIndex: 0, levelName: '', stageName: '', objectivePos: null, combo: 0 },
  };
  TG.Game = Game;

  // ------------------------------------------------------------------ run state
  let classId = 'haeren', levelIndex = 0, stageIndex = 0, loadedLevel = -1;
  let phase = 'idle', phaseT = 0, waveIndex = -1, spawnQueue = [], spawnT = 0;
  let boss = null, bossHalfSaid = false, hintThrower = false, hintBrute = false;
  let stats = { score: 0, kills: 0, headshots: 0, time: 0 };
  let combo = 0, comboT = 0, time = 0, last = 0, menuT = 0;
  let radioQ = [], radioT = 0, lowHpT = 0, lowAmmoT = 0, sapT = 0, streakT = 0;
  let timers = [];
  const seenErrors = {};

  const safe = (fn) => { try { return fn(); } catch (e) { const k = String(e && e.message); if (!seenErrors[k]) { seenErrors[k] = 1; console.error('[TROLLGUARD]', e); } } };
  const after = (sec, fn) => timers.push({ t: sec, fn });
  const level = () => D.levels[levelIndex];
  const stageDef = () => level().stages[stageIndex];
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (o && o[k] != null ? o[k] : ''));

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ settings: Game.settings, progress: Game.progress })); } catch (e) { /* file:// may block */ } }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (s) { Object.assign(Game.settings, s.settings || {}); Object.assign(Game.progress, s.progress || {}); }
    } catch (e) { /* ignore */ }
    Game.progress.unlocked = U.clamp(Game.progress.unlocked | 0, 0, D.levels.length - 1);
  }

  Game.applySettings = function () {
    safe(() => TG.Audio.setVolume(Game.settings.volume));
    safe(() => TG.Audio.setMusicVolume(Game.settings.music));
    safe(() => TG.R.setQuality(Game.settings.quality));
    save();
  };

  // ------------------------------------------------------------------ radio
  function radio(text, vars, urgent) {
    const line = fmt(text, vars);
    if (urgent) radioQ.unshift(line); else if (radioQ.length < 4) radioQ.push(line);
  }
  function radioPick(key, vars, urgent) { const arr = D.radio[key]; if (arr && arr.length) radio(U.pick(arr), vars, urgent); }
  function updateRadio(dt) {
    radioT -= dt;
    if (radioT <= 0 && radioQ.length) {
      const line = radioQ.shift();
      safe(() => TG.UI.radio(D.leader, line));
      safe(() => TG.Audio.say(line));
      radioT = 2.2 + line.length * 0.055;
    }
  }

  // ------------------------------------------------------------------ level / stage flow
  function syncHud() {
    const h = Game.hud;
    h.score = stats.score; h.kills = stats.kills; h.combo = combo;
    h.levelIndex = levelIndex; h.stageIndex = stageIndex;
    h.levelName = level().name; h.stageName = stageDef().name;
  }

  function loadLevel(li, si, done) {
    levelIndex = U.clamp(li | 0, 0, D.levels.length - 1);
    stageIndex = U.clamp(si | 0, 0, 3);
    Game.state = 'loading';
    TG.Input.enabled = false;
    safe(() => TG.UI.showLoading('DEPLOYING TO ' + level().name));
    setTimeout(() => {
      safe(() => TG.Actors.reset());
      safe(() => TG.Player.clearPickups());
      if (loadedLevel !== levelIndex) {
        safe(() => TG.R.scene.clear());
        safe(() => TG.World.load(levelIndex));
        loadedLevel = levelIndex;
      }
      safe(() => TG.Actors.setTheme(level().theme));
      safe(() => TG.Audio.ambience(level().theme));
      safe(() => TG.UI.hideLoading());
      done();
    }, 60);
  }

  function placePlayer() {
    const st = TG.World.stages[stageIndex];
    safe(() => TG.World.setUnlocked(stageIndex));
    safe(() => TG.Player.spawn(st.playerStart[0], st.playerStart[1], st.playerYaw || 0));
  }

  function enterPlay() {
    Game.state = 'playing';
    TG.Input.enabled = true;
    safe(() => TG.UI.showHUD());
    safe(() => TG.Input.lock());
  }

  function beginStage(k, withLevelIntro) {
    stageIndex = k;
    phase = 'intro'; phaseT = withLevelIntro ? 6.5 : 3.5;
    waveIndex = -1; spawnQueue = []; boss = null; bossHalfSaid = false;
    syncHud();
    Game.hud.objectivePos = null;
    safe(() => TG.UI.hideBossBar());
    const sd = stageDef();
    if (withLevelIntro) {
      safe(() => TG.UI.banner(level().name, level().tagline, 'level'));
      after(3.4, () => safe(() => TG.UI.banner(sd.name, 'STAGE ' + (k + 1) + ' OF 4', 'stage')));
      (D.radio.levelStart[levelIndex] || []).forEach((l) => radio(l));
    } else {
      safe(() => TG.UI.banner(sd.name, 'STAGE ' + (k + 1) + ' OF 4', 'stage'));
    }
    safe(() => TG.UI.objective('Secure ' + sd.name + ' — eliminate all trolls'));
    safe(() => TG.Audio.music('explore'));
    safe(() => TG.Audio.play('objective'));
  }

  function startWave(i) {
    waveIndex = i;
    const w = stageDef().waves[i];
    spawnQueue = [];
    for (const type in w) for (let n = 0; n < w[type]; n++) spawnQueue.push(type);
    for (let n = spawnQueue.length - 1; n > 0; n--) { const j = (Math.random() * (n + 1)) | 0; const t = spawnQueue[n]; spawnQueue[n] = spawnQueue[j]; spawnQueue[j] = t; }
    spawnT = 0.2;
    phase = 'waves';
    safe(() => TG.Audio.music('combat'));
    if (i > 0) radioPick('waveStart');
    if (w.thrower && !hintThrower) { hintThrower = true; radioPick('throwers'); }
    if (w.brute && !hintBrute) { hintBrute = true; radioPick('brutes'); }
    safe(() => TG.UI.objective('Wave ' + (i + 1) + ' of ' + stageDef().waves.length + ' — eliminate all trolls'));
  }

  function spawnOne(type) {
    const p = TG.Player.pos;
    let sp = safe(() => TG.World.spawnPoint(stageIndex, [p[0], p[2]], 22));
    if (!sp) { const st = TG.World.stages[stageIndex]; sp = U.pick(st.spawnPoints); }
    safe(() => TG.Actors.spawn(type, sp[0], sp[1]));
  }

  function startBoss() {
    const b = stageDef().boss;
    phase = 'bossIntro'; phaseT = 3.2;
    safe(() => TG.UI.banner(b.name, b.title, 'boss'));
    safe(() => TG.Audio.music('boss'));
    safe(() => TG.Audio.play('boss_spawn'));
    radioPick(b.big ? 'bigBossIntro' : 'bossIntro', { boss: b.name }, true);
    safe(() => TG.UI.objective('Destroy ' + b.name + ', ' + b.title));
  }

  function spawnBoss() {
    const b = stageDef().boss, st = TG.World.stages[stageIndex], p = TG.Player.pos;
    let sp = st.bossSpawn;
    if (U.dist2D(sp[0], sp[1], p[0], p[2]) < 18) sp = safe(() => TG.World.spawnPoint(stageIndex, [p[0], p[2]], 28)) || sp;
    boss = safe(() => TG.Actors.spawnBoss(b, sp[0], sp[1])) || null;
    phase = 'boss';
    safe(() => TG.Audio.play('boss_roar', { pos: [sp[0], TG.World.height(sp[0], sp[1]) + 3, sp[1]] }));
  }

  function bossDown(actor) {
    const b = stageDef().boss;
    phase = 'cleared'; phaseT = 4.0;
    safe(() => TG.UI.hideBossBar());
    safe(() => TG.Audio.play('stage_clear'));
    safe(() => TG.Audio.music('explore'));
    radioPick('bossDead', { boss: b.name }, true);
    safe(() => TG.UI.banner(stageIndex === 3 ? level().name + ' SECURED' : stageDef().name + ' SECURED', b.name + ' destroyed', 'clear'));
    // remaining helpers turn to stone with their master
    const list = TG.Actors.list.slice();
    for (const a of list) if (a !== actor && a.alive) safe(() => TG.Actors.damage(a, 1e7, { type: 'explosion' }));
    if (actor && actor.pos) {
      safe(() => TG.Player.spawnPickup('health', actor.pos[0] + 1.5, actor.pos[2]));
      safe(() => TG.Player.spawnPickup('ammo', actor.pos[0] - 1.5, actor.pos[2]));
      safe(() => TG.Player.spawnPickup('ammo', actor.pos[0], actor.pos[2] + 1.5));
    }
    boss = null;
  }

  function afterCleared() {
    if (stageIndex < 3) {
      const next = level().stages[stageIndex + 1], nst = TG.World.stages[stageIndex + 1];
      safe(() => TG.World.openGate(stageIndex));
      radioPick('advance', { place: next.name });
      safe(() => TG.UI.objective('Advance to ' + next.name));
      safe(() => TG.Audio.play('objective'));
      Game.hud.objectivePos = [nst.center[0], TG.World.height(nst.center[0], nst.center[1]) + 2, nst.center[1]];
      phase = 'advance';
    } else {
      levelDone();
    }
  }

  function runStats() {
    const ps = (TG.Player && TG.Player.stats) || {};
    return { score: stats.score, kills: stats.kills, headshots: stats.headshots, time: stats.time, levelName: level().name,
      accuracy: ps.shots ? U.clamp((ps.hits || 0) / ps.shots, 0, 1) : 0 };
  }

  function levelDone() {
    const isLast = levelIndex >= D.levels.length - 1;
    phase = 'idle';
    Game.state = isLast ? 'victory' : 'levelcomplete';
    TG.Input.enabled = false;
    if (!isLast) Game.progress.unlocked = Math.max(Game.progress.unlocked, levelIndex + 1);
    save();
    radio(D.radio.levelDone[levelIndex] || '', null, true);
    safe(() => TG.Audio.loop('flame_loop', false));
    safe(() => TG.Audio.music('victory'));
    safe(() => TG.Audio.play('level_complete'));
    safe(() => TG.Input.unlock());
    if (isLast) safe(() => TG.UI.showVictory(runStats())); else safe(() => TG.UI.showLevelComplete(runStats(), false));
  }

  function updateFlow(dt) {
    const P = TG.Player, A = TG.Actors;
    stats.time += dt;
    const alive = safe(() => A.aliveCount()) || 0;
    Game.hud.enemiesLeft = alive + spawnQueue.length + (phase === 'bossIntro' ? 1 : 0);

    if (phase === 'intro') {
      phaseT -= dt;
      if (phaseT <= 0) startWave(0);
    } else if (phase === 'waves') {
      spawnT -= dt;
      if (spawnQueue.length && spawnT <= 0 && alive < MAX_ALIVE) { spawnOne(spawnQueue.pop()); spawnT = 0.55; }
      if (!spawnQueue.length && alive === 0) {
        if (waveIndex + 1 < stageDef().waves.length) { phase = 'lull'; phaseT = 2.5; } else startBoss();
      }
      // point the player at stragglers
      if (!spawnQueue.length && alive > 0 && alive <= 3) {
        let best = null, bd = 1e9;
        for (const a of A.list) if (a.alive) { const d = U.dist2D(a.pos[0], a.pos[2], P.pos[0], P.pos[2]); if (d < bd) { bd = d; best = a; } }
        Game.hud.objectivePos = best && bd > 25 ? [best.pos[0], best.pos[1] + (best.height || 2), best.pos[2]] : null;
      } else Game.hud.objectivePos = null;
    } else if (phase === 'lull') {
      phaseT -= dt;
      if (phaseT <= 0) startWave(waveIndex + 1);
    } else if (phase === 'bossIntro') {
      phaseT -= dt;
      if (phaseT <= 0) spawnBoss();
    } else if (phase === 'boss') {
      if (boss && boss.alive) {
        const b = stageDef().boss, f = U.clamp(boss.hp / (boss.maxHp || b.hp), 0, 1);
        safe(() => TG.UI.bossBar(b.name, b.title, f));
        if (!bossHalfSaid && f < 0.5) { bossHalfSaid = true; radioPick('bossHalf', { boss: b.name }); }
        const d = U.dist2D(boss.pos[0], boss.pos[2], P.pos[0], P.pos[2]);
        Game.hud.objectivePos = d > 45 ? [boss.pos[0], boss.pos[1] + (boss.height || 5), boss.pos[2]] : null;
      } else if (!boss) { bossDown(null); }
    } else if (phase === 'cleared') {
      phaseT -= dt;
      if (phaseT <= 0) afterCleared();
    } else if (phase === 'advance') {
      const nst = TG.World.stages[stageIndex + 1];
      const d = U.dist2D(nst.center[0], nst.center[1], P.pos[0], P.pos[2]);
      if (d < nst.radius * 0.8) beginStage(stageIndex + 1, false);
    }

    // chatter
    comboT -= dt; if (comboT <= 0) combo = 0;
    lowHpT -= dt; lowAmmoT -= dt; sapT -= dt; streakT -= dt;
    if (P.alive && P.hp < P.maxHp * 0.3 && lowHpT <= 0) { lowHpT = 35; radioPick('lowHealth'); }
    const w = P.weapons && P.weapons[P.weaponIndex];
    if (w && w.reserve === 0 && w.mag < w.magSize * 0.3 && lowAmmoT <= 0) { lowAmmoT = 40; radioPick('lowAmmo'); }
    syncHud(); // (Player module owns the low-health effect + heartbeat)
  }

  // ------------------------------------------------------------------ public API
  Game.start = function (cid, li) {
    classId = cid || classId;
    safe(() => TG.Audio.init());
    safe(() => TG.Audio.play('ui_start'));
    stats = { score: 0, kills: 0, headshots: 0, time: 0 };
    combo = 0; radioQ = []; timers = []; hintThrower = hintBrute = false;
    safe(() => TG.Audio.stopSpeech());
    loadLevel(li || 0, 0, () => {
      safe(() => TG.Player.reset(classId));
      placePlayer();
      enterPlay();
      beginStage(0, true);
    });
  };

  Game.pause = function () {
    if (Game.state !== 'playing') return;
    Game.state = 'paused';
    TG.Input.enabled = false;
    safe(() => TG.Audio.loop('flame_loop', false));
    safe(() => TG.Audio.loop('heartbeat', false));
    safe(() => TG.Input.unlock());
    safe(() => TG.UI.showPause());
  };

  Game.resume = function () {
    if (Game.state !== 'paused') return;
    safe(() => TG.UI.hidePause());
    enterPlay();
  };

  Game.restartStage = function () {
    if (!TG.World.stages || !TG.World.stages.length) return;
    timers = []; radioQ = [];
    safe(() => TG.UI.hidePause());
    safe(() => TG.Audio.stopSpeech());
    safe(() => TG.Actors.reset());
    safe(() => TG.Player.clearPickups());
    safe(() => TG.Player.refill());
    placePlayer();
    enterPlay();
    beginStage(stageIndex, false);
  };

  Game.nextLevel = function () {
    if (levelIndex >= D.levels.length - 1) return Game.toMenu();
    timers = []; radioQ = [];
    loadLevel(levelIndex + 1, 0, () => {
      safe(() => TG.Player.refill());
      placePlayer();
      enterPlay();
      beginStage(0, true);
    });
  };

  Game.toMenu = function () {
    timers = []; radioQ = []; phase = 'idle'; boss = null;
    Game.state = 'menu';
    TG.Input.enabled = false;
    safe(() => TG.Input.unlock());
    safe(() => TG.Audio.stopSpeech());
    safe(() => TG.Audio.loop('flame_loop', false));
    safe(() => TG.Audio.loop('heartbeat', false));
    safe(() => TG.Actors.reset());
    safe(() => TG.Player.clearPickups());
    safe(() => TG.R.viewmodel.set(null));
    safe(() => TG.UI.hideAll());
    safe(() => TG.UI.showMenu());
    safe(() => TG.Audio.music('menu'));
  };

  Game.onEnemyKilled = function (actor, info) {
    if (!actor) return;
    const def = actor.def || {};
    combo = Math.min(combo + 1, 99); comboT = 4;
    const pts = Math.round((def.score || 100) * (1 + Math.min(combo - 1, 10) * 0.1) * (info && info.head ? 1.5 : 1));
    stats.score += pts; stats.kills++;
    if (info && info.head) stats.headshots++;
    safe(() => TG.UI.hitmarker('kill'));
    safe(() => TG.Audio.play('kill_confirm'));
    safe(() => TG.UI.killfeed((actor.name || def.name || 'Troll') + (info && info.head ? '  HEADSHOT' : '') + '  +' + pts));
    if (actor === boss || (actor.isBoss && phase === 'boss')) { bossDown(actor); return; }
    // drops
    const P = TG.Player, r = Math.random();
    const needHp = P.hp < P.maxHp * 0.5;
    if (r < (needHp ? 0.2 : 0.08)) safe(() => P.spawnPickup('health', actor.pos[0], actor.pos[2]));
    else if (r < (needHp ? 0.36 : 0.26)) safe(() => P.spawnPickup('ammo', actor.pos[0], actor.pos[2]));
    if (classId === 'sap' && sapT <= 0 && Math.random() < 0.3) { sapT = 14; radioPick('sap'); }
    else if (combo === 6 && streakT <= 0) { streakT = 30; radioPick('killStreak'); }
  };

  Game.onPlayerDeath = function () {
    if (Game.state !== 'playing') return;
    Game.state = 'dead';
    TG.Input.enabled = false;
    radioQ = [];
    radioPick('death', null, true);
    safe(() => TG.Audio.loop('flame_loop', false));
    safe(() => TG.Audio.loop('heartbeat', false));
    safe(() => TG.Audio.music('defeat'));
    safe(() => TG.UI.setEffect('lowhp', false));
    after(2.2, () => { if (Game.state === 'dead') { safe(() => TG.Input.unlock()); safe(() => TG.UI.showDeath(runStats())); } });
  };

  Game.onPointerLockLost = function () { if (Game.state === 'playing') Game.pause(); };

  // testing helpers (console): TG.Game.debug.killAll(), .stage(n), .god()
  Game.debug = {
    killAll() { for (const a of TG.Actors.list.slice()) if (a.alive) TG.Actors.damage(a, 1e7, { type: 'explosion' }); },
    skipWaves() { spawnQueue = []; waveIndex = stageDef().waves.length - 1; this.killAll(); },
    stage(n) { stageIndex = U.clamp(n | 0, 0, 3); Game.restartStage(); },
    god() { TG.Player.maxHp = TG.Player.hp = 1e6; },
    info() { return { state: Game.state, phase, levelIndex, stageIndex, waveIndex, queue: spawnQueue.length, alive: TG.Actors.aliveCount(), fps: TG.R.stats && TG.R.stats.fps }; },
  };

  // ------------------------------------------------------------------ frame loop
  function menuCamera(dt) {
    const st = TG.World.stages && TG.World.stages[0];
    if (!st) return;
    menuT += dt;
    const a = menuT * 0.05 + 0.6, r = 34;
    const x = st.center[0] + Math.sin(a) * r, z = st.center[1] + Math.cos(a) * r;
    const cam = TG.R.camera;
    cam.pos[0] = x; cam.pos[2] = z; cam.pos[1] = TG.World.height(x, z) + 7.5 + Math.sin(menuT * 0.2) * 0.8;
    cam.yaw = U.yawTo(x, z, st.center[0], st.center[1]) + 0.35;
    cam.pitch = -0.02; cam.roll = 0; cam.fov = 62;
  }

  // never let a troll stand inside the camera: push the player out of troll bodies
  function keepClear() {
    const P = TG.Player, list = TG.Actors.list;
    if (!P.alive) return;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (!a.alive) continue;
      const dx = P.pos[0] - a.pos[0], dz = P.pos[2] - a.pos[2], min = (a.radius || 0.7) + 0.55;
      const d2 = dx * dx + dz * dz;
      if (d2 < min * min) {
        const d = Math.sqrt(d2) || 0.001, k = (min - d) / d;
        P.pos[0] += dx * k; P.pos[2] += dz * k;
        TG.World.resolve(P.pos, 0.45);
      }
    }
  }

  function step(dt, now) {
    for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; if (Game.state !== 'paused') t.t -= dt; if (t.t <= 0) { timers.splice(i, 1); safe(t.fn); } }
    const s = Game.state;
    if (s === 'playing') {
      time += dt;
      safe(() => TG.Player.update(dt, time));
      safe(() => TG.Actors.update(dt, time));
      safe(keepClear);
      safe(() => TG.World.update(dt, time));
      safe(() => updateFlow(dt));
      updateRadio(dt);
      safe(() => TG.UI.update(dt));
      safe(() => TG.R.render(dt, time));
    } else if (s === 'dead') {
      time += dt;
      safe(() => TG.Player.update(dt, time));
      safe(() => TG.Actors.update(dt * 0.4, time));
      safe(() => TG.World.update(dt, time));
      updateRadio(dt);
      safe(() => TG.UI.update(dt));
      safe(() => TG.R.render(dt, time));
    } else if (s === 'paused') {
      safe(() => TG.R.render(0, time));
    } else if (s === 'levelcomplete' || s === 'victory') {
      time += dt;
      safe(() => TG.World.update(dt, time));
      updateRadio(dt);
      safe(() => TG.R.render(dt, time));
    } else if (s === 'menu') {
      time += dt;
      menuCamera(dt);
      safe(() => TG.World.update(dt, time));
      safe(() => TG.R.render(dt, time));
    }
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const now = ts / 1000;
    const dt = Math.min(0.05, Math.max(0, now - last));
    last = now;
    step(dt, now);
  }

  function boot() {
    const canvas = document.getElementById('gl');
    load();
    safe(() => TG.UI.init());
    const ok = safe(() => TG.R.init(canvas));
    if (!ok) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:20px system-ui;background:#00205B;text-align:center;padding:40px;z-index:99';
      d.textContent = 'TROLLGUARD needs WebGL2. Please open this file in a current version of Chrome, Edge, Firefox or Safari.';
      document.body.appendChild(d);
      return;
    }
    safe(() => TG.R.setQuality(Game.settings.quality));
    safe(() => TG.Input.init(canvas));
    TG.Input.enabled = false;
    safe(() => TG.R.scene.clear());
    safe(() => TG.World.load(0));
    loadedLevel = 0;
    Game.state = 'menu';
    safe(() => TG.UI.showMenu());
    const firstGesture = () => {
      safe(() => TG.Audio.init());
      Game.applySettings();
      if (Game.state === 'menu') safe(() => TG.Audio.music('menu'));
      window.removeEventListener('pointerdown', firstGesture, true);
      window.removeEventListener('keydown', firstGesture, true);
    };
    window.addEventListener('pointerdown', firstGesture, true);
    window.addEventListener('keydown', firstGesture, true);
    window.addEventListener('keydown', (e) => {
      if ((e.code === 'Escape' || e.code === 'KeyP') && Game.state === 'playing' && (e.code === 'KeyP' || !document.pointerLockElement)) Game.pause();
    });
    window.addEventListener('resize', () => safe(() => TG.R.resize()));
    window.addEventListener('blur', () => { if (Game.state === 'playing') Game.pause(); });
    requestAnimationFrame((ts) => { last = ts / 1000; requestAnimationFrame(frame); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
